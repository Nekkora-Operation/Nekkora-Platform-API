# Proxy de borda da stack E2E: ORIGEM UNICA (https://localhost:<porta>), TLS com certificado descartavel gerado
# por execucao, primeira camada de limite (limit_req por IP/rota; a segunda e o limitador Redis das aplicacoes).
# X-Forwarded-For e SOBRESCRITO com o IP da conexao (nunca acrescentado): as aplicacoes so confiam neste proxy.
# O log de acesso registra so metodo e caminho sem query ($uri), status e tempo: nunca cookie, cabecalho ou corpo.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    client_max_body_size 8k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format nekkora '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout nekkora;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=geral:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=agente:10m rate=100r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream platform {
        server platform:8081;
    }

    upstream portal {
        server portal:8082;
    }

    upstream agent {
        server agent-gateway:8083;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # canal da maquina (025): lotes de eventos de ate 2 MiB; zona de taxa propria
        location /agent/api/v1/ {
            client_max_body_size 2m;
            # processo do canal fora: falha rapido (502) e a maquina reenvia os mesmos fatos depois
            proxy_connect_timeout 2s;
            limit_req zone=agente burst=200 nodelay;
            proxy_pass http://agent;
        }

        location /portal/api/v1/ {
            limit_req zone=geral burst=20 nodelay;
            proxy_pass http://portal;
        }

        location ~ ^/api/v1/o/[^/]+/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://platform;
        }

        location /api/v1/ {
            limit_req zone=geral burst=20 nodelay;
            proxy_pass http://platform;
        }

        location / {
            return 404;
        }
    }
}
