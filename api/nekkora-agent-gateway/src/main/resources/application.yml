# Canal da maquina (Platform-Agent 1.0) - configuracao. Segredos SO por ambiente: NEKKORA_GATEWAY_DB_URL, NEKKORA_GATEWAY_DB_SENHA.
# Credencial exclusiva do nekkora_ingestion; este processo NAO recebe as credenciais do nekkora_platform nem do portal.
spring:
  application:
    name: nekkora-agent-gateway
  main:
    banner-mode: off
  data:
    redis:
      host: ${NEKKORA_REDIS_HOST:localhost}
      port: ${NEKKORA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: ${NEKKORA_PORTA:8083}
  forward-headers-strategy: none
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    accesslog:
      enabled: false

nekkora:
  trusted-proxies: ${NEKKORA_PROXIES_CONFIAVEIS:127.0.0.1/32,::1/128}
  database:
    url: ${NEKKORA_GATEWAY_DB_URL}
    user: ${NEKKORA_GATEWAY_DB_USUARIO:nekkora_ingestion}
    password: ${NEKKORA_GATEWAY_DB_SENHA}
    max-pool-size: ${NEKKORA_GATEWAY_DB_POOL:10}
  limits:
    batches-per-minute: ${NEKKORA_GATEWAY_LOTES_POR_MINUTO:600}
    redeem-failures-per-hour: ${NEKKORA_GATEWAY_RESGATES_RECUSADOS_POR_HORA:20}
    credential-days: ${NEKKORA_GATEWAY_VALIDADE_CREDENCIAL_DIAS:90}
    catalog-reads-per-minute: ${NEKKORA_GATEWAY_CATALOGO_POR_MINUTO:60}
  # PLATFORM-CLIENT-EXECUCAO-REMOTA-001: desligado por padrao. Ligado, um codigo de pareamento marcado habilita a maquina a
  # receber execucoes solicitadas pela Platform. Tem de ter o mesmo valor no servico da Platform.
  remote-execution:
    enabled: ${NEKKORA_EXECUCAO_REMOTA:false}
    # T01b: a maquina habilitada renova a propria credencial quando faltarem ate estes dias para o vencimento
    renewal-window-days: ${NEKKORA_EXECUCAO_REMOTA_RENOVACAO_DIAS:30}
    # T02: prazo da comunicacao de uma tentativa (ponto de partida de laboratorio). Vencido, a comunicacao esta perdida;
    # isso nao muda o estado nem encerra a tentativa
    lease-seconds: ${NEKKORA_EXECUCAO_REMOTA_LEASE_SEGUNDOS:90}
    # 053: depois de o prazo da comunicacao vencer, quanto esperar antes de encerrar a tentativa como sem confirmacao.
    # Tem de ter o mesmo valor na Platform
    lost-minutes: ${NEKKORA_EXECUCAO_REMOTA_SEM_COMUNICACAO_MINUTOS:120}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
    org.apache.catalina: WARN
    com.zaxxer.hikari: WARN
    org.postgresql: WARN
    io.lettuce: WARN
