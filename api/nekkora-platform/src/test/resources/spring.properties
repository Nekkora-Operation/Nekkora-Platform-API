# Cada contexto Spring guardado no cache dos testes mantem o proprio pool (ate 10 conexoes) aberto. Com o cache padrao
# (32 contextos) e a ordem das classes do Linux, o PostgreSQL de teste esgotava as conexoes ("remaining connection slots
# are reserved"). Com 4, os contextos menos usados sao fechados, junto com o pool.
spring.test.context.cache.maxSize=4
