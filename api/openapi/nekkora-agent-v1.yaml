openapi: 3.1.0
info:
  title: Nekkora Agent Gateway v1 (canal da maquina)
  version: 1.0.0
  description: >
    Lado da MAQUINA do contrato Platform-Agent 1.0 (docs/relatorios/2026-10-28-platform-agent-contrato.md), servido pelo
    processo nekkora-agent-gateway (papel de banco nekkora_ingestion). O lado das pessoas (codigos, autorizacoes, consultas)
    fica em nekkora-api-v1.yaml, tag "Canal do Agent". Autenticacao: credencial de maquina (Authorization: Bearer nka1...);
    cookie, sessao e CSRF da Platform nao valem aqui. Toda chamada declara a versao do contrato (cabecalho
    Nekkora-Agent-Contract, versao maior 1; outra: 400 unsupported_contract). Corpo JSON estrito: chave duplicada ou
    profundidade acima de 8: 400. Toda credencial invalida (formato, organizacao trocada, segredo, revogada, vencida, Agent
    nao ativo, sem associacao ao Worker) e o mesmo 401. Falhas de autenticacao contam por IP de origem (429). HTTPS com lotes
    e ACK; o Agent sempre inicia a conexao. Uma falha da API, do Redis ou do banco nunca pede reexecucao: o Agent reenvia os
    mesmos fatos.
servers:
  - url: https://{host}
    description: Gateway publico (/agent/api/v1 encaminhado ao processo nekkora-agent-gateway)
    variables:
      host: { default: homologacao.nekkora.test }
security:
  - machineCredential: []
tags:
  - name: Maquina

paths:
  /agent/api/v1/enrollments/redeem:
    post:
      tags: [Maquina]
      operationId: redeemEnrollment
      summary: 'Resgata o codigo de pareamento ou de rotacao com o segredo gerado pela maquina'
      description: >
        O segredo da credencial (credentialSecret, 32 bytes base64url) e gerado pelo Agent e viaja uma vez; o servidor guarda o
        SHA-256 e nunca devolve segredo. Idempotente pelo par (codigo, segredo): repetir com o mesmo segredo devolve o mesmo
        resultado (resposta perdida nao tranca a maquina); outro segredo: 401. Pareamento: cria o Agent ACTIVE, a associacao
        com o Worker e a credencial (90 dias), conferindo na transacao a autoridade ATUAL de quem criou o codigo, a organizacao
        ativa e o Worker livre (ocupado: 409). Rotacao: exige tambem a credencial atual (Authorization; vencida aceita, revogada
        nao) e revoga a anterior (motivo 1) na mesma transacao. A credencial e nka1.<organizationId>.<credentialId>.<segredo>.
      security: [ {}, { machineCredential: [] } ]
      parameters: [ { $ref: '#/components/parameters/Contract' }, { $ref: '#/components/parameters/Intent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RedeemRequest' } } } }
      x-intencao: >
        PLATFORM-AGENT-V2-002 (T06): com Nekkora-Agent-Intent, o codigo de outro proposito e recusado DEPOIS de conferidos o
        codigo, o prazo e a organizacao, sem consumir o codigo nem alterar o vinculo: 409 conflict + reason
        pairing_code_for_rotation (codigo de pareamento enviado como renovacao) ou rotation_code_for_pairing (codigo de renovacao
        enviado como pareamento). Sem o cabecalho (Agent anterior), o comportamento e o de antes, exceto codigo de pareamento com
        Authorization: 409 conflict (Worker indisponivel), em vez de criar outro Agent.
      x-execucao-remota: >
        PLATFORM-CLIENT-EXECUCAO-REMOTA-001 (T01a): pair-remote e a confirmacao, feita NA MAQUINA, de que ela passa a receber
        execucoes solicitadas pela Platform. So vale com um codigo de pareamento MARCADO para isso por quem administra o vinculo
        e o Worker; o resgate cria o vinculo e a habilitacao na mesma transacao e a resposta traz remoteExecution true. Codigo e
        intencao precisam casar, e a recusa vem DEPOIS de conferidos o codigo, o prazo e a organizacao, sem consumir o codigo:
        codigo marcado sem pair-remote (pair, ou sem cabecalho) -> 409 conflict + reason remote_code_without_enablement; codigo
        comum com pair-remote -> 409 + code_not_for_remote_execution; codigo de rotacao com pair-remote -> 409 +
        rotation_code_for_pairing; recurso desligado no servidor -> 409 + remote_execution_unavailable. Entrar no aplicativo
        com a conta de uma pessoa nao habilita a maquina; nenhuma rota habilita uma maquina ja pareada.
      responses:
        '200': { description: 'Maquina pareada (ou credencial rotacionada); Cache-Control no-store', content: { application/json: { schema: { $ref: '#/components/schemas/Redeemed' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/heartbeat:
    post:
      tags: [Maquina]
      operationId: heartbeat
      summary: 'Presenca, versao e capacidades'
      description: >
        Atualiza o ultimo contato e a versao informada e grava as capacidades (lista fechada). Recomendado a cada 60 s. A
        AUSENCIA de heartbeat nunca encerra execucao, nunca muda estado e nunca libera Worker.
        PLATFORM-CLIENT-EXECUCAO-REMOTA-001 (T01a, aditivo): a maquina habilitada pode enviar "remote" (ocupada, pouco espaco
        em disco), que vale ate o proximo batimento (sem "remote": falso), e recebe "remote.receiving", a referencia do
        recebimento de novos trabalhos. Maquina nao habilitada e Agent anterior: pedido e resposta de sempre.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatRequest' } } } }
      responses:
        '200': { description: 'Presenca registrada', content: { application/json: { schema: { $ref: '#/components/schemas/Presence' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/receiving:
    post:
      tags: [Maquina]
      operationId: setRemoteReceiving
      summary: 'A maquina pausa ou retoma o recebimento de novos trabalhos (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T01a)'
      description: >
        So a propria maquina, pela credencial, pausa (PAUSED) ou retoma (ENABLED) o recebimento de execucoes solicitadas pela
        Platform. Pausar nao cancela o que estiver em andamento e nao encerra o vinculo. Idempotente: repetir o mesmo valor
        devolve 200 sem novo registro de auditoria. Maquina pareada mas nao habilitada: 409 conflict + reason
        remote_execution_not_enabled. Nao ha Worker, Agent nem organizacao no corpo: a autoridade vem so da credencial.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteReceiving' } } } }
      responses:
        '200': { description: 'Recebimento atual', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteReceiving' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/next:
    get:
      tags: [Maquina]
      operationId: nextRemoteWork
      summary: 'A maquina pergunta o que ha para ela (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T02)'
      description: >
        Entrega no maximo UMA coisa. attempt: a tentativa que e desta maquina e ela ainda nao recebeu, com o token e a epoca da
        atribuicao (o token aparece SO aqui) e o prazo da comunicacao. cancel: a tentativa que ela ja recebeu e cuja
        solicitacao teve o cancelamento pedido (a maquina para e informa CANCELLED). Nada a fazer: objeto vazio. Antes de
        entregar, o servidor REVALIDA as condicoes da solicitacao (Worker autorizado no ambiente, maquina habilitada e
        compativel, autorizacao vigente da versao para este Worker): se algo deixou de valer, a tentativa fica REFUSED com o
        motivo e nada e entregue. Maquina pausada: nada e entregue (a tentativa espera ate o prazo da oferta e entao expira).
        Perguntar de novo antes de confirmar o recebimento entrega a MESMA tentativa com token e epoca novos: os anteriores
        deixam de valer. Maquina nao habilitada: 409 + remote_execution_not_enabled. Entregar nao prova recebimento.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      responses:
        '200': { description: 'O que ha para a maquina', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteNext' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/ack:
    post:
      tags: [Maquina]
      operationId: ackRemoteAttempt
      summary: 'A maquina confirma que recebeu a tentativa (T02)'
      description: >
        Depois de gravar a tentativa no proprio diario. OFFERED vira RECEIVED. Idempotente com o mesmo token e epoca. Token ou
        epoca que nao sao os vigentes: 409 conflict + reason remote_attempt_stale, e nada e alterado. Tentativa de outra maquina
        ou inexistente: 404. Tentativa ja encerrada pelo servidor (cancelada, recusada, expirada): 200 com proceed false.
        Receber nao prova inicio.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptWrite' } } } }
      responses:
        '200': { description: 'Situacao da tentativa', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptStatus' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/state:
    post:
      tags: [Maquina]
      operationId: reportRemoteAttemptState
      summary: 'A maquina informa o estado da tentativa e renova o prazo (T02)'
      description: >
        Estados que a maquina informa: PREPARING, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, REFUSED (com
        refusalReason da lista da maquina) e ENDED_UNKNOWN (a maquina voltou, o processo nao esta mais rodando e nao ha prova do
        resultado). exitCode so em SUCCEEDED, FAILED e TIMED_OUT. Repetir o estado atual so renova o prazo. Transicao nao
        permitida: 409 + remote_attempt_transition. Token ou epoca que nao sao os vigentes: 409 + remote_attempt_stale; nada e
        alterado. ANTES DE INICIAR (STARTING) o servidor revalida: cancelamento pedido -> a tentativa fica CANCELLED;
        autorizacao revogada ou vencida, Worker fora do ambiente ou maquina desabilitada -> fica REFUSED com o motivo. Nos dois
        casos a resposta traz proceed false e a maquina NAO inicia. cancelRequested true: a pessoa pediu o cancelamento; a
        maquina para e informa CANCELLED. O prazo vencido so quer dizer comunicacao perdida: nao muda o estado.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptStateWrite' } } } }
      responses:
        '200': { description: 'Situacao da tentativa', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptStatus' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/results/{number}:
    put:
      tags: [Maquina]
      operationId: uploadRemoteAttemptResult
      summary: 'A maquina envia um arquivo de resultado da tentativa (T03)'
      description: >
        Um arquivo que a automacao gravou na pasta de saida, enviado depois que a execucao iniciou (em geral, depois do termino).
        Corpo: os bytes do arquivo (Content-Length obrigatorio, ate 20 MiB). Cabecalhos: Nekkora-Attempt-Token e
        Nekkora-Attempt-Epoch (continuam valendo depois do termino), Nekkora-Result-Name (o nome RELATIVO a pasta de saida, com /
        como separador, em UTF-8 com escape de URL; sem .., sem barra invertida, sem caminho absoluto, ate 200 caracteres) e
        Nekkora-Result-Sha256. number: 1 a 50. O servidor confere o SHA-256 contra os bytes que chegaram; divergencia, nome ou
        numero fora do formato: 400 e nada e gravado. Tentativa que nao iniciou: 409 + remote_attempt_transition. Repetir o MESMO
        arquivo no mesmo numero (resposta perdida) responde created false e nao muda nada; outro arquivo no mesmo numero, nome
        repetido, ou envio depois do fechamento: 409 + remote_result_conflict. Passar de 50 MiB no total: 409 +
        remote_result_limit, e nada e gravado. Armazenamento fora: 503. Enviar resultado NAO muda o estado da tentativa.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: Nekkora-Attempt-Token, in: header, required: true, schema: { type: string } }
        - { name: Nekkora-Attempt-Epoch, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Nekkora-Result-Name, in: header, required: true, schema: { type: string } }
        - { name: Nekkora-Result-Sha256, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '200':
          description: 'Arquivo guardado (ou ja guardado)'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [number, fileName, sizeBytes, sha256, created]
                properties:
                  number: { type: integer }
                  fileName: { type: string }
                  sizeBytes: { type: integer }
                  sha256: { type: string }
                  created: { type: boolean }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/results/complete:
    post:
      tags: [Maquina]
      operationId: completeRemoteAttemptResults
      summary: 'A maquina fecha o envio de resultados da tentativa (T03)'
      description: >
        Depois que a tentativa que iniciou TERMINOU (antes: 409 + remote_attempt_transition). sent: quantos arquivos a maquina
        enviou - tem de ser o que o servidor recebeu (um envio perdido aparece aqui: 409 + remote_result_conflict).
        skippedByLimit: quantos ela deixou de enviar por limite (de quantidade, de tamanho por arquivo ou do total). Repetir o
        mesmo fechamento nao muda nada; outro: 409 + remote_result_conflict. Depois do fechamento nenhum arquivo e aceito.
        Fechar NAO muda o estado da tentativa.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, epoch, sent, skippedByLimit]
              properties:
                token: { type: string }
                epoch: { type: integer, minimum: 1 }
                sent: { type: integer, minimum: 0, maximum: 50 }
                skippedByLimit: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 'Envio fechado'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sent, skippedByLimit]
                properties:
                  sent: { type: integer }
                  skippedByLimit: { type: integer }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/logs:
    post:
      tags: [Maquina]
      operationId: sendRemoteAttemptLogs
      summary: 'A maquina envia um lote de linhas da saida do processo da tentativa (T05)'
      description: >
        Linhas que o processo da automacao escreveu na saida padrao (STDOUT) e na saida de erro (STDERR), e avisos do proprio
        aplicativo (EXECUTOR), na ordem em que a maquina as capturou. So de tentativa que INICIOU (antes: 409 +
        remote_attempt_transition) e ate o fechamento do envio. Lote: 1 a 200 linhas, ate 256 KiB de texto; linha: ate 8 KiB em
        UTF-8, sem quebra de linha nem caractere de controle (tabulacao pode); truncated diz que a maquina cortou a linha no
        limite. sequence: 1 em diante, continua dentro do lote; o lote comeca, no maximo, na linha seguinte a ultima guardada
        (buraco: 409 + remote_log_conflict). Linha ja guardada com o mesmo conteudo e ignorada (lote repetido depois de resposta
        perdida); com outro conteudo: 409 + remote_log_conflict. Passar de 50.000 linhas ou de 20 MiB por tentativa: 409 +
        remote_log_limit, nada do lote e gravado e a maquina conta o excedente como descartado no fechamento. STDERR e um canal,
        nao um nivel: nenhuma linha e classificada pelo texto. Antes de gravar, o servidor remove credencial de maquina, codigo de
        pareamento, cabecalho de autorizacao e o token da atribuicao. Com a tentativa em andamento, o lote renova o prazo da
        comunicacao. Enviar registro NAO muda o estado da tentativa. So existe registro de tentativa remota: execucao iniciada no
        proprio computador nao tem rota aqui.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, epoch, lines]
              properties:
                token: { type: string }
                epoch: { type: integer, minimum: 1 }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [sequence, capturedAt, channel, message]
                    properties:
                      sequence: { type: integer, minimum: 1 }
                      capturedAt: { type: string, format: date-time }
                      channel: { type: string, enum: [STDOUT, STDERR, EXECUTOR] }
                      truncated: { type: boolean }
                      message: { type: string }
      responses:
        '200':
          description: 'Lote guardado (ou ja guardado)'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received, stored, lastSequence]
                properties:
                  received: { type: integer, description: 'Linhas do lote' }
                  stored: { type: integer, description: 'Linhas novas gravadas (as repetidas nao contam)' }
                  lastSequence: { type: integer, description: 'A ultima linha que a Platform tem desta tentativa' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/logs/complete:
    post:
      tags: [Maquina]
      operationId: completeRemoteAttemptLogs
      summary: 'A maquina fecha o envio dos registros da tentativa (T05)'
      description: >
        Depois que a tentativa que iniciou TERMINOU (antes: 409 + remote_attempt_transition). lines: quantas linhas a maquina
        enviou - tem de ser o que o servidor recebeu (um lote perdido aparece aqui: 409 + remote_log_conflict). droppedLines:
        quantas linhas ela DESCARTOU por limite (a captura nao para: o excedente e lido e contado, nao guardado). Repetir o mesmo
        fechamento nao muda nada; outro: 409 + remote_log_conflict. Depois do fechamento nenhuma linha e aceita. Fechar NAO muda
        o estado da tentativa.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, epoch, lines, droppedLines]
              properties:
                token: { type: string }
                epoch: { type: integer, minimum: 1 }
                lines: { type: integer, minimum: 0, maximum: 50000 }
                droppedLines: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 'Envio fechado'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [lines, droppedLines]
                properties:
                  lines: { type: integer }
                  droppedLines: { type: integer }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/attempts/{attempt}/package:
    get:
      tags: [Maquina]
      operationId: downloadRemoteAttemptPackage
      summary: 'A maquina baixa o pacote da tentativa que recebeu (T03)'
      description: >
        Os bytes do ZIP da versao FIXADA na solicitacao (a impressao congelada nela), so para a maquina da tentativa, com o token
        e a epoca vigentes nos cabecalhos Nekkora-Attempt-Token e Nekkora-Attempt-Epoch (nunca na URL), e so entre o recebimento e
        o inicio (estado RECEIVED ou PREPARING; fora disso 409 + remote_attempt_transition). Token ou epoca que nao sao os
        vigentes: 409 + remote_attempt_stale. O servidor rele e confere os bytes pelo SHA-256 a cada download; ausentes ou
        corrompidos: 409 + remote_package_unavailable (a maquina recusa a tentativa com PACKAGE_INVALID). Armazenamento fora: 503.
        A resposta traz Nekkora-Package-Sha256; a maquina confere o tamanho, o SHA-256 e a impressao ANTES de usar - download
        parcial nunca e executavel. Baixar renova o prazo da comunicacao. Nenhuma outra versao, pacote ou tentativa e alcancavel:
        alem das conferencias acima, o BANCO so mostra ao canal da maquina o pacote fixado na tentativa da propria maquina
        (a que a credencial autenticou), e so enquanto a tentativa esta em RECEIVED ou PREPARING.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Nekkora-Attempt-Token, in: header, required: true, schema: { type: string } }
        - { name: Nekkora-Attempt-Epoch, in: header, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 'Bytes do pacote'
          headers:
            Nekkora-Package-Sha256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'SHA-256 dos bytes' }
          content: { application/zip: { schema: { type: string, format: binary } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/python-environments:
    put:
      tags: [Maquina]
      operationId: publishPythonInventory
      summary: 'A maquina habilitada publica o inventario de Python (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T01c)'
      description: >
        Substitui, numa transacao, o retrato do Python que a maquina disse ter. Por ambiente: um identificador OPACO derivado na
        maquina (43 caracteres base64url, estavel para o mesmo ambiente na mesma maquina), a versao, o tipo e o instante da
        observacao. NENHUM caminho, nome de usuario, lista de pacotes ou outro campo e aceito: campo a mais, valor fora do
        formato, identificador repetido ou mais de 32 ambientes -> 400 e nada muda. Lista vazia e valida (a maquina nao achou
        Python). Maquina vinculada mas nao habilitada: 409 conflict + reason remote_execution_not_enabled. Limite: 6 publicacoes
        por minuto por maquina (429 com Retry-After). Publicar nao escolhe ambiente nem autoriza execucao.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PythonInventory' } } } }
      responses:
        '200': { description: 'Retrato gravado', content: { application/json: { schema: { $ref: '#/components/schemas/PythonInventoryPublished' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/remote/credential/renew:
    post:
      tags: [Maquina]
      operationId: renewMachineCredential
      summary: 'A maquina habilitada renova a propria credencial (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T01b)'
      description: >
        Sem pessoa e sem codigo: a maquina prova a posse da credencial ATUAL (Authorization) e envia o segredo novo, gerado
        nela (credentialSecret, mesmo formato do resgate). Numa transacao: a anterior e revogada (motivo MACHINE_RENEWAL,
        autoria da maquina) e a nova e emitida com o mesmo prazo e o mesmo emissor da anterior; o vinculo, o Worker e a
        habilitacao nao mudam. A credencial nova e nka1.<organizationId>.<credentialId>.<segredo novo>. So dentro da janela
        (por padrao, 30 dias antes do vencimento): antes disso, 409 conflict + reason credential_renewal_not_due. Credencial
        VENCIDA ou revogada: 401 - nunca volta a valer; a saida e habilitar a maquina de novo. Resposta perdida: repetir com a
        credencial ANTERIOR e o MESMO segredo novo devolve a mesma credencial nova (unica situacao em que uma credencial
        revogada e aceita, e so para repetir a troca que a revogou); com outro segredo: 401. Maquina vinculada mas nao
        habilitada para execucao remota: 409 + remote_execution_not_enabled (o Agent anterior continua usando o codigo de
        rotacao). Recurso desligado: 409 + remote_execution_unavailable. O token de uma pessoa nunca e aceito aqui.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewCredentialRequest' } } } }
      responses:
        '200': { description: 'Credencial nova (inclusive na repeticao); Cache-Control no-store', content: { application/json: { schema: { $ref: '#/components/schemas/RenewedCredential' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/link/unlink:
    post:
      tags: [Maquina]
      operationId: unlinkMachine
      summary: 'A maquina encerra o PROPRIO vinculo (PLATFORM-AGENT-V2-004, T13)'
      description: >
        Encerra o vinculo da credencial autenticada: revoga as credenciais do Agent (motivo MACHINE_UNLINK), encerra a
        associacao ativa com o Worker e marca o Agent como revogado, com a propria maquina como autora (sem pessoa). O Worker
        fica livre, com workspaces, autorizacoes de execucao local e historico. Pedidos de execucao abertos deste Agent: no prazo,
        REFUSED com AGENT_UNLINKED; vencidos, EXPIRED; aceitos e nao iniciados, NOT_STARTED; aceitos e INICIADOS (listados em
        launchedRunRequests), continuam ACCEPTED. A autoridade vem SO da credencial: agentId no corpo apenas confere o vinculo
        esperado (diferente: 400, sem efeito); nao ha Worker nem organizacao no corpo. Idempotente por operationId: a repeticao
        da mesma operacao com a mesma credencial recebe o mesmo 200 mesmo depois de a credencial ter sido revogada por ELA
        (resposta perdida); essa e a unica rota que aceita uma credencial revogada, e so para a operacao que a revogou. Vinculo
        ja encerrado de outro modo: 409 conflict com reason link_ended_by_machine ou link_ended_by_administration (so para quem
        prova o segredo daquela credencial). Credencial substituida por rotacao, segredo errado ou formato invalido: 401, que
        NAO prova o desvinculo. Protocolo: docs/platform-agent-v2-004/t13-desvinculo-remoto.md.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnlinkRequest' } } } }
      responses:
        '200': { description: 'Vinculo encerrado por esta operacao (inclusive na repeticao)', content: { application/json: { schema: { $ref: '#/components/schemas/Unlinked' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: 'O vinculo desta credencial ja terminou de outro modo (reason link_ended_by_machine | link_ended_by_administration). Nada mudou agora', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict, reason: link_ended_by_administration } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/authorizations:
    get:
      tags: [Maquina]
      operationId: listAuthorizations
      summary: 'Autorizacoes de execucao local ATIVAS do Worker da maquina'
      description: >
        Nao revogadas, no prazo e com o Worker ainda autorizado no workspace. O Agent as guarda para executar offline dentro do
        validUntil. Limite declarado: uma revogacao so alcanca a maquina no proximo download.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      responses:
        '200': { description: 'Autorizacoes', content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizationList' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/catalog:
    get:
      tags: [Maquina]
      operationId: machineCatalog
      summary: 'Catalogo de metadados do subconjunto autorizado ao Worker da maquina (PLATFORM-AGENT-CATALOGO-001; migration 036)'
      description: >
        So leitura; nao concede nada (consultar nao autoriza publicar, baixar, aprovar nem executar). Organizacao, Worker e
        vinculo vem SO da credencial. Uma automacao aparece se, e somente se, o Worker esta ATIVO e tem AGORA ao menos uma
        autorizacao local vigente para ela (o mesmo criterio de /authorizations), em workspace e automacao ativos; uma versao
        aparece se, e somente se, esta PUBLICADA e tem uma autorizacao de pacote vigente. coverage = WORKER_AUTHORIZED_SUBSET:
        nao e a lista da organizacao, e a ausencia de um projeto nao prova que ele nao existe. Ordem: (workspaceId,
        automationId), estavel diante de renomeacao. Cada pagina autentica e filtra de novo; o cursor e so posicao, preso a
        organizacao, ao Worker e ao Agent da credencial (outro vinculo: 400). Sem foto consistente entre paginas: uma mudanca
        concorrente pode tirar ou incluir uma automacao entre duas paginas. Cache-Control no-store. Nada e gravado. Cota por
        Agent (429 + Retry-After). Worker nao ativo: 403.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: 'Automacoes por pagina' }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 400, pattern: '^[A-Za-z0-9_-]+$' }, description: 'nextCursor da pagina anterior' }
      responses:
        '200': { description: 'Uma pagina', content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Worker da maquina nao ativo', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/catalog/automations/{automationId}:
    get:
      tags: [Maquina]
      operationId: machineCatalogAutomation
      summary: 'Consulta direta de uma automacao do catalogo da maquina (revalidar a escolha antes de concluir)'
      description: >
        Mesma politica do catalogo, para uma automacao. 404 se ela nao e visivel a esta maquina AGORA (o mesmo corpo para
        inexistente, de outra organizacao, de outro Worker, revogada ou vencida): a resposta nunca confirma a existencia.
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: automationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'A automacao visivel', content: { application/json: { schema: { $ref: '#/components/schemas/CatalogSingle' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Worker da maquina nao ativo', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { description: 'Nao visivel a esta maquina agora', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/runs:
    post:
      tags: [Maquina]
      operationId: registerRun
      summary: 'Registra a execucao local (idempotente por Agent + agentExecutionId)'
      description: >
        Workspace, automacao, versao e Worker vem da AUTORIZACAO, nunca do corpo. A autorizacao precisa ser do Worker da
        maquina e o pacote, o dela (senao 403). Repetir o registro devolve o mesmo runId (200) e aplica o relatorio do supervisor
        enviado com as regras do relatorio; o mesmo agentExecutionId com outra autorizacao ou outro pacote: 409. Autorizacao
        revogada ou vencida no momento do registro: o fato e ACEITO e marcado (authorizationStateAtRegistration). Pacote sem
        versao publicada nao e registravel (nao ha autorizacao para ele).
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '200': { description: 'Ja registrada', content: { application/json: { schema: { $ref: '#/components/schemas/Registered' } } } }
        '201': { description: 'Registrada', content: { application/json: { schema: { $ref: '#/components/schemas/Registered' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/run-requests:
    get:
      tags: [Maquina]
      operationId: listRunRequests
      summary: 'Pedidos de execucao desta maquina ainda sem desfecho de decisao (030)'
      description: >
        REQUESTED/DELIVERED no prazo e ACCEPTED (para a maquina reconciliar). A primeira leitura marca DELIVERED; cada leitura conta
        uma entrega. Os vencidos sem decisao passam a EXPIRED aqui (instante do servidor). Entregar NAO e iniciar. Ate 50 itens.
      parameters: [ { $ref: '#/components/parameters/Contract' } ]
      responses:
        '200': { description: 'Pedidos', content: { application/json: { schema: { $ref: '#/components/schemas/RunRequestList' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/run-requests/{runRequestId}/decision:
    post:
      tags: [Maquina]
      operationId: decideRunRequest
      summary: 'Decisao da maquina sobre um pedido seu (030): ACCEPTED, REFUSED ou NOT_STARTED'
      description: >
        ACCEPTED so no prazo e sem revogacao (senao 409 EXPIRED/REVOKED). Repetir a mesma decisao: 200 UNCHANGED (confirmacao
        perdida). Decisao diferente da registrada: 409 CONFLICT, nada muda. NOT_STARTED: aceito e o processo comprovadamente nao
        criado. Pedido de outra maquina ou inexistente: 404 (sem revelar).
      parameters:
        - { $ref: '#/components/parameters/Contract' }
        - { name: runRequestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunRequestDecision' } } } }
      responses:
        '200': { description: 'APPLIED ou UNCHANGED', content: { application/json: { schema: { $ref: '#/components/schemas/RunRequestDecisionResult' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'EXPIRED, REVOKED ou CONFLICT: nada foi decidido agora', content: { application/json: { schema: { $ref: '#/components/schemas/RunRequestDecisionResult' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/runs/{agentExecutionId}/supervisor:
    post:
      tags: [Maquina]
      operationId: reportSupervisor
      summary: 'Relatorio do supervisor: o UNICO caminho que muda o estado da execucao'
      description: >
        Transicoes do Agent (READY->STARTING->RUNNING->terminal; READY->BLOCKED/CANCELLED; STARTING->BLOCKED/FAILED/CANCELLED/
        OUTCOME_UNKNOWN; RUNNING->SUCCEEDED/FAILED/CANCELLED/TIMED_OUT/OUTCOME_UNKNOWN): APPLIED. Igual ao atual: UNCHANGED.
        Estado anterior ao atual (relatorio atrasado): STALE, nada muda. Contradicao (outro terminal depois de um terminal, o
        mesmo terminal com outros dados, transicao proibida): CONFLICT, nada muda, registrado, resposta 409 com o estado vigente.
        OUTCOME_UNKNOWN e terminal e continua desconhecido. Instantes do relogio do Agent guardados como informados.
      parameters: [ { $ref: '#/components/parameters/Contract' }, { $ref: '#/components/parameters/AgentExecutionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupervisorReport' } } } }
      responses:
        '200': { description: 'APPLIED, UNCHANGED ou STALE', content: { application/json: { schema: { $ref: '#/components/schemas/Reported' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'CONFLICT registrado; o estado nao mudou', content: { application/json: { schema: { $ref: '#/components/schemas/Reported' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/api/v1/runs/{agentExecutionId}/events:
    post:
      tags: [Maquina]
      operationId: ingestEvents
      summary: 'Lote de envelopes nekkora-agent/observability 1.0.0 com ACK depois do commit'
      description: >
        Ate 500 envelopes e 2 MiB por lote, ate 25.000 por execucao, cota de lotes por organizacao (429 com Retry-After).
        Validacao igual a do Agent (1.0.x estrito; 1.y descarta e conta campos novos; outra versao maior recusada); um
        evento invalido e recusado sozinho. Identidade (execucao, sequence): mesmo conteudo canonico = DUPLICATE; outro
        conteudo = CONFLICT (o original fica; recusa registrada). declaredMissing: numeros que o Agent nunca vai entregar
        (perda local); nunca contam como recebidos; sobre evento gravado: CONFLICT. ACK: storedThrough (1..k gravados) e
        settledThrough (1..k gravados ou declarados ausentes). Fora de ordem: gravado pela sequence, o ACK so avanca sobre
        intervalo continuo. Retomada: reenviar a partir de settledThrough + 1; ACK perdido devolve DUPLICATE e o mesmo ACK.
        Falha antes do commit: 5xx SEM ACK e nada gravado. Eventos do Framework nunca mudam o estado da execucao.
      parameters: [ { $ref: '#/components/parameters/Contract' }, { $ref: '#/components/parameters/AgentExecutionId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventBatch' } } } }
      responses:
        '200': { description: 'Lote confirmado (commit feito)', content: { application/json: { schema: { $ref: '#/components/schemas/Ack' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    machineCredential:
      type: http
      scheme: bearer
      bearerFormat: 'nka1.<organization_id>.<credential_id>.<segredo base64url de 32 bytes>'
  parameters:
    Intent: { name: Nekkora-Agent-Intent, in: header, required: false, schema: { type: string, enum: [pair, rotate, pair-remote] }, description: 'T06: intencao do resgate (pair = Parear com a Platform; rotate = Renovar credencial). EXECUCAO-REMOTA-001 T01a: pair-remote = parear E habilitar esta maquina para execucao remota (so com codigo marcado). Ausente: Agent anterior. Outro valor: 400' }
    Contract: { name: Nekkora-Agent-Contract, in: header, required: true, schema: { type: string, pattern: '^1\.[0-9]{1,3}$' }, description: 'versao do contrato (maior 1)' }
    AgentExecutionId: { name: agentExecutionId, in: path, required: true, schema: { type: string, pattern: '^ex-[0-9a-f]{32}$' } }
  responses:
    InvalidRequest: { description: 'Corpo, cabecalho de contrato (unsupported_contract) ou parametro invalido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthenticated: { description: 'Credencial ou codigo invalido (sempre o mesmo corpo)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unauthenticated } } } }
    Forbidden: { description: 'Autorizacao de outro Worker ou organizacao, ou pacote diferente do autorizado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    NotFound: { description: 'Execucao nao registrada por esta maquina', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
    Conflict: { description: 'Estado atual impede o ato (Worker ocupado, registro divergente, limite por execucao)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict } } } }
    RateLimited: { description: 'Cota de lotes da organizacao, de leituras do catalogo por Agent ou de falhas de autenticacao do IP; Retry-After', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: rate_limited } } } }
    InternalError: { description: 'Falha antes do commit (sem ACK; nada gravado); reenviar os mesmos fatos', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: internal_error } } } }
    ServiceUnavailable: { description: 'Dependencia indisponivel (Redis); sem ACK; reenviar depois', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: service_unavailable } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, unsupported_contract, unauthenticated, forbidden, not_found, conflict, rate_limited, internal_error, service_unavailable] }
        reason: { type: string, enum: [pairing_code_for_rotation, rotation_code_for_pairing, link_ended_by_machine, link_ended_by_administration, remote_execution_unavailable, remote_code_without_enablement, code_not_for_remote_execution, remote_execution_not_enabled, credential_renewal_not_due, remote_attempt_stale, remote_attempt_transition, remote_package_unavailable, remote_result_conflict, remote_result_limit, remote_log_conflict, remote_log_limit], description: 'Motivo opcional de um codigo conhecido (conflict): T06 (codigos de pareamento/rotacao), T13 (vinculo ja encerrado) e EXECUCAO-REMOTA-001 T01a (habilitacao). Cliente que nao o conhece trata o codigo como sempre' }
    UnlinkRequest:
      type: object
      required: [operationId, agentId, launchedRunRequests]
      properties:
        operationId: { type: string, format: uuid, description: 'Gerado pelo Agent ANTES do primeiro envio e guardado; o mesmo em toda repeticao' }
        agentId: { type: string, format: uuid, description: 'Conferencia do vinculo esperado; nao da autoridade' }
        launchedRunRequests: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: 'Pedidos aceitos que a maquina INICIOU e cujo registro ainda nao foi entregue' }
    Unlinked:
      type: object
      required: [operationId, outcome, agentId, workerId, unlinkedAt, runRequestsClosed, runRequestsKeptAccepted]
      properties:
        operationId: { type: string, format: uuid }
        outcome: { type: string, enum: [UNLINKED] }
        agentId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        unlinkedAt: { type: string, format: date-time }
        runRequestsClosed: { type: integer, minimum: 0 }
        runRequestsKeptAccepted: { type: integer, minimum: 0, maximum: 50 }
    RedeemRequest:
      type: object
      required: [code, credentialSecret, agentVersion, contractVersions]
      properties:
        code: { type: string, description: 'nkp1.<organization_id>.<enrollment_id>.<segredo>' }
        credentialSecret: { type: string, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$' }
        agentVersion: { type: string, pattern: '^[0-9A-Za-z.+-]{1,40}$' }
        contractVersions: { type: array, maxItems: 8, items: { type: string } }
    Redeemed:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        credentialId: { type: string, format: uuid }
        credentialExpiresAt: { type: string, format: date-time }
        contractVersion: { type: string }
        remoteExecution: { type: boolean, enum: [true], description: 'Presente (true) so quando o resgate habilitou a maquina para execucao remota; ausente nos demais' }
    RemoteNext:
      type: object
      description: 'No maximo um dos campos. Nenhum: nada a fazer'
      properties:
        attempt:
          type: object
          required: [attemptId, remoteExecutionId, attemptNumber, automationId, automationVersionId, packageFingerprint, workspaceId, packageFingerprintRule, dependencies, pythonEnvironmentId, token, epoch, leaseSeconds]
          properties:
            attemptId: { type: string, format: uuid }
            remoteExecutionId: { type: string, format: uuid }
            attemptNumber: { type: integer, minimum: 1 }
            automationId: { type: string, format: uuid }
            automationVersionId: { type: string, format: uuid }
            packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
            packageFingerprintRule: { type: string }
            dependencies: { type: array, items: { type: string }, description: 'O efetivo congelado na solicitacao (nome==versao)' }
            workspaceId: { type: string, format: uuid, description: 'O ambiente da solicitacao' }
            pythonEnvironmentId: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$', description: 'O ambiente Python escolhido para a automacao NESTA maquina: o identificador opaco que ela mesma publicou no inventario. A Platform nunca envia um caminho. A maquina confere o ambiente antes de iniciar; se ele nao existir mais, recusa com ENVIRONMENT_GONE, sem escolher outro. Nulo so em tentativas anteriores a escolha do Python.' }
            token: { type: string, description: 'Token da atribuicao; aparece so aqui' }
            epoch: { type: integer, minimum: 1 }
            leaseSeconds: { type: integer }
        cancel:
          type: object
          required: [attemptId]
          properties:
            attemptId: { type: string, format: uuid }
    RemoteAttemptWrite:
      type: object
      additionalProperties: false
      required: [token, epoch]
      properties:
        token: { type: string }
        epoch: { type: integer, minimum: 1 }
    RemoteAttemptStateWrite:
      type: object
      additionalProperties: false
      required: [token, epoch, state]
      properties:
        token: { type: string }
        epoch: { type: integer, minimum: 1 }
        state: { type: string, enum: [PREPARING, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, REFUSED, ENDED_UNKNOWN] }
        refusalReason: { type: string, enum: [BUSY, PAUSED, PACKAGE_INVALID, ENVIRONMENT_GONE, ENVIRONMENT_INCOMPATIBLE, DEPENDENCIES_MISSING, DISK_PRESSURE, CLIENT_INCOMPATIBLE, SESSION_UNAVAILABLE], description: 'So com REFUSED' }
        exitCode: { type: integer, description: 'So com SUCCEEDED, FAILED ou TIMED_OUT' }
    RemoteAttemptStatus:
      type: object
      required: [attemptId, state, proceed, cancelRequested, leaseSeconds]
      properties:
        attemptId: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, OFFERED, RECEIVED, PREPARING, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, REFUSED, EXPIRED, ENDED_UNKNOWN] }
        proceed: { type: boolean, description: 'false: a maquina NAO deve seguir (inicio recusado pelo servidor, ou tentativa ja terminada)' }
        refusalReason: { type: string, description: 'So em REFUSED; inclui os motivos do servidor (AUTHORIZATION_REVOKED, AUTHORIZATION_EXPIRED, AUTHORIZATION_MISSING, WORKER_NOT_AUTHORIZED, MACHINE_NOT_LINKED, MACHINE_NOT_ENABLED, MACHINE_INCOMPATIBLE)' }
        cancelRequested: { type: boolean }
        leaseSeconds: { type: integer }
    PythonInventory:
      type: object
      additionalProperties: false
      required: [environments]
      properties:
        environments:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [environmentId, pythonVersion, kind, observedAt]
            properties:
              environmentId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'Opaco; derivado na maquina; nunca um caminho' }
              pythonVersion: { type: string, pattern: '^3\.[0-9]{1,2}\.[0-9]{1,3}([abc]|rc)?[0-9]{0,2}$' }
              kind: { type: string, enum: [INSTALLATION, VIRTUAL_ENVIRONMENT] }
              observedAt: { type: string, format: date-time, description: 'Quando a maquina sondou o ambiente; ate 5 minutos a frente do servidor' }
    PythonInventoryPublished:
      type: object
      required: [count, reportedAt]
      properties:
        count: { type: integer, minimum: 0, maximum: 32 }
        reportedAt: { type: string, format: date-time }
    RenewCredentialRequest:
      type: object
      additionalProperties: false
      required: [credentialSecret]
      properties:
        credentialSecret: { type: string, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', description: 'Segredo NOVO, gerado pela maquina; viaja uma vez' }
    RenewedCredential:
      type: object
      required: [credentialId, credentialExpiresAt]
      properties:
        credentialId: { type: string, format: uuid }
        credentialExpiresAt: { type: string, format: date-time }
    RemoteReceiving:
      type: object
      additionalProperties: false
      required: [receiving]
      properties:
        receiving: { type: string, enum: [ENABLED, PAUSED] }
    HeartbeatRequest:
      type: object
      required: [agentVersion, contractVersion, capabilities]
      properties:
        agentVersion: { type: string, pattern: '^[0-9A-Za-z.+-]{1,40}$' }
        contractVersion: { type: string, pattern: '^1\.[0-9]{1,3}$' }
        capabilities: { type: array, maxItems: 12, items: { type: string, enum: [RUN_LOCAL, OBS_1_0, SUPERVISOR_REPORT_1_0, EXTERNAL_PYTHON_1_0, RUN_REQUEST_1_0, REMOTE_RUN_1_0, REMOTE_LOGS_1_0, REMOTE_RESULTS_1_0, PY_INVENTORY_1_0] } }
        remote:
          type: object
          additionalProperties: false
          required: [busy, diskPressure]
          description: 'Opcional (T01a da execucao remota): sinais da maquina habilitada, validos ate o proximo batimento'
          properties:
            busy: { type: boolean, description: 'Ha uma execucao em andamento nesta maquina' }
            diskPressure: { type: boolean, description: 'Espaco em disco abaixo do minimo para preparar uma execucao' }
    Presence:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        credentialExpiresAt: { type: string, format: date-time }
        contractVersion: { type: string }
        remote:
          type: object
          description: 'So para a maquina habilitada para execucao remota'
          properties:
            receiving: { type: string, enum: [ENABLED, PAUSED] }
    AuthorizationList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              authorizationId: { type: string, format: uuid }
              workspaceId: { type: string, format: uuid }
              automationId: { type: string, format: uuid }
              automationVersionId: { type: [string, 'null'], format: uuid, description: 'Nulo em EXTERNAL_MONITORED (sem versao)' }
              packageFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'Impressao do pacote pela regra packageFingerprintRule (contrato, sec. 6.4), sem o prefixo sha256:. Nula em EXTERNAL_MONITORED: nenhuma impressao e inventada para o monitoramento' }
              packageFingerprintRule: { type: [string, 'null'], enum: ['nekkora-agent/package-fingerprint/1', 'nekkora-agent/external-python-fingerprint/1', null] }
              validUntil: { type: string, format: date-time }
              sourceKind:
                type: string
                enum: [STUDIO_PACKAGE, EXTERNAL_PACKAGE, EXTERNAL_MONITORED]
                description: >
                  Origem explicita (030). STUDIO_PACKAGE: regra package-fingerprint/1 (inalterada). EXTERNAL_PACKAGE: pacote Python
                  externo, regra external-python-fingerprint/1. EXTERNAL_MONITORED: Python do cliente disparado pelo agendador dele,
                  sem versao e sem impressao (um Agent anterior recusa o item por nao ter impressao: falha fechada).
    CatalogOrganization:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        displayName: { type: string, description: 'Nome de exibicao da organizacao (nao e a razao social)' }
    CatalogMachine:
      type: object
      description: 'O vinculo da credencial: para o Agent conferir que a resposta e do vinculo atual'
      properties:
        agentId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
    CatalogVersion:
      type: object
      properties:
        automationVersionId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1, description: 'Numero INTERNO da Platform (1, 2, ...); nao e semver nem a versao do pacote' }
        publishedAt: { type: string, format: date-time }
        sourceKind: { type: string, enum: [STUDIO_PACKAGE, EXTERNAL_PACKAGE] }
        packageFingerprintRule: { type: string, enum: ['nekkora-agent/package-fingerprint/1', 'nekkora-agent/external-python-fingerprint/1'] }
        packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'A impressao da autorizacao, pela regra informada (sem o prefixo sha256:); nao e o sha256 dos bytes do ZIP' }
        packageName: { type: [string, 'null'], description: 'Nome declarado no manifesto do pacote externo; nulo sem artefato recebido' }
        packageVersion: { type: [string, 'null'], description: 'Versao DECLARADA no manifesto do pacote externo (MAIOR.MENOR.CORRECAO); nula para pacote do Studio ou sem artefato recebido' }
    CatalogItem:
      type: object
      properties:
        workspaceId: { type: string, format: uuid }
        workspaceName: { type: string }
        automationId: { type: string, format: uuid }
        automationName: { type: string }
        versions:
          type: array
          maxItems: 20
          description: 'Versoes elegiveis, maior versionNumber primeiro. Vazio: visivel so por autorizacao de monitoramento (sem versao elegivel)'
          items: { $ref: '#/components/schemas/CatalogVersion' }
        versionsTruncated: { type: boolean, description: 'Havia mais de 20 versoes elegiveis; as de maior numero estao na lista' }
    CatalogPage:
      type: object
      properties:
        catalogVersion: { type: string, enum: ['1.0'] }
        observedAt: { type: string, format: date-time, description: 'Hora do servidor na consulta' }
        organization: { $ref: '#/components/schemas/CatalogOrganization' }
        machine: { $ref: '#/components/schemas/CatalogMachine' }
        coverage: { type: string, enum: [WORKER_AUTHORIZED_SUBSET] }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CatalogItem' } }
        nextCursor: { type: [string, 'null'], description: 'Nulo: nao havia mais itens no momento desta consulta' }
    CatalogSingle:
      type: object
      properties:
        catalogVersion: { type: string, enum: ['1.0'] }
        observedAt: { type: string, format: date-time }
        organization: { $ref: '#/components/schemas/CatalogOrganization' }
        machine: { $ref: '#/components/schemas/CatalogMachine' }
        coverage: { type: string, enum: [WORKER_AUTHORIZED_SUBSET] }
        item: { $ref: '#/components/schemas/CatalogItem' }
    SupervisorReport:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [READY, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, BLOCKED, OUTCOME_UNKNOWN] }
        code: { type: [string, 'null'], pattern: '^AGT-[A-Z]{2,5}-[0-9]{3}$', description: 'So em estado terminal' }
        exitCode: { type: [integer, 'null'] }
        counts: { type: [object, 'null'], maxProperties: 16, additionalProperties: { type: integer, minimum: 0 } }
        created: { type: [string, 'null'], format: date-time }
        started: { type: [string, 'null'], format: date-time }
        ended: { type: [string, 'null'], format: date-time }
        adopted: { type: [boolean, 'null'] }
        suspensions: { type: [integer, 'null'], minimum: 0 }
        locks: { type: [integer, 'null'], minimum: 0 }
    RegisterRequest:
      type: object
      required: [agentExecutionId, authorizationId, supervisor]
      properties:
        agentExecutionId: { type: string, pattern: '^ex-[0-9a-f]{32}$' }
        authorizationId: { type: string, format: uuid }
        packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Impressao do pacote pela regra da autorizacao (contrato, sec. 6.4), sem o prefixo sha256:. AUSENTE se e somente se a autorizacao for EXTERNAL_MONITORED (030); divergencia = 403' }
        runRequestId: { type: string, format: uuid, description: 'Execucao de um pedido (030) ACEITO por esta maquina com o mesmo agentExecutionId; o pedido passa a RUN_LINKED' }
        supervisor: { $ref: '#/components/schemas/SupervisorReport' }
    RunRequestList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PendingRunRequest' }
    PendingRunRequest:
      type: object
      description: 'So identificadores, validade e o pacote esperado. Nenhum comando, caminho, argumento ou segredo.'
      properties:
        runRequestId: { type: string, format: uuid }
        authorizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        automationVersionId: { type: string, format: uuid }
        sourceKind: { type: string, enum: [STUDIO_PACKAGE, EXTERNAL_PACKAGE] }
        packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        packageFingerprintRule: { type: string, enum: ['nekkora-agent/package-fingerprint/1', 'nekkora-agent/external-python-fingerprint/1'] }
        requestedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        state: { type: string, enum: [DELIVERED, ACCEPTED], description: 'DELIVERED: aguardando decisao. ACCEPTED: decisao ja registrada (a maquina reconcilia com o registro local)' }
        agentExecutionId: { type: [string, 'null'], pattern: '^ex-[0-9a-f]{32}$' }
    RunRequestDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [ACCEPTED, REFUSED, NOT_STARTED] }
        agentExecutionId: { type: string, pattern: '^ex-[0-9a-f]{32}$', description: 'Obrigatorio em ACCEPTED (reservado e gravado pelo Agent ANTES do envio) e em NOT_STARTED' }
        reason:
          type: string
          enum: [PACKAGE_NOT_PRESENT, PACKAGE_NOT_APPROVED, AUTHORIZATION_UNUSABLE, ENVIRONMENT_INCOMPATIBLE, BUSY, EXPIRED, LAUNCH_NOT_ATTEMPTED]
          description: 'Obrigatorio em REFUSED (sem LAUNCH_NOT_ATTEMPTED); em NOT_STARTED so LAUNCH_NOT_ATTEMPTED (opcional)'
    RunRequestDecisionResult:
      type: object
      properties:
        runRequestId: { type: string, format: uuid }
        outcome: { type: string, enum: [APPLIED, UNCHANGED, EXPIRED, REVOKED, CONFLICT] }
        state: { type: string, enum: [REQUESTED, DELIVERED, ACCEPTED, REFUSED, NOT_STARTED, RUN_LINKED, EXPIRED, REVOKED] }
        agentExecutionId: { type: [string, 'null'] }
    Registered:
      type: object
      properties:
        runId: { type: string, format: uuid }
        created: { type: boolean }
        state: { type: string }
        reportOutcome: { type: string, enum: [APPLIED, UNCHANGED, STALE, CONFLICT] }
    Reported:
      type: object
      properties:
        runId: { type: string, format: uuid }
        outcome: { type: string, enum: [APPLIED, UNCHANGED, STALE, CONFLICT] }
        state: { type: string, description: 'Estado vigente depois do relatorio' }
    EventBatch:
      type: object
      required: [events]
      properties:
        events: { type: array, maxItems: 500, items: { type: object, description: 'Envelope nekkora-agent/observability 1.0.0 (sem texto livre)' } }
        declaredMissing:
          type: array
          maxItems: 100
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: integer, minimum: 1 }
              to: { type: integer, maximum: 1000000 }
    Ack:
      type: object
      properties:
        runId: { type: string, format: uuid }
        storedThrough: { type: integer }
        settledThrough: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              sequence: { type: [integer, 'null'] }
              status: { type: string, enum: [STORED, DUPLICATE, CONFLICT, INVALID] }
              reason: { type: [string, 'null'] }
        missing:
          type: array
          items:
            type: object
            properties:
              from: { type: integer }
              to: { type: integer }
              status: { type: string, enum: [STORED, DUPLICATE, CONFLICT] }
              reason: { type: [string, 'null'] }
