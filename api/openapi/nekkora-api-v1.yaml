openapi: 3.1.0
info:
  title: Nekkora Platform API v1
  version: 1.0.0
  description: >
    Contrato HTTP DEFINITIVO da API v1 (DC-14, decisao da responsavel em 2026-10-03: este arquivo e a fonte; o anexo da
    proposta GAP-02/03/06 deixa de ser a fonte). Cobre todas as rotas publicadas: identidade, sessao e MFA (contrato 8.7),
    administracao minima, recuperacao emergencial de MFA (016), permissoes (GAP-02), administracao de leitura (GAP-03),
    leitura interna do produto (GAP-06) e o portal externo (013). Conferido contra o codigo (mapeamentos dos controladores)
    e contra os testes HTTP (D-INV-06). x-decisoes: decisoes da responsavel (DC-xx do contrato GAP-02/03/06) que fundamentam a
    operacao; nenhuma esta pendente. Corpo de erro sempre {"error":"<codigo>"} (contrato 8.7 §5.2). Rotas internas de
    leitura: ordem 401 -> 400 -> 403 -> 404; paginacao keyset sobre o estado atual com cursor assinado (secoes 1.4-1.5 do
    contrato GAP-02/03/06). Escritas com sessao exigem Origin igual a origem publica e X-CSRF-Token do contexto (CsrfFilter).
servers:
  - url: https://{host}
    description: Gateway publico (caminho publicado = caminho interno)
    variables:
      host: { default: homologacao.nekkora.test }
security:
  - sessionCookie: []
tags:
  - name: Identidade e sessao
  - name: Administracao
  - name: Recuperacao emergencial de MFA
  - name: GAP-02 permissoes
  - name: GAP-03 administracao
  - name: GAP-06 leitura interna
  - name: Portal externo

paths:
  /api/v1/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getPreAuthCsrf
      summary: 'Emite o token CSRF de pre-autenticacao (cookie __Host-nekkora_pre, estado no Redis)'
      security: []
      responses:
        '200': { description: 'Token de pre-autenticacao (e cookie __Host-nekkora_pre)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getSessionCsrf
      summary: 'Token CSRF da sessao atual'
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'Token CSRF da sessao', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/o/{org}/auth/login:
    post:
      tags: [Identidade e sessao]
      operationId: login
      summary: 'Senha (passo 1): abre o desafio de MFA; resposta unica para credencial invalida (sem enumeracao)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 'Desafio de MFA aberto (cookie __Host-nekkora_mfa)', content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/start:
    post:
      tags: [Identidade e sessao]
      operationId: startMfaEnrollment
      summary: 'Inicia o cadastro do TOTP no desafio de cadastro'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'URI otpauth', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmMfaEnrollment
      summary: 'Confirma o TOTP; emite a sessao e os codigos de recuperacao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConfirmation' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/verify:
    post:
      tags: [Identidade e sessao]
      operationId: verifyMfa
      summary: 'Verifica o TOTP ou um codigo de recuperacao (exatamente um); emite a sessao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/step-up:
    post:
      tags: [Identidade e sessao]
      operationId: mfaStepUp
      summary: 'Step-up com TOTP na sessao (exigido pelo reset administrativo de MFA)'
      description: >
        Codigo TOTP errado -> 403 forbidden (step_up); so codigo TOTP (recoveryCode nao aceito).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/logout:
    post:
      tags: [Identidade e sessao]
      operationId: logout
      summary: 'Encerra a sessao atual (idempotente; sem sessao = sem efeito; fora do limitador R7)'
      security: [ {}, { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/sessions/revoke-all:
    post:
      tags: [Identidade e sessao]
      operationId: revokeAllSessions
      summary: 'Revoga todas as sessoes da propria conta (fora do limitador R7)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/password:
    post:
      tags: [Identidade e sessao]
      operationId: changePassword
      summary: 'Troca a propria senha (senha atual errada -> 401)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/request:
    post:
      tags: [Identidade e sessao]
      operationId: requestPasswordReset
      summary: 'Pede a recuperacao de senha: 202 SEMPRE (sem enumeracao)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmPasswordReset
      summary: 'Confirma a recuperacao com o token de uso unico e a nova senha'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/email-verification/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmEmailVerification
      summary: 'Confirma o e-mail com o token de uso unico (sem 401)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/me:
    get:
      tags: [Identidade e sessao]
      operationId: getMe
      summary: 'Conta autenticada (allowlist: tipo, nome, e-mail, organizacao)'
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'Conta', content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/o/{org}/users/{user}/suspend:
    post:
      tags: [Administracao]
      operationId: suspendUser
      summary: 'Suspende a conta (org.manage); revoga sessoes e desafios'
      description: >
        403: conta externa, sem org.manage, alvo = ator, invariante da 003 (ultimo ORG_ADMIN) ou Origin/CSRF; 404: alvo inexistente na organizacao.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: user, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/users/{user}/reactivate:
    post:
      tags: [Administracao]
      operationId: reactivateUser
      summary: 'Reativa a conta (org.manage); nao restaura sessoes nem concessoes'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: user, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/users/{user}/mfa/reset:
    post:
      tags: [Administracao]
      operationId: resetUserMfa
      summary: 'Reset administrativo de MFA (identity.mfa.reset + step-up recente na mesma sessao + motivo codificado)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: user, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaResetRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/client-grants/{grant}/revoke:
    post:
      tags: [Administracao]
      operationId: revokeClientGrant
      summary: 'Revoga a concessao externa (external_access.manage); idempotente'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: grant, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa-emergencia/aviso/confirmar:
    post:
      tags: [Recuperacao emergencial de MFA]
      operationId: confirmEmergencyNotice
      summary: 'Confirma o aviso da recuperacao emergencial com o token CONFIRMAR (uso unico; sem 401)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa-emergencia/aviso/contestar:
    post:
      tags: [Recuperacao emergencial de MFA]
      operationId: contestEmergencyNotice
      summary: 'Contesta o aviso da recuperacao emergencial com o token CONTESTAR (uso unico; cancela a solicitacao; sem 401)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/me/operational-link-code:
    post:
      tags: [Recuperacao emergencial de MFA]
      operationId: issueOperationalLinkCode
      summary: 'Codigo de prova de controle da conta para o vinculo do operador (sessao + CSRF de sessao)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'Codigo e validade', content: { application/json: { schema: { $ref: '#/components/schemas/OperationalLinkCode' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/me/permissions:
    get:
      tags: [GAP-02 permissoes]
      operationId: getMyPermissions
      x-estado: implementado (GAP-02; PermissionsController; MyPermissionsRouteIT, PermissionCatalogIT)
      summary: Permissoes organizacionais e validas em todos os workspaces do usuario interno autenticado
      description: >
        organization.permissions pode conter qualquer dos 23 codigos (PermissionCode). allWorkspaces.permissions contem so
        codigos de workspace (WorkspacePermissionCode), derivados das atribuicoes organizacionais (regra a, DC-01).
        Atribuicoes explicitas por workspace ficam em /me/permissions/workspaces (paginada, DC-03).
        Efetivo em W = allWorkspaces.permissions U permissoes de W na rota paginada. Codigo de papel ou permissao
        desconhecido pelo catalogo, ou permissao organizacional em papel de workspace -> 500 (nunca omitido).
        Apenas apoio a interface: cada rota autoriza no backend.
      x-decisoes: [DC-01, DC-03]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200':
          description: Permissoes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPermissions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }

  /api/v1/o/{org}/me/permissions/workspaces:
    get:
      tags: [GAP-02 permissoes]
      operationId: listMyWorkspacePermissions
      x-estado: implementado (GAP-02; PermissionsController; MyPermissionsRouteIT)
      summary: Atribuicoes explicitas de workspace do usuario (regra b), paginadas, sem truncar
      description: Um item por workspace com ao menos uma atribuicao ativa (inclusive arquivado ou suspenso). Sem limite de volume.
      x-ordenacao: workspaceId asc (imutavel)
      x-decisoes: [DC-03]
      parameters:
        - $ref: '#/components/parameters/Org'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Pagina de atribuicoes por workspace, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspacePermissionsPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }

  /api/v1/o/{org}/members:
    get:
      tags: [GAP-03 administracao]
      operationId: listMembers
      x-estado: implementado (GAP-03; AdminReadController; AdminReadRoutesIT)
      summary: Lista membros internos (exige org.manage)
      x-ordenacao: createdAt asc, membershipId asc
      x-decisoes: [DC-04]
      parameters:
        - $ref: '#/components/parameters/Org'
        - { name: status, in: query, required: false, schema: { type: array, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/MembershipStatus' } }, style: form, explode: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Pagina de membros, content: { application/json: { schema: { $ref: '#/components/schemas/MemberPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }

  /api/v1/o/{org}/client-grants:
    get:
      tags: [GAP-03 administracao]
      operationId: listClientGrants
      x-estado: implementado (GAP-03; AdminReadController; AdminReadRoutesIT)
      summary: Lista concessoes de acesso externo (exige external_access.manage)
      description: >
        EXCECAO documentada a regra geral do 404: clientId/workspaceId sao filtros de rota organizacional. Inexistente ou
        de outra organizacao -> 200 com items vazio (nao revela existencia). UUID malformado -> 400.
      x-ordenacao: createdAt desc, grantId desc
      x-decisoes: [DC-05]
      parameters:
        - $ref: '#/components/parameters/Org'
        - { name: status, in: query, schema: { type: array, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/GrantStatus' } }, style: form, explode: true }
        - { name: clientId, in: query, schema: { type: string, format: uuid }, description: 'inexistente ou de outra organizacao -> lista vazia; malformado -> 400' }
        - { name: workspaceId, in: query, schema: { type: string, format: uuid }, description: 'inexistente ou de outra organizacao -> lista vazia; malformado -> 400' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Pagina de concessoes, content: { application/json: { schema: { $ref: '#/components/schemas/GrantPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }

  /api/v1/o/{org}/clients:
    get:
      tags: [GAP-03 administracao]
      operationId: listClients
