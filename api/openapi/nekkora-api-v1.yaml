              pythonVersion: { type: string }
              kind: { type: string, enum: [INSTALLATION, VIRTUAL_ENVIRONMENT] }
              observedAt: { type: string, format: date-time, description: 'Relogio da maquina' }
              reportedAt: { type: string, format: date-time, description: 'Relogio do servidor' }
    RemoteMachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workerId, workerName, agentId, agentName, agentVersion, state, receiving, enabledAt]
            properties:
              workerId: { type: string, format: uuid }
              workerName: { type: string }
              agentId: { type: string, format: uuid }
              agentName: { type: string, description: 'Nome logico da maquina, informado pela pessoa no pareamento' }
              agentVersion: { type: string, description: 'Versao do aplicativo informada no ultimo contato' }
              state: { type: string, enum: [OFFLINE, INCOMPATIBLE, PAUSED, NO_DISK_SPACE, BUSY, AVAILABLE], description: 'Indicativo; nao reserva a maquina' }
              receiving: { type: string, enum: [ENABLED, PAUSED], description: 'Recebimento de novos trabalhos, decidido na maquina' }
              lastHeartbeatAt: { type: [string, 'null'], format: date-time }
              enabledAt: { type: string, format: date-time }
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              agentId: { type: string, format: uuid }
              name: { type: string }
              installationId: { type: string, format: uuid }
              agentVersion: { type: string }
              status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] }
              workerId: { type: [string, 'null'], format: uuid }
              registeredAt: { type: string, format: date-time }
              lastHeartbeatAt: { type: [string, 'null'], format: date-time }
              connectivity: { type: string, enum: [CONNECTED, DISCONNECTED] }
              contractVersion: { type: [string, 'null'] }
              capabilities: { type: array, items: { type: string, enum: [RUN_LOCAL, OBS_1_0, SUPERVISOR_REPORT_1_0, EXTERNAL_PYTHON_1_0, RUN_REQUEST_1_0, REMOTE_RUN_1_0, REMOTE_LOGS_1_0, REMOTE_RESULTS_1_0, PY_INVENTORY_1_0] }, description: 'As capacidades que a maquina declarou no ultimo contato (as mesmas do contrato Platform-Agent). RUN_REQUEST_1_0 = atende o pedido de execucao (createRunRequest); REMOTE_RUN_1_0 = atende a execucao remota (Nekkora Agent Client). Uma maquina pode declarar so um dos dois.' }
              credentialExpiresAt: { type: [string, 'null'], format: date-time }
              endedBy: { type: [string, 'null'], enum: [ADMINISTRATION, MACHINE, null], description: 'T13: quem encerrou o vinculo (so com status REVOKED)' }
    WorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              workerId: { type: string, format: uuid }
