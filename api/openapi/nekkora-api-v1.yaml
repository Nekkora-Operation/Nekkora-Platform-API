openapi: 3.1.0
info:
  title: Nekkora Platform API v1
  version: 1.0.0
  description: >
    Contrato HTTP DEFINITIVO da API v1 (DC-14, decisao da responsavel em 2026-10-03: este arquivo e a fonte; o anexo da
    proposta GAP-02/03/06 deixa de ser a fonte). Cobre todas as rotas publicadas: identidade, sessao e MFA (contrato 8.7),
    administracao minima, recuperacao emergencial de MFA (016), permissoes (GAP-02), administracao de leitura (GAP-03),
    leitura interna do produto (GAP-06), acessos (convites, papeis, vinculo, concessoes e auditoria; 023), o lado das pessoas do canal do Agent (025; o lado da maquina e nekkora-agent-v1.yaml) e o portal externo (013). Conferido contra o codigo (mapeamentos dos controladores)
    e contra os testes HTTP (D-INV-06). x-decisoes: decisoes da responsavel (DC-xx do contrato GAP-02/03/06) que fundamentam a
    operacao; nenhuma esta pendente. Corpo de erro sempre {"error":"<codigo>"} (contrato 8.7 §5.2). Rotas internas de
    leitura: ordem 401 -> 400 -> 403 -> 404; paginacao keyset sobre o estado atual com cursor assinado (secoes 1.4-1.5 do
    contrato GAP-02/03/06). Escritas com sessao exigem Origin igual a origem publica e X-CSRF-Token do contexto (CsrfFilter).
servers:
  - url: https://{host}
    description: Gateway publico (caminho publicado = caminho interno)
    variables:
      host: { default: homologacao.nekkora.test }
security:
  - sessionCookie: []
tags:
  - name: Identidade e sessao
  - name: Cadastro web (identidade)
  - name: Entrada geral (identidade)
  - name: Login do aplicativo desktop
    description: 'Entrada no Nekkora Agent (Client) pelo navegador: Authorization Code com PKCE S256 e redirect de loopback, para um cliente publico fixo, sobre a identidade existente (AGENT-CLIENT-LOGIN-001; 037). Nao e OIDC nem servidor OAuth generico'
  - name: Administracao
  - name: Recuperacao emergencial de MFA
  - name: GAP-02 permissoes
  - name: GAP-03 administracao
  - name: GAP-06 leitura interna
  - name: Acessos
    description: 'Convites, papeis, retirada de vinculo, concessoes e auditoria (contrato de 2026-10-27; 023)'
  - name: Canal do Agent
    description: 'Pareamento, credencial, Worker no workspace, autorizacao de execucao local e consultas das execucoes do Agent (contrato Platform-Agent 1.0; 025). O lado da maquina e o openapi/nekkora-agent-v1.yaml'
  - name: Ciclo de vida das automacoes
    description: 'Workspace, automacao, versao DRAFT, artefato (pacote do Studio ou pacote Python externo, 030) recebido e conferido pela API e publicacao com step-up (PLATFORM-AUTOMATION-LIFECYCLE-001; 028). Publicar nao autoriza nem dispara execucao'
  - name: Dependencias de execucao
    description: 'Dependencias declaradas na Platform para uma automacao (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T01c; 045). Leitura estatica, com as mesmas regras do aplicativo; nada e instalado. Declarar nao muda o pacote publicado e nao autoriza execucao'
  - name: Execucao remota
    description: 'Solicitacao de execucao de uma versao publicada numa maquina habilitada (PLATFORM-CLIENT-EXECUCAO-REMOTA-001, T02; 046). Exige automation.execute, Worker autorizado no ambiente, maquina habilitada, nao pausada e compativel, e autorizacao vigente da versao para o Worker. Solicitar nao prova inicio'
  - name: Pedido de execucao
    description: 'Pedido duravel de uma pessoa para uma versao autorizada rodar num Agent (AGENT-PYTHON-001; 030). A maquina puxa pelo gateway e decide; entregar ou aceitar nao prova inicio; inicio e desfecho vem do supervisor da execucao ligada'
  - name: Portal externo

paths:
  /api/v1/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getPreAuthCsrf
      summary: 'Emite o token CSRF de pre-autenticacao (cookie __Host-nekkora_pre, estado no Redis)'
      security: []
      responses:
        '200': { description: 'Token de pre-autenticacao (e cookie __Host-nekkora_pre)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getSessionCsrf
      summary: 'Token CSRF da sessao atual'
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'Token CSRF da sessao', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/o/{org}/auth/login:
    post:
      tags: [Identidade e sessao]
      operationId: login
      summary: 'Senha (passo 1): abre o desafio de MFA; resposta unica para credencial invalida (sem enumeracao)'
      description: >
        Conta VINCULADA a uma identidade (cadastro ou vinculacao, contrato P3; DC-17.9) nao entra por aqui: o mesmo 401
        generico de credencial invalida, sem desafio e sem revelar o vinculo, tambem quando o vinculo acontece enquanto o
        login espera o lock da conta (a trigger da 017 recusa o desafio). A pessoa entra pela entrada geral e pela troca.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 'Desafio de MFA aberto (cookie __Host-nekkora_mfa)', content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/start:
    post:
      tags: [Identidade e sessao]
      operationId: startMfaEnrollment
      summary: 'Inicia o cadastro do TOTP no desafio de cadastro'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'URI otpauth', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmMfaEnrollment
      summary: 'Confirma o TOTP; emite a sessao e os codigos de recuperacao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConfirmation' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/verify:
    post:
      tags: [Identidade e sessao]
      operationId: verifyMfa
      summary: 'Verifica o TOTP ou um codigo de recuperacao (exatamente um); emite a sessao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/step-up:
    post:
      tags: [Identidade e sessao]
      operationId: mfaStepUp
      summary: 'Confirmacao de identidade com TOTP na sessao: abre a janela fixa de 60 min das acoes sensiveis comuns (T01)'
      description: >
        PLATFORM-V2-001, T01: o 204 abre uma janela FIXA de 60 minutos, contada deste instante, para as acoes sensiveis
        comuns DESTA sessao (convites, papeis, concessoes, Agents e Workers, autorizacao de execucao, publicacao, pedidos de
        execucao); usar acoes nao estende o prazo, e cada ato continua conferindo sessao, organizacao e permissao. Prova
        propria mais curta: o reset administrativo de MFA exige a confirmacao dos ultimos 5 minutos. Sem confirmacao valida,
        o ato responde 403 forbidden com reason step_up_required (nada feito). O codigo nunca e guardado nem reaproveitado (anti-replay).
        Codigo TOTP errado -> 403 forbidden (step_up); so codigo TOTP (recoveryCode nao aceito). Sessao do login por
        organizacao: TOTP do fator local, R1/R4, caminho inalterado. Sessao VINCULADA (nascida da troca, contrato P4): TOTP do
        fator da IDENTIDADE de origem. O CSRF desta sessao de organizacao continua exigido (o CSRF da sessao de identidade
        nao o substitui) e o cookie __Host-nekkora_id e exigido EM ADICAO, resolvendo exatamente a sessao de identidade que
        originou esta sessao (unica rota em que os dois cookies valem juntos). Cookie ausente, de outra identidade ou de outra
        sessao da mesma identidade: 403 sem conferir o codigo. Numa so transacao, na ordem global da 017 (identidade ->
        sessao de identidade -> organizacao -> conta -> sessao de organizacao), com a revalidacao da sessao de organizacao
        sob o lock, anti-replay no fator da identidade (um codigo aceito aqui nao serve para outro step-up, global ou de outra
        organizacao, nem para o login), step-up SO nesta sessao de organizacao (nem na de identidade, nem em outra sessao),
        eventos mfa_events 6 e identity_events 14 (ORG_STEP_UP) no mesmo commit, e as duas sessoes e a janela do passo
        reconferidas antes do commit. Codigo errado ou replay: 403, contado em R8m (identidade global). Sessao que caiu
        durante as esperas: 401, sem efeito.
      security: [ { sessionCookie: [], csrfHeader: [] }, { sessionCookie: [], csrfHeader: [], identitySessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-confirm:
    post:
      tags: [Autenticacao]
      operationId: orgPasswordConfirm
      summary: '029: reconfirma a senha na sessao de organizacao VINCULADA sem segundo fator (abre a mesma janela fixa do step-up, T01; so nesta sessao)'
      description: >
        Sessao de organizacao nascida da troca a partir de sessao de identidade sem MFA (identidade que nunca confirmou fator),
        com o cookie __Host-nekkora_id da sessao de identidade de origem EXATA em adicao ao CSRF desta sessao (como o step-up
        vinculado). Grava password_step_up_at nesta sessao de organizacao e o evento 19 com a organizacao. Substitui o step-up
        por TOTP nesta sessao para as acoes sensiveis (convites, papeis, concessoes, Agent e Workers, autorizacao de execucao,
        publicacao, reset administrativo). Sessao do login por organizacao, sessao com MFA, senha errada ou cookie de outra
        sessao de identidade: 403, sem efeito.
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'CSRF invalido; senha errada; sessao nao vinculada ou com MFA; sessao de identidade de origem divergente', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/o/{org}/auth/logout:
    post:
      tags: [Identidade e sessao]
      operationId: logout
      summary: 'Encerra a sessao atual (idempotente; sem sessao = sem efeito; fora do limitador R7)'
      security: [ {}, { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/sessions/revoke-all:
    post:
      tags: [Identidade e sessao]
      operationId: revokeAllSessions
      summary: 'Revoga todas as sessoes da propria conta (fora do limitador R7)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/password:
    post:
      tags: [Identidade e sessao]
      operationId: changePassword
      summary: 'Troca a propria senha (senha atual errada -> 401)'
      description: >
        Sessao VINCULADA (conta que entra pela identidade, contrato P3): 403 generico, sem conferir a senha; a senha local
        nao autentica nem muda depois do vinculo (DC-17.12). A senha da pessoa e a da identidade.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, ou sessao de conta vinculada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/request:
    post:
      tags: [Identidade e sessao]
      operationId: requestPasswordReset
      summary: 'Pede a recuperacao de senha: 202 SEMPRE (sem enumeracao)'
      description: >
        Conta vinculada a uma identidade (contrato P3, DC-17.12): nenhum token e nenhum e-mail, e a mesma resposta 202 com o
        mesmo piso de tempo, inclusive quando o vinculo acontece entre a leitura e o lock da conta. A recuperacao da pessoa
        e a da identidade.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmPasswordReset
      summary: 'Confirma a recuperacao com o token de uso unico e a nova senha'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/email-verification/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmEmailVerification
      summary: 'Confirma o e-mail com o token de uso unico (sem 401)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup:
    post:
      tags: [Cadastro web (identidade)]
      operationId: signup
      summary: 'Pede o cadastro da identidade: 202 SEMPRE, sem corpo (sem enumeracao de e-mail)'
      description: >
        Missao 1, desenho 6.1. Fora de /o/{org}. DESLIGADO por padrao (nekkora.cadastro.enabled=false): 404 em qualquer
        metodo, antes de CSRF e limites. Recebe SO o e-mail: senha e nome sao escolhidos na confirmacao (o pedido que os
        traz e recusado com 400). E-mail livre: identidade PENDING, SEM credencial, e e-mail de confirmacao. Identidade
        PENDING: reemissao da confirmacao (R9b). Identidade ACTIVE: so o aviso de conta existente, sem token (R9b). Nada e
        criado alem disso; a resposta e a mesma em todos os casos, com o piso de tempo da recuperacao, e o e-mail sai fora
        do caminho da resposta. R9 (10 por IP por hora) e R9b (3 por identidade e 10 por IP por hora) excedidos tambem
        respondem 202, sem efeito. Nao cria sessao, conta de organizacao nem organizacao.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup/confirm:
    post:
      tags: [Cadastro web (identidade)]
      operationId: confirmSignup
      summary: 'Conclui o cadastro com o token de uso unico: a titular define a senha e o nome (PENDING -> ACTIVE)'
      description: >
        Missao 1, desenho 6.1 e 6.2 (revisao de 2026-10-13). Numa unica transacao autorizada pelo token: identidade e token
        travados, validade conferida DEPOIS dos locks, token consumido, credencial (Argon2id) gravada, identidade ativada com
        o nome escolhido. Token de 24 h, uso unico, so o SHA-256 no banco. Nao cria sessao nem organizacao. Token
        malformado, desconhecido, vencido (inclusive durante a espera), revogado, ja consumido, de identidade fora de
        PENDING, senha fora da politica ou nome invalido: 400 invalid_request, sem efeito. Desligado: 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup/confirmation/resend:
    post:
      tags: [Cadastro web (identidade)]
      operationId: resendSignupConfirmation
      summary: 'Reenvia a confirmacao do cadastro: 202 SEMPRE, sem corpo'
      description: >
        Missao 1, desenho 6.1. So identidade PENDING recebe nova confirmacao (o token anterior e revogado; no maximo um
        valido). E-mail desconhecido, ACTIVE, malformado ou R9b excedido: 202, sem efeito. Desligado: 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupResendRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/login:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLogin
      summary: 'Entrada geral, passo 1 (senha): abre o desafio de identidade; resposta unica para credencial invalida'
      description: >
        Missao 1, desenho 6.3. Fora de /o/{org}. Identidade inexistente, senha errada, identidade nao confirmada ou nao
        ACTIVE: 401 identico, com verificacao contra hash ficticio. Sucesso: desafio de 5 min no cookie
        __Host-nekkora_id_mfa (SameSite=Strict) e o CSRF do desafio no corpo. 029 (segundo fator opcional): identidade que
        NUNCA confirmou fator recebe status authenticated e a sessao de identidade direto no cookie __Host-nekkora_id
        (SameSite=Lax), sem desafio e sem QR (evento 18); csrfToken e o da sessao. mfa_enrollment_required so para identidade
        sem fator ativo que ja teve um (reset operacional): o cadastro do fator continua obrigatorio no login. Estado, verificacao do e-mail e credencial vigente sao reconferidos sob o lock da identidade antes
        de emitir o desafio. R8 (identidade global + IP) e R12. Chave propria, separada da do cadastro
        (nekkora.entrada-geral.enabled, desligada por padrao): desligada, 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 'Desafio de identidade aberto (cookie __Host-nekkora_id_mfa) ou, 029, sessao sem segundo fator (cookie __Host-nekkora_id)', content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/enroll/start:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityStartMfaEnrollment
      summary: 'Cria o TOTP pendente da identidade (identity_mfa_enroll_pending) e devolve a URI otpauth: primeiro fator ou substituicao'
      description: >
        DOIS modos explicitos, pela credencial apresentada. (1) Desafio de login (cookie __Host-nekkora_id_mfa, CSRF do
        desafio): primeiro fator, so para identidade que nunca confirmou fator; desafio ausente, vencido, de outro proposito
        ou recusado pela funcao: 401. (2) Sessao de identidade (cookie __Host-nekkora_id, CSRF da sessao): substituicao
        autorizada pela DC-17.13, com step-up de ate 5 min (sessao comum) ou dentro de 15 min da marca de recuperacao (sessao
        restrita); descarta o pendente anterior. Sem essa prova: 403, sem efeito; sessao invalida: 401. Os dois cookies na
        mesma requisicao: 400 (modo ambiguo), antes de qualquer acesso ao banco. Segredo cifrado com AAD da identidade (sem
        organizacao). Nenhum papel de organizacao tem autoridade aqui. Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] }, { identitySessionCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'URI otpauth do fator pendente', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '400': { description: 'Credenciais dos dois modos na mesma requisicao (cookies de desafio e de sessao de identidade)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid_request } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF do modo invalido; no modo sessao, tambem sem a prova de troca (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/enroll/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityConfirmMfaEnrollment
      summary: 'Confirma o fator pendente: primeiro fator (emite a sessao) ou substituicao (T1 da DC-17.13); devolve os codigos de recuperacao novos'
      description: >
        DOIS modos, como em enroll/start. (1) Desafio de login: na MESMA transacao, com a identidade travada, o fator
        pendente e lido, o TOTP e conferido com o relogio lido depois de qualquer espera, e identity_mfa_confirm_first conclui
        com o id exato desse fator (consumo do desafio, credencial vigente, confirmacao, codigos e sessao). Codigo errado:
        tentativa registrada (5 invalidam o desafio) e 401. Sessao de 12 h no cookie __Host-nekkora_id (SameSite=Lax);
        restricted=false. (2) Sessao de identidade (substituicao): so o TOTP do fator NOVO (recoveryCode presente: 400). Numa
        so transacao: identidade travada, fator pendente lido sob o lock, TOTP conferido no segredo DESTE fator,
        identity_mfa_replace com o id exato dele (prova de troca reconferida depois dos locks; fator antigo desabilitado,
        novo confirmado, codigos antigos invalidados e novos gravados, restricao da sessao levantada, DEMAIS sessoes
        revogadas, evento 11), passo gravado no fator novo (anti-replay) e, no fim, sessao e janela do passo reconferidas;
        fora delas, rollback integral. A sessao da requisicao continua, ja sem restricao (restricted=false). Codigos novos
        mostrados uma unica vez. Aviso NOTICE_MFA_REPLACED ao titular depois do commit; falha do aviso nao desfaz a troca.
        Sem prova, sem fator pendente, codigo errado, replay ou passo vencido: 403 generico, sem efeito (codigo errado conta
        em R8m). Sessao que caiu, inclusive durante as esperas: 401. Os dois cookies: 400. Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] }, { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200':
          description: 'Desafio: sessao de identidade emitida (cookie __Host-nekkora_id). Sessao: fator substituido, a mesma sessao continua sem restricao'
          content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/IdentityEnrollmentConfirmation' }, { $ref: '#/components/schemas/IdentityFactorReplacement' } ] } } }
        '400': { description: 'Modo ambiguo (os dois cookies) ou, no modo sessao, code ausente ou recoveryCode presente', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid_request } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF do modo invalido; no modo sessao, tambem sem prova de troca, sem fator pendente, codigo errado, ja usado ou vencido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/verify:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityVerifyMfa
      summary: 'Verifica o TOTP ou um codigo de recuperacao (exatamente um); emite a sessao de identidade'
      description: >
        Na MESMA transacao, com a identidade travada (a troca de fator fica fora do intervalo): o fator confirmado e lido, o
        TOTP e conferido com o relogio lido depois de qualquer espera (passo vencido durante a espera: 401), e
        identity_login_complete conclui (consumo do desafio, credencial vigente, anti-replay, sessao); o passo gravado tem de
        estar no MESMO fator conferido, senao a transacao e desfeita (401). Codigo de recuperacao: sessao RESTRITA
        (DC-17.13; so cadastrar fator novo e logout ate T1), demais sessoes revogadas, demais desafios invalidados, aviso ao
        titular. Codigo errado ou passo ja usado: tentativa registrada e 401. Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200': { description: 'Sessao de identidade emitida (cookie __Host-nekkora_id); restricted=true quando nasceu de codigo de recuperacao', content: { application/json: { schema: { $ref: '#/components/schemas/IdentitySessionIssued' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/logout:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLogout
      summary: 'Encerra a sessao de identidade atual (idempotente; sem sessao = sem efeito; fora dos limitadores)'
      description: >
        As sessoes de organizacao derivadas caem na requisicao seguinte (DC-17.4), sem escrita entre organizacoes. SEM CHAVE:
        disponivel mesmo com o cadastro e a entrada geral desligados (encerrar sessao nunca depende de configuracao). Fora
        dos limitadores R7/R12 e sem depender do Redis; CSRF da sessao conferido no banco.
      security: [ {}, { identitySessionCookie: [], csrfHeader: [] } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/auth/step-up:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityStepUp
      summary: 'Step-up da sessao de identidade com o TOTP do fator da identidade (vale 5 min, so nesta sessao)'
      description: >
        P1 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. So o codigo
        TOTP: recoveryCode NAO e alternativa (code ausente: 400). Numa so transacao, na ordem global da 017: identidade e
        sessao travadas e reconferidas (ativa, no prazo, nao restrita; identidade ACTIVE), fator lido sob o lock, TOTP,
        anti-replay no fator (o passo so avanca), marcador de step-up SO nesta sessao, evento 13 (STEP_UP) e a janela do
        passo reconferida antes do commit. Codigo errado, ja usado ou vencido durante as esperas: 403 generico; codigo
        errado e replay contam em R8m (identidade global, o mesmo contador da verificacao do login). Sessao que caiu: 401.
        Sessao restrita a recuperacao (DC-17.13): 403, sem conferir o codigo. R12. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido; codigo errado, ja usado ou vencido; ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/password-confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityPasswordConfirm
      summary: '029: reconfirma a senha na sessao sem segundo fator (vale 5 min, so nesta sessao; substitui o step-up por TOTP)'
      description: >
        Politica aprovada pela titular em 2026-11-02 (relatorio docs/relatorios/2026-11-02-mfa-opcional.md). Sessao de
        identidade sem MFA de identidade que NUNCA confirmou fator, nao restrita, CSRF dela. A aplicacao confere o Argon2
        contra o hash vigente e identity_password_reconfirm (029) exige, sob o lock da identidade, que ele ainda seja a
        credencial vigente; grava password_step_up_at nesta sessao e o evento 19. Vale para tudo que hoje pede step-up
        recente na sessao de identidade (criar organizacao, aceitar convite, vincular conta, trocar senha) e para iniciar a
        ativacao do MFA. Senha errada (conta em R8), identidade com fator, sessao com MFA ou senha trocada no intervalo: 403,
        sem efeito. Sessao que caiu: 401. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordConfirmRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido; senha errada; identidade com fator, sessao com MFA ou sessao restrita', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/activate/start:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityMfaActivationStart
      summary: '029: ativacao voluntaria do MFA pelas configuracoes da conta - cria o TOTP pendente e devolve a URI otpauth'
      description: >
        Sessao de identidade sem MFA de identidade que nunca confirmou fator, com a senha reconfirmada ha ate 5 min (prova
        ativacao de identity_mfa_enroll_pending, 029); descarta o pendente anterior. Sem a prova, identidade com fator ou
        sessao com MFA: 403, sem efeito. Sessao que caiu: 401.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'URI otpauth do fator pendente', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido; sem a senha reconfirmada; identidade com fator', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/activate/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityMfaActivationConfirm
      summary: '029: conclui a ativacao do MFA com o TOTP do pendente; revoga TODAS as sessoes e emite a sessao nova com MFA'
      description: >
        So o TOTP (recoveryCode nao e alternativa). Com a senha reconfirmada ha ate 15 min nesta sessao, identity_mfa_activate
        (029) confirma o fator com o passo aceito (anti-replay), grava os codigos de recuperacao, revoga todas as sessoes da
        identidade (as sessoes de organizacao nascidas delas deixam de valer) e cria a sessao nova COM MFA, no cookie
        __Host-nekkora_id; evento 20. A partir dai o login pede o codigo e a senha nao substitui mais o TOTP. Codigo errado
        (conta em R8m), sem pendente ou sem a prova: 403. Sessao que caiu: 401.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200': { description: 'Fator ativo; sessao nova no cookie', content: { application/json: { schema: { $ref: '#/components/schemas/MfaActivated' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido; codigo errado; sem pendente ou sem a senha reconfirmada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/password:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityChangePassword
      summary: 'Troca a senha da identidade (sessao comum com step-up recente); revoga as demais sessoes'
      description: >
        Missao 002. Sessao de identidade NAO restrita (cookie __Host-nekkora_id) e CSRF dela; step-up de ate 5 min
        (POST /api/v1/auth/step-up, so TOTP). Senha nova pela politica da Platform (400). A senha atual e conferida por
        Argon2 fora de transacao contra o hash vigente; errada: 403 e conta em R8 (identidade global). Numa so transacao,
        identity_password_change (017) reconfere a prova depois dos locks e so troca se o hash vigente ainda for o
        conferido; invalida os desafios pendentes, revoga as DEMAIS sessoes (a da requisicao continua) e grava o evento 12.
        Sem step-up, sessao restrita ou senha trocada no intervalo: 403, sem efeito. Sessao que caiu: 401. Aviso
        NOTICE_PASSWORD_CHANGED ao titular depois do commit (falha do aviso nao desfaz a troca). O MFA nao muda. R12. Mesma
        chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { description: 'Corpo incompleto ou senha nova fora da politica', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid_request } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido; senha atual errada; sem step-up recente; sessao restrita; senha trocada no intervalo', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/recovery-codes:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityRegenerateRecoveryCodes
      summary: 'Regenera os codigos de recuperacao da identidade (sessao comum com step-up recente); o conjunto anterior e invalidado'
      description: >
        Missao 002. Sessao de identidade NAO restrita e CSRF dela; step-up de ate 5 min (so TOTP). Numa so transacao,
        identity_recovery_codes_regenerate (019) trava identidade, sessao, fator confirmado e codigos vivos, reconfere a
        prova depois dos locks, invalida o conjunto vivo e grava o novo para o fator vigente, com o evento 15. O conjunto
        novo e devolvido UMA unica vez (so os hashes ficam no banco). Sem step-up ou sessao restrita: 403, sem efeito. Sessao
        que caiu: 401. Aviso NOTICE_RECOVERY_CODES_REGENERATED depois do commit. R12. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'Conjunto novo de codigos', content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido; sem step-up recente; sessao restrita', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/password-reset/request:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityRequestPasswordReset
      summary: 'Pede a recuperacao de senha da identidade por e-mail: resposta uniforme, sem enumeracao'
      description: >
        Missao 002 (migration 020). Pre-autenticacao (cookie __Host-nekkora_pre e CSRF dele). Sempre 202 sem corpo, com
        piso de tempo (recovery-response-floor), para e-mail desconhecido, identidade nao ACTIVE ou nao verificada, limite
        R14 excedido (identidade global e IP, valores de R5) ou token emitido. So a identidade ACTIVE com e-mail verificado
        recebe token: sob o lock dela, os tokens de recuperacao vivos sao revogados, o novo e gravado (so o hash; uso unico;
        prazo de 30 min) e o evento 16 e registrado; o e-mail sai fora do caminho da resposta. E-mail malformado: 400. R12:
        429; Redis fora: 503. Chave propria nekkora.recuperacao-senha.enabled, so com a entrada geral ligada: desligada, 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses:
        '202': { description: 'Pedido recebido (resposta identica em qualquer desfecho)' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityConfirmPasswordReset
      summary: 'Conclui a recuperacao: consome o token e troca a senha na mesma transacao; nenhuma sessao criada; MFA preservado'
      description: >
        Missao 002 (migration 020). Pre-autenticacao. Politica da senha nova e Argon2 antes da transacao; na transacao,
        identity_password_reset trava identidade, token, credencial, demais tokens de recuperacao, desafios e sessoes, mede
        a hora depois dos locks e reconfere o prazo; consome o token, troca a senha, revoga TODAS as sessoes de identidade,
        invalida os desafios pendentes e os demais tokens de recuperacao e grava o evento 17. Nenhuma sessao e criada. O MFA
        nao muda: a proxima entrada exige o fator ou um codigo de recuperacao. Token malformado, desconhecido, de outro
        proposito, consumido, revogado ou vencido (inclusive durante a espera), identidade fora de ACTIVE, ou senha fora da
        politica: 400, sem efeito. Aviso NOTICE_PASSWORD_CHANGED depois do commit. Mesma chave do pedido.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/me/session:
    get:
      tags: [Entrada geral (identidade)]
      operationId: identitySessionState
      summary: 'Estado da sessao de identidade do cookie: restricted e o CSRF dela'
      description: >
        Para a interface retomar a jornada depois de recarregar a pagina. restricted=true: sessao nascida de codigo de
        recuperacao, antes de concluir a troca do fator (DC-17.13); so cadastrar e confirmar o fator novo e logout. Lido do
        banco a cada requisicao. Sem sessao valida: 401. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [] } ]
      responses:
        '200': { description: 'Sessao de identidade valida', content: { application/json: { schema: { $ref: '#/components/schemas/IdentitySessionState' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SignupDisabled' }

  /api/v1/me/organizations:
    get:
      tags: [Entrada geral (identidade)]
      operationId: identityOrganizations
      summary: 'Organizacoes em que a identidade pode entrar (vinculo ACTIVE, conta elegivel, organizacao ativa)'
      description: >
        Missao 1, desenho 6.4. Sessao de identidade (cookie __Host-nekkora_id), sem organizacao. A lista vem inteira de
        identity_organizations (017), com a mesma elegibilidade da emissao. Lista vazia e resposta legitima (identidade
        recem-confirmada). activationState (022) indica, por organizacao, se ela ainda aguarda a ativacao (capacidade de
        execucao zero) ou ja foi ativada pela operacao; e independente da situacao administrativa. canCreateOrganization (P2) e SO indicacao para a interface: chave da criacao de organizacao
        ligada, sessao nao restrita e identity_org_creation_allowed (R5 da 017) verdadeira (identidade ACTIVE e verificada,
        menos de 10 organizacoes criadas pelo cadastro). O step-up nao entra no calculo (e pedido na hora); a criacao
        reconfere tudo na funcao de escrita. 067: a indicacao passa a considerar tambem o perfil (membro solicita; Cliente
        nao cria) e o limite de organizacoes vazias - o detalhe esta em GET /api/v1/me/organization-creation. Sessao restrita a
        recuperacao (DC-17.13): 403. R12. Mesma chave da entrada geral (nekkora.entrada-geral.enabled): desligada, 404.
      security: [ { identitySessionCookie: [] } ]
      responses:
        '200': { description: 'Organizacoes da identidade', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityOrganizationList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RestrictedIdentitySession' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/authorizations:
    post:
      tags: [Login do aplicativo desktop]
      operationId: desktopAuthorizationStart
      summary: 'Navegador: abre o pedido de autorizacao do aplicativo desktop (PKCE S256, redirect de loopback)'
      description: >
        AGENT-CLIENT-LOGIN-001, contrato desktop-login/1. Com ou sem sessao de identidade. O pedido inteiro e validado e
        guardado no servidor por 5 min; o navegador recebe so o cookie opaco __Host-nekkora_desk (HttpOnly, Secure,
        SameSite=Strict). clientId: exatamente nekkora-agent-client (cliente publico, sem segredo). redirectUri: exatamente
        http://127.0.0.1:<porta>/callback, porta 1024-65535 (so a porta varia; localhost, outro host, outro caminho, consulta
        ou fragmento: 400). codeChallengeMethod: so S256 (plain ou ausente: 400). scope: exatamente "identity" ou exatamente
        "identity navigation" (AGENT-CLIENT-NAVEGACAO-001; qualquer outro texto, ordem, caixa ou espaco a mais: 400). Nada do
        pedido volta na resposta. Abrir o pedido nao autoriza nada. Chave nekkora.desktop-login.enabled E a entrada geral:
        desligada, 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAuthorizationRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/authorization:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopAuthorizationPending
      summary: 'Navegador: o aplicativo e a conta que vai autorizar a entrada'
      description: >
        Para a pagina de confirmacao: mostra SEMPRE a conta da sessao de identidade, mesmo com sessao ja aberta (nenhuma
        entrada silenciosa), e o escopo PEDIDO (scope), para a pagina dizer a pessoa o que ela esta concedendo: "identity"
        (so a propria conta) ou "identity navigation" (tambem ver organizacoes, workspaces, automacoes e versoes, e renomear
        automacao onde ela ja pode). Sem pedido vivo no cookie __Host-nekkora_desk: 404. Sessao restrita a recuperacao: 403.
      security: [ { identitySessionCookie: [], desktopRequestCookie: [] } ]
      responses:
        '200': { description: 'Pedido vivo', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAuthorizationPending' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RestrictedIdentitySession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/authorization/approve:
    post:
      tags: [Login do aplicativo desktop]
      operationId: desktopAuthorizationApprove
      summary: 'Navegador: a pessoa autenticada autoriza a entrada; emite o codigo de uso unico'
      description: >
        So com a sessao de identidade plena (login e MFA concluidos; nao restrita) e o CSRF dela, reconferida no banco no
        instante da aprovacao. Consome o pedido (uso unico) e emite o codigo de autorizacao (60 s, uso unico), preso ao
        pedido, a identidade e a ESTA sessao de identidade. redirectTo e montado pelo servidor a partir do redirect ja
        validado: http://127.0.0.1:<porta>/callback?code=...&state=...&iss=<origem publica>. Evento 21 (037). Com o escopo
        "identity navigation", a aprovacao tambem resolve, com a sessao de identidade desta requisicao, as organizacoes
        elegiveis da pessoa (as mesmas de GET /api/v1/me/organizations, ate 200) e as leva com o codigo; o token do
        navegador nao e guardado. Organizacao em que a pessoa entrar depois so aparece no login seguinte.
      security: [ { identitySessionCookie: [], desktopRequestCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'Autorizado', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopRedirect' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/authorization/deny:
    post:
      tags: [Login do aplicativo desktop]
      operationId: desktopAuthorizationDeny
      summary: 'Navegador: recusa o pedido (com ou sem sessao); devolve o retorno com error=access_denied'
      description: >
        Consome o pedido. redirectTo: http://127.0.0.1:<porta>/callback?error=access_denied&state=...&iss=... Nenhum codigo e
        emitido.
      security: [ { preAuthCookie: [], desktopRequestCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'Recusado', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopRedirect' } } } }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/token:
    post:
      tags: [Login do aplicativo desktop]
      operationId: desktopToken
      summary: 'Aplicativo: troca o codigo pela sessao do desktop (RFC 6749 4.1.3 + PKCE RFC 7636)'
      description: >
        Chamado pelo aplicativo, por TLS, SEM cookie, SEM Origin e SEM CSRF: vale o codigo com o code_verifier. Corpo
        application/x-www-form-urlencoded, cada parametro uma unica vez e nenhum na URL. O codigo e consumido antes de
        qualquer conferencia (PKCE, cliente ou redirect errados tambem o queimam). Reapresentar um codigo ja trocado:
        invalid_grant E a sessao que ele emitiu e revogada. A sessao de identidade que autorizou precisa continuar ativa.
        Resposta: token opaco Bearer, 15 min, sem refresh_token, com o escopo do pedido aprovado (identity ou identity
        navigation; a troca nao pede nem amplia escopo). Erros no formato da RFC 6749 5.2. Evento 22.
      security: []
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { $ref: '#/components/schemas/DesktopTokenRequest' } } } }
      responses:
        '200': { description: 'Sessao do desktop emitida (Cache-Control: no-store)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopToken' } } } }
        '400': { description: 'Troca recusada', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopTokenError' } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/session:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopSession
      summary: 'Aplicativo: a propria pessoa e o prazo que resta a sessao do desktop'
      description: >
        Authorization: Bearer <token>. Cookies sao ignorados. Vale so enquanto a sessao existe (15 min, sem renovacao: usar
        nao estende) E a sessao de identidade que a autorizou continua ativa no banco - logout no navegador e as revogacoes
        ja existentes (troca/redefinicao de senha, MFA, codigo de recuperacao) a encerram. Devolve o escopo da sessao
        (identity ou identity navigation); nenhuma organizacao, Worker ou permissao aqui. Fora de /api/v1/desktop/ o token
        nao autentica nenhuma rota da API.
      security: [ { desktopBearer: [] } ]
      responses:
        '200': { description: 'Sessao do desktop valida', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopSession' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/session/revoke:
    post:
      tags: [Login do aplicativo desktop]
      operationId: desktopSessionRevoke
      summary: 'Aplicativo: encerra a propria sessao do desktop (idempotente; sem chave e fora dos limitadores)'
      description: >
        Authorization: Bearer <token>, sem cookie e sem CSRF. Token ausente, desconhecido ou ja encerrado: 204, sem efeito. A
        sessao do navegador nao muda. Evento 23.
      security: [ {}, { desktopBearer: [] } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /api/v1/desktop/me:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopMe
      summary: 'Aplicativo: a propria pessoa (e-mail e nome)'
      description: >
        AGENT-CLIENT-NAVEGACAO-001, contrato desktop-navigation/1. Authorization: Bearer <token> de sessao do desktop com o
        escopo "identity navigation"; cookies sao ignorados; Cache-Control: no-store. Sessao com escopo "identity": 403.
        Token ausente, invalido, vencido ou com a sessao de identidade de origem encerrada: 401.
      security: [ { desktopBearer: [] } ]
      responses:
        '200': { description: 'A pessoa da sessao', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopPerson' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/organizations:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopOrganizations
      summary: 'Aplicativo: as organizacoes da pessoa'
      description: >
        Escopo "identity navigation". Contrato desktop-navigation/2 (AGENT-CLIENT-NAVEGACAO-002): as organizacoes da pessoa
        AGORA (ate 200), resolvidas a cada requisicao para a identidade da sessao: sessao de identidade de origem ativa e
        nao restrita, conta interna ativa ligada a identidade, vinculo ativo e organizacao ativa. A que a pessoa ganhou
        depois do login (convite aceito, organizacao criada) aparece na requisicao seguinte, com o mesmo token; a que deixou
        de passar some da lista, sem erro. A leitura nao renova a sessao do aplicativo. asOf = "request" identifica este
        comportamento; no contrato desktop-navigation/1 o campo nao existia e a lista era a da aprovacao do login.
        Organizacao aguardando ativacao aparece como na Web; nada e ativado. Ordem: nome e organizationId (a da lista da
        Web). Sem cursor. Duas organizacoes podem ter o mesmo nome: handle e organizationId as distinguem. Pessoa sem
        organizacao: 200 com items vazio.
      security: [ { desktopBearer: [] } ]
      responses:
        '200': { description: 'Organizacoes da pessoa (pode ser vazia)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopOrganizationList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/organizations/{org}/workspaces:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopWorkspaces
      summary: 'Aplicativo: workspaces ativos que a pessoa ve na organizacao'
      description: >
        Escopo "identity navigation". A mesma regra e a mesma consulta de GET /api/v1/o/{org}/workspaces?status=active:
        workspaces ATIVOS em que o vinculo da pessoa tem automation.read efetiva (papel organizacional ou de workspace),
        lida a cada requisicao. Ordem: nome (48 primeiros caracteres, ordenacao "C") e workspaceId. limit de 1 a 100 (padrao
        25). cursor: opaco e assinado, preso a esta rota, organizacao e vinculo; de outro contexto: 400. Organizacao
        inexistente, de outra pessoa ou em que ela deixou de ter acesso: 404 identico. Sem workspace visivel: 200 vazio.
      security: [ { desktopBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/DesktopOrg'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Pagina de workspaces (pode ser vazia)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopWorkspacePage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/organizations/{org}/workspaces/{workspace}/automations:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopAutomations
      summary: 'Aplicativo: automacoes ativas do workspace, com a ultima versao publicada e o que a pessoa pode fazer'
      description: >
        Escopo "identity navigation". A mesma regra e a mesma consulta de GET
        /api/v1/o/{org}/workspaces/{workspaceId}/automations?status=active: workspace sem automation.read efetiva,
        inexistente ou de outra organizacao: 404 identico. So automacoes ATIVAS; ordem: nome (48 primeiros caracteres,
        ordenacao "C") e automationId. latestPublishedVersion: a publicada de maior numero, ou null; package: o pacote
        recebido dessa versao (nome, versao e impressao), ou null se ela nao tem. capabilities vale para o workspace, na
        requisicao: rename = automation.manage; execute = automation.execute. Nenhum conteudo de arquivo, hash de arquivo,
        comando, segredo ou dado de outra pessoa.
      security: [ { desktopBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/DesktopOrg'
        - { name: workspace, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Pagina de automacoes (pode ser vazia)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAutomationPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/organizations/{org}/automations/{automation}/versions:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopAutomationVersions
      summary: 'Aplicativo: versoes da automacao, da mais nova para a mais antiga'
      description: >
        Escopo "identity navigation". A mesma regra e a mesma consulta de GET
        /api/v1/o/{org}/automations/{automationId}/versions (automation.read efetiva no workspace da automacao; fora do
        alcance: 404 identico). Ordem: versionNumber decrescente. package: o pacote recebido da versao, ou null.
      security: [ { desktopBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/DesktopOrg'
        - { name: automation, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Pagina de versoes (pode ser vazia)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAutomationVersionPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/desktop/organizations/{org}/automations/{automation}/versions/{version}/package:
    get:
      tags: [Login do aplicativo desktop]
      operationId: desktopVersionPackage
      summary: 'Aplicativo: baixar o pacote (ZIP) de uma versao publicada'
      description: >
        AGENT-CLIENT-PACOTES-001, contrato desktop-navigation/3. Exige sessao do aplicativo com o escopo
        "identity navigation packages" (a sessao de escopo "identity navigation" recebe 403: token anterior nao ganha o
        download) e, no workspace da automacao, automation.execute ou automation.manage (quem so tem automation.read ve os
        metadados e recebe 403 aqui). Identidade, organizacao, vinculo, automacao, versao e permissao sao conferidos a cada
        requisicao; nada alem dos ids do caminho vem do aplicativo. Organizacao, automacao ou versao fora do alcance, ou
        versao de outra automacao: 404. Automacao ou workspace inativo, versao nao publicada, versao sem pacote, ou arquivo
        ausente ou corrompido no armazenamento: 409, sem bytes. Resposta: os bytes guardados, relidos e conferidos pelo
        sha256, direto desta rota (sem redirecionamento e sem URL temporaria); Content-Length, Cache-Control no-store,
        X-Artifact-Sha256 e X-Package-Fingerprint, iguais ao sha256 e ao fingerprint que a lista de versoes informa. Cada
        download autorizado e auditado (ato 9 da 040), sem token, URL ou conteudo. A rota nao executa, nao publica e nao
        altera a versao.
      security: [ { desktopBearer: [] } ]
      parameters:
        - { $ref: '#/components/parameters/DesktopOrg' }
        - { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: version, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      responses:
        '200':
          description: 'ZIP da versao publicada'
          headers:
            X-Artifact-Sha256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'sha256 dos bytes' }
            X-Package-Fingerprint: { schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'impressao do pacote' }
          content: { application/zip: { schema: { type: string, format: binary } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/desktop/organizations/{org}/automations/{automation}:
    patch:
      tags: [Login do aplicativo desktop]
      operationId: desktopAutomationRename
      summary: 'Aplicativo: renomeia a automacao (so o nome)'
      description: >
        Escopo "identity navigation". Sem cookie e sem CSRF: vale o token Bearer. Nome pela regra da criacao de automacao
        (1 a 80 caracteres, sem caracteres de controle, nao so espacos; os espacos das extremidades sao retirados): fora dela,
        400. Automacao fora do alcance de leitura da pessoa (inexistente, de outra organizacao ou de workspace sem acesso):
        404 identico. Visivel, mas sem automation.manage no workspace dela: 403. Automacao ou workspace nao ativo: 409. So o
        nome da automacao muda: versoes, artefatos, manifestos, impressoes e conteudo publicado nao sao tocados. Nome igual
        ao atual: 200, sem gravar. Nome de automacao nao e unico. Auditoria: automation_admin_events, ato 8 (038), com o
        vinculo de quem renomeou.
      security: [ { desktopBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/DesktopOrg'
        - { name: automation, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAutomationRename' } } } }
      responses:
        '200': { description: 'Renomeada (ou ja tinha esse nome)', content: { application/json: { schema: { $ref: '#/components/schemas/DesktopAutomationRenamed' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DesktopScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/organizations:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityCreateOrganization
      summary: 'Cria uma organizacao com a identidade como ORG_ADMIN (exige step-up da identidade de ate 5 min)'
      description: >
        P2 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. Corpo: name
        e legalName opcional, cada um com 1 a 120 pontos de codigo, sem espaco nas pontas e sem caractere de controle (fora
        disso: 400). Uma transacao que chama so identity_create_organization: a funcao reconfere, sob o lock da identidade,
        sessao nao restrita, step-up de ate 5 min, identidade ACTIVE e verificada e o teto de 10, e cria organizacao, conta,
        vinculo, ORG_ADMIN e o evento 6 (ORG_CREATED) no mesmo commit. Recusa da funcao: 403 generico; sessao que caiu:
        401. R11 (3 reservas por identidade a cada 24 h; devolvidas quando a criacao comprovadamente nao aconteceu, mantidas em resultado desconhecido; Redis fora: 503) e R12. Chave propria
        (nekkora.criacao-organizacao.enabled) e a da entrada geral: qualquer uma desligada, 404. Em seguida, a troca
        (/api/v1/sessions/organization) da a sessao de organizacao. PLATFORM-AGENT-V2-003 T10 (034): o nome e unico entre as
        organizacoes CRIADAS PELA MESMA IDENTIDADE pelo cadastro (autoria, nao propriedade; espacos internos repetidos e
        maiusculas/minusculas nao distinguem; acentos e pontuacao distinguem). Repetido: 409 conflict + reason
        organization_name_taken, nada criado (a reserva de R11 e devolvida). Outras identidades, e organizacoes em que a pessoa
        so participa por convite, nao contam. Concorrentes da mesma identidade: uma criada, a outra 409. A organizacao nova
        recebe um identificador legivel unico e estavel (handle). PLATFORM-LICENCIAMENTO-001 (067): o PERFIL de quem cria e
        decidido no servidor a cada tentativa. Cria direto a recem-cadastrada (sem conta ativa) e quem administra alguma
        organizacao. O membro interno que nao administra nenhuma NAO cria: 409 organization_creation_requires_request (ele
        solicita: POST /api/v1/organization-requests). Quem so tem conta do tipo Cliente (mesmo e-mail verificado) nao cria nem
        solicita: 403 forbidden + reason organization_creation_client_profile. Limite de organizacoes VAZIAS (ativas, sem
        nenhuma automacao) por responsavel, tres: 409 empty_organization_limit_reached. Nao ha teto fixo de organizacoes
        criadas. Quem cria fica registrado como RESPONSAVEL pela organizacao. A funcao do banco reconfere
        tudo sob a trava da identidade (se ela recusar depois da conferencia da aplicacao, 403 generico). Em nenhuma recusa
        algo e criado, e a reserva de R11 e devolvida. Criar organizacao nao concede licenca.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCreateRequest' } } } }
      responses:
        '201': { description: 'Organizacao criada', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCreated' } } } }
        '409': { description: 'T10 (034): esta identidade ja criou, pelo cadastro, uma organizacao com esse nome (organization_name_taken); ou, 067: organization_creation_requires_request, empty_organization_limit_reached. Nada foi criado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict, reason: organization_name_taken } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido; sem step-up recente, teto atingido, identidade inelegivel ou sessao restrita (recusa generica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/me/organization-creation:
    get:
      tags: [Entrada geral (identidade)]
      operationId: identityOrganizationCreation
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; IdentityOrganizationsController; OrganizationProfilesIT)
      summary: 'Perfil de quem cria organizacao, limites e as organizacoes de que a pessoa e responsavel'
      description: >
        SO indicacao para a interface; o servidor decide em cada ato. profile: FIRST (sem conta ativa: cria a primeira),
        ADMIN (administra alguma organizacao: cria direto), MEMBER (conta interna ativa, nao administra nenhuma: solicita) ou
        CLIENT (so conta do tipo Cliente, reconhecida pelo mesmo e-mail verificado: nao cria nem solicita). O perfil e
        reavaliado a cada chamada; ser Cliente numa organizacao nao tira a administracao de outra. canCreate e
        cannotCreateReason (o reason que a criacao responderia). canRequest: MEMBER com menos de tres pedidos pendentes.
        emptyOrganizations: as organizacoes ATIVAS e sem nenhuma automacao de que a pessoa e responsavel, contra o limite
        (tres, configuravel); desativadas nao contam. responsibleFor: as organizacoes de que a pessoa e responsavel, inclusive
        as desativadas, que nao aparecem em /api/v1/me/organizations - state ACTIVE, DEACTIVATED (desativada por esta acao;
        canReactivate) ou BLOCKED (parada por decisao da Nekkora, ou com bloqueio registrado: a reativacao nao a remove).
        Mesmas chaves da criacao: qualquer uma desligada, 404.
      security: [ { identitySessionCookie: [] } ]
      responses:
        '200': { description: 'Estado da criacao', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCreationState' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RestrictedIdentitySession' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/organization-requests:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityRequestOrganization
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; OrganizationProfilesIT)
      summary: 'O membro pede a criacao de uma organizacao ao administrador de uma organizacao em que e membro'
      description: >
        Sessao de identidade nao restrita e CSRF dela, com a confirmacao reforcada de ate 5 min (sem ela: 403 forbidden +
        reason step_up_required). organizationId: a organizacao EM QUE a pessoa pede - ela tem de ser membro interno ativo
        dela, e e um administrador dessa organizacao quem decide. So o perfil MEMBER pede: quem administra alguma organizacao
        cria direto, e quem so tem conta do tipo Cliente recebe 403 organization_creation_client_profile. Pedido em
        organizacao de que nao e membro, por quem ja administra alguma, ou com tres pedidos pendentes: 409
        organization_request_not_available. Pedir nao cria nada: a organizacao so nasce na aprovacao. Nome: mesma regra da
        criacao (legalName ausente = name).
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, name]
              properties:
                organizationId: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                legalName: { type: string, minLength: 1 }
      responses:
        '201': { description: 'Pedido registrado', content: { application/json: { schema: { type: object, required: [requestId], properties: { requestId: { type: string, format: uuid } } } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, sessao restrita; step_up_required; organization_creation_client_profile', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '409': { description: 'organization_request_not_available', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/me/organization-requests:
    get:
      tags: [Entrada geral (identidade)]
      operationId: identityOrganizationRequests
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; OrganizationProfilesIT)
      summary: 'Os pedidos de criacao de organizacao feitos pela pessoa'
      description: >
        Ate 50, do mais recente. state: PENDING, APPROVED ou REFUSED. responsible (so em APPROVED): APPROVER (o administrador
        que aprovou ficou responsavel; a pessoa NAO recebeu acesso a nova organizacao) ou REQUESTER (ela e a responsavel e
        administradora). createdOrganizationId so vem quando a pessoa ficou responsavel.
      security: [ { identitySessionCookie: [] } ]
      responses:
        '200': { description: 'Pedidos', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MyOrganizationRequest' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RestrictedIdentitySession' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/organization-deactivations:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityDeactivateOrganization
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; OrganizationProfilesIT)
      summary: 'O responsavel desativa a organizacao (nada e apagado nem liberado)'
      description: >
        Sessao de identidade nao restrita, CSRF e confirmacao reforcada (sem ela: 403 step_up_required). So o RESPONSAVEL pela
        organizacao que ainda a administra: outro, 409 organization_not_responsible. Com trabalho em andamento em qualquer
        automacao (inclusive ocupacao incerta): 409 organization_work_in_progress. Ja parada: 409 organization_state_conflict.
        Desativada, ninguem entra nela e as sessoes abertas caem na requisicao seguinte. Historico, licencas, periodos,
        vinculos e entregas ficam como estao: desativar NAO libera licenca para outra automacao e nao muda o ciclo. A
        desativada deixa de contar no limite de organizacoes vazias.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationRef' } } } }
      responses:
        '204': { description: 'Desativada' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, sessao restrita, ou step_up_required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '409': { description: 'organization_not_responsible, organization_work_in_progress, organization_state_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/organization-reactivations:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityReactivateOrganization
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; OrganizationProfilesIT)
      summary: 'O responsavel reativa a organizacao que ele desativou'
      description: >
        Mesmas exigencias da desativacao. So desfaz a desativacao feita por aquela acao: organizacao parada por decisao da
        Nekkora, ou com bloqueio da Nekkora registrado, responde 409 organization_blocked_by_nekkora e nada muda. O limite de
        organizacoes vazias e RECONFERIDO: reativar uma vazia com o limite cheio responde 409
        empty_organization_limit_reached. Organizacao ativa: 409 organization_state_conflict.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationRef' } } } }
      responses:
        '204': { description: 'Reativada' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, sessao restrita, ou step_up_required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '409': { description: 'organization_not_responsible, organization_blocked_by_nekkora, empty_organization_limit_reached, organization_state_conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/links/start:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLinkStart
      summary: 'Vinculacao, etapa 1: prova da conta antiga (senha + TOTP ou codigo de recuperacao da conta); 204 + cookie do desafio'
      description: >
        P3 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. A conta e
        procurada pelo e-mail da propria identidade na organizacao pedida: a pessoa nunca informa outro e-mail, outra conta
        ou outra pessoa, e nenhum administrador vincula em nome de alguem. Corpo: organizationId, password e EXATAMENTE um
        de code (TOTP da conta) e recoveryCode (codigo de recuperacao da conta); nenhum ou os dois, password ausente ou
        organizationId malformado: 400. Argon2 fora da transacao (hash ficticio quando nao ha conta, mesmo custo); depois,
        numa transacao, na ordem global da 017: identidade e sessao travadas e reconferidas, organizacao FOR SHARE, conta FOR
        UPDATE (credencial IGUAL a conferida pelo Argon2, conta interna elegivel e nao vinculada, mesmo e-mail), fator local
        com anti-replay (passo so avanca) ou codigo local consumido (evento mfa_events 2 e aviso, como no login), revogacao do
        desafio anterior da identidade e o desafio novo, amarrado ao par exato identidade/conta, valido por 5 min; a sessao e
        a janela do passo sao reconferidas antes do commit. Sucesso: 204 e o cookie __Host-nekkora_link (SameSite=Strict,
        Max-Age=300); a etapa 1 NAO vincula. QUALQUER falha da prova: o mesmo 401, sem distinguir conta inexistente, senha
        errada, codigo errado, conta inelegivel, organizacao inativa ou conta ja vinculada. R13 (5 falhas em 15 min por
        identidade e por conta alvo; falha fechada) e R12. Sessao restrita a recuperacao: 403. Chave propria
        (nekkora.vinculacao.enabled) e a da entrada geral: qualquer uma desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkStartRequest' } } } }
      responses:
        '204': { description: 'Desafio de vinculacao emitido (cookie __Host-nekkora_link); nada vinculado ainda' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: 'Sem sessao de identidade valida, ou prova da conta antiga recusada (resposta unica para qualquer causa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unauthenticated } } } }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/links/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLinkConfirm
      summary: 'Vinculacao, etapa 2: prova da identidade (step-up de ate 5 min) e consumo do desafio; fecha a entrada local da conta'
      description: >
        P3. Sessao de identidade nao restrita COM step-up de ate 5 min (/api/v1/auth/step-up), o cookie __Host-nekkora_link
        da etapa 1 e o CSRF da sessao de identidade. Uma transacao que chama so identity_link_account (017): sob os seus
        locks, a funcao reconfere step-up, conta, e-mail e ausencia de vinculo e consome o desafio so se ele for da identidade
        da sessao, estiver no prazo e a credencial da conta ainda for a da etapa 1; no mesmo commit, revoga as sessoes da
        organizacao da conta, invalida desafios, tokens e codigos locais, desabilita o fator local, grava o vinculo
        (link_channel vinculacao) e o evento 9 (IDENTITY_LINKED). Depois do commit, aviso ao endereco. Sucesso: 204; recusa
        da funcao (sem step-up, desafio ausente, vencido, de outra identidade, substituido ou ja usado, credencial trocada,
        conta inelegivel ou ja vinculada): 403 generico, sem efeito. Nos dois casos o cookie do desafio expira. Em seguida, a
        pessoa entra na organizacao pela troca (/api/v1/sessions/organization). R12. Chaves: as mesmas da etapa 1.
      security: [ { identitySessionCookie: [], linkChallengeCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkConfirmRequest' } } } }
      responses:
        '204': { description: 'Conta vinculada; a entrada local da conta foi fechada no mesmo ato' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, sessao restrita, ou recusa da vinculacao (generica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/sessions/organization:
    post:
      tags: [Entrada geral (identidade)]
      operationId: exchangeOrganizationSession
      summary: 'Troca a sessao de identidade por sessao de organizacao; resposta unica para qualquer recusa'
      description: >
        Missao 1, desenho 6.5 e DC-17.6. identity_org_session_target indica a candidata; a emissao, em transacao de
        organizacao READ COMMITTED, trava a organizacao antes de tudo, e a trigger da 017 reconfere vinculo, sessao de
        identidade (ativa, nao restrita), identidade e elegibilidade da conta, da organizacao e do vinculo interno. Sucesso:
        sessao de organizacao no cookie __Host-nekkora_session (SameSite=Lax), com o marcador de MFA herdado e prazo que nao
        passa o da sessao de identidade; as rotas /api/v1/o/{org}/... funcionam sem alteracao, e a sessao cai na requisicao
        seguinte se a sessao de identidade for encerrada (DC-17.4). Organizacao inexistente, suspensa ou encerrada, sem
        vinculo, vinculo inativo, conta inelegivel ou mudanca entre a resolucao e a emissao: 200 sem_acesso, sem distinguir
        a causa. As duas respostas 200 tem o mesmo piso de tempo. R10 (por sessao de identidade) e R12. organizationId
        malformado ou ausente: 400. Sessao restrita a recuperacao: 403. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSessionRequest' } } } }
      responses:
        '200': { description: 'sessao_criada (cookie __Host-nekkora_session e CSRF da sessao de organizacao) ou sem_acesso', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSessionResult' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/invitations/accept:
    post:
      tags: [Entrada geral (identidade)]
      operationId: acceptInvitation
      summary: 'Aceita convite pela identidade (step-up de ate 5 min); nenhuma vinculacao por igualdade de e-mail'
      description: >
        Contrato de 2026-10-27, secao 4.3. Sessao de identidade nao restrita COM step-up (/api/v1/auth/step-up) e CSRF
        dela. A organizacao vai no corpo e chega antes do token: o hash so e procurado dentro dela. Uma transacao que chama so
        identity_accept_invitation (023): identidade -> sessao -> organizacao (ATIVA) -> convite -> contas; hora medida depois
        dos locks; reconfere step-up, prazo, e-mail do convite = e-mail da identidade e a AUTORIDADE DO EMISSOR no instante do
        aceite. Sem conta na organizacao: cria conta interna ativa (e-mail verificado da identidade), vinculo, o papel do
        convite (atribuido pelo emissor) e a ligacao (link_channel convite). Conta ligada com vinculo retirado: readmissao.
        Destinataria sem identidade: conclui antes o cadastro (/api/v1/signup); o convite nao cadastra. Convite inexistente,
        vencido, revogado, ja aceito, de outro e-mail, de emissor sem autoridade ou organizacao nao ativa: 404 unico, sem efeito.
        409: already_member (ja membro ativo), account_exists (conta da organizacao com o e-mail, nao ligada a esta identidade:
        use /api/v1/links/*), account_unavailable (conta ligada suspensa ou vinculo inativo nao retirado). Depois, a troca
        (/api/v1/sessions/organization). Chaves nekkora.convites.enabled e nekkora.entrada-geral.enabled: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAcceptRequest' } } } }
      responses:
        '200': { description: 'Aceito', content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAccepted' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { description: 'Convite invalido para esta identidade (resposta unica), ou convites desligados', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
        '409': { description: 'already_member, account_exists ou account_unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: account_exists } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/me:
    get:
      tags: [Identidade e sessao]
