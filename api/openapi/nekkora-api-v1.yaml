              workspaceId: { type: [string, 'null'], format: uuid }
              invitationId: { type: [string, 'null'], format: uuid }
              assignmentId: { type: [string, 'null'], format: uuid }
              grantId: { type: [string, 'null'], format: uuid }
              decision: { type: [string, 'null'], enum: [KEEP, SUSPEND, REVOKE, null] }
              correlationId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    Me:
      type: object
      required: [accountType, displayName, email, organizationId, organizationActivationState, stepUpMethod]
      properties:
        accountType: { type: string, enum: [internal, external] }
        displayName: { type: string }
        email: { type: string }
        organizationId: { type: string, format: uuid }
        organizationActivationState: { $ref: '#/components/schemas/OrganizationActivationState' }
        organizationLicenseModel: { $ref: '#/components/schemas/OrganizationLicenseModel' }
        stepUpMethod: { $ref: '#/components/schemas/StepUpMethod' }
    OrganizationLicenseModel:
      type: string
      enum: [legacy, licensed]
      description: >
        PLATFORM-LICENCIAMENTO-001. licensed: a organizacao esta no modelo por licenca - a capacidade e tecnica (limites iguais
        para todas) e NAO depende da ativacao pela operacao; o que habilita uma automacao e a licenca. legacy: modelo anterior,
        em que a ativacao libera a capacidade. A tela usa para nao dizer "aguardando ativacao: nenhum Worker pode ser
        registrado" a quem ja pode registrar.
    OrganizationActivationState:
      type: string
      enum: [AGUARDANDO_ATIVACAO, ATIVADA]
      description: >
        Ciclo de ativacao da organizacao (migration 022), INDEPENDENTE da situacao administrativa (ativa, suspensa,
        encerrada). AGUARDANDO_ATIVACAO: capacidade de execucao zero (nenhum Worker registrado, nenhuma execucao simultanea
        ou pendente) ate a ativacao pela operacao da Nekkora; toda organizacao criada nasce assim. ATIVADA: a operacao aplicou
        limites explicitos. So indicacao para a interface: os valores dos limites nao sao expostos e a admissao de execucao
        continua decidida no banco.
    MfaResetRequest: { type: object, required: [reason], properties: { reason: { type: string, enum: [DISPOSITIVO_PERDIDO, DISPOSITIVO_TROCADO, SUSPEITA_COMPROMETIMENTO, OUTRO] } } }
    OperationalLinkCode: { type: object, required: [code, expiresAt], properties: { code: { type: string }, expiresAt: { type: string, format: date-time } } }
    PortalWorkspaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { type: object, required: [workspaceId, name], properties: { workspaceId: { type: string, format: uuid }, name: { type: string } } } }
    PortalExecution:
      type: object
      required: [executionId, automation, createdAt, startedAt, finishedAt, durationMs, status, statusReason]
      properties:
        executionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid, description: 'omitido quando a conta externa tem um unico workspace autorizado' }
        automation: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        statusReason: { $ref: '#/components/schemas/ExecutionStatusReason' }
    PortalExecutionPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/PortalExecution' } }, nextCursor: { type: [string, 'null'] } } }
    PortalEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 1000, items: { type: object, required: [type, receivedAt], properties: { type: { type: string, enum: [process_started, process_succeeded, process_failed, process_start_failed, process_cancelled] }, receivedAt: { type: string, format: date-time } } } }
    RemoteExecutionRequest:
      type: object
      additionalProperties: false
      required: [automationVersionId, agentId, requestKey]
      properties:
        automationVersionId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        requestKey: { type: string, format: uuid, description: 'Gerado pelo navegador; repeticao idempotente' }
        authorizeVersion: { type: boolean, description: 'PLATFORM-LICENCIAMENTO-001 (S2): true e o ACEITE EXPLICITO desta versao nesta maquina, no mesmo passo. Cria a autorizacao da versao para o Worker da maquina se nao houver uma que sirva; mesmo ato, mesmas recusas e mesma trilha da rota de autorizacao. Nunca vale para versoes futuras. Ausente ou false: nada e autorizado.' }
        authorizationValidUntil: { type: string, format: date-time, description: 'So com authorizeVersion. Obrigatorio na organizacao do modelo anterior; no modelo por licenca e opcional e limitado ao fim da cobertura da licenca.' }
    RemoteExecutionCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [agentId, agentName, workerId, workerName, requestable, missing, authorization, python, dependencyCheck]
            properties:
              agentId: { type: string, format: uuid }
              agentName: { type: string }
              workerId: { type: string, format: uuid }
              workerName: { type: string }
              requestable: { type: boolean }
              missing:
                type: array
                items: { type: string, enum: [LICENSE_REQUIRED, LICENSE_EXPIRED, PACKAGE_NOT_SUPPORTED, PACKAGE_NOT_REGISTERED, REQUIREMENTS_NOT_DECLARED, REQUIREMENTS_CONFLICT, AUTHORIZATION_MISSING, AUTHORIZATION_REVOKED, AUTHORIZATION_EXPIRED, MACHINE_PAUSED, MACHINE_INCOMPATIBLE, MACHINE_BUSY, MACHINE_UNCONFIRMED, MACHINE_FINISHING, MACHINE_OCCUPIED, MACHINE_DISK_PRESSURE, PYTHON_NOT_SELECTED, PYTHON_NOT_IN_INVENTORY] }
              authorization:
                type: [object, 'null']
                required: [authorizationId, validUntil, status]
                properties:
                  authorizationId: { type: string, format: uuid }
                  validUntil: { type: string, format: date-time }
                  status: { type: string, enum: [VALID, REVOKED, EXPIRED] }
              python:
                oneOf:
                  - { $ref: '#/components/schemas/RemotePythonChoice' }
                  - { type: 'null' }
              dependencyCheck:
                oneOf:
                  - { $ref: '#/components/schemas/RemoteDependencyCheck' }
                  - { type: 'null' }
    RemoteDependencyCheck:
      type: object
      description: >
        A verificacao sob demanda mais recente das dependencias de uma automacao no Python escolhido de uma maquina. E
        informacao: a conferencia que vale para executar e a da maquina, antes de iniciar.
      additionalProperties: false
      required: [checkId, environmentId, requirementsRevision, requestedAt, answerValidUntil, state, outcome, missing, answeredAt, current]
      properties:
        checkId: { type: string, format: uuid }
        environmentId: { type: string, description: 'O ambiente Python conferido (identificador opaco)' }
        requirementsRevision: { type: integer }
        requestedAt: { type: string, format: date-time }
        answerValidUntil: { type: string, format: date-time }
        state: { type: string, enum: [PENDING, ANSWERED, UNANSWERED], description: 'UNANSWERED: o prazo venceu sem resposta - nao foi possivel verificar' }
        outcome: { type: [string, 'null'], enum: [SATISFIED, MISSING, ENVIRONMENT_GONE, NOT_VERIFIED, null], description: 'So em ANSWERED' }
        missing: { type: array, items: { type: string }, description: 'So com MISSING: o que falta, do que foi perguntado (nome==versao)' }
        answeredAt: { type: [string, 'null'], format: date-time }
        current: { type: boolean, description: 'O que foi conferido ainda e a escolha do Python e a revisao das dependencias de agora' }
    RemotePythonChoice:
      type: object
      description: 'Ambiente Python escolhido para uma automacao numa maquina. Identificador opaco publicado pela maquina; nunca um caminho.'
      additionalProperties: false
      required: [environmentId, pythonVersion, inInventory, selectedAt]
      properties:
        environmentId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        pythonVersion: { type: string, description: 'A versao que o inventario da maquina dizia quando a escolha foi feita' }
        inInventory: { type: boolean, description: 'O ambiente ainda esta no inventario atual da maquina' }
        selectedAt: { type: string, format: date-time }
    RemoteAttemptLogs:
      type: object
      additionalProperties: false
      required: [attemptId, items, total, automationLines, systemLines, nextAfter, closure, retentionLoss, expiration]
      properties:
        attemptId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sequence, capturedAt, channel, level, truncated, message, textRemoved]
            properties:
              sequence: { type: integer, minimum: 1, maximum: 50000 }
              capturedAt: { type: string, format: date-time, description: 'Quando a maquina capturou a linha (relogio dela)' }
              channel: { type: string, enum: [STDOUT, STDERR, EXECUTOR] }
              level: { type: string, enum: [UNKNOWN] }
              truncated: { type: boolean, description: 'A linha passava de 8 KiB e foi cortada pela maquina' }
              message: { type: string }
              textRemoved: { type: boolean, description: 'O texto foi apagado pela retencao' }
        total: { type: integer, minimum: 0, description: 'Linhas que a Platform tem desta tentativa = automationLines + systemLines' }
        automationLines: { type: integer, minimum: 0, description: 'Linhas que o PROCESSO DA AUTOMACAO escreveu (STDOUT e STDERR) e a Platform tem' }
        systemLines: { type: integer, minimum: 0, description: 'Avisos do proprio aplicativo da maquina (EXECUTOR), por exemplo o aviso de limite atingido. Ocupam lugar no limite de linhas da tentativa, mas nao sao saida da automacao' }
        nextAfter: { type: [integer, 'null'] }
        closure:
          type: [object, 'null']
          additionalProperties: false
          required: [lines, droppedLines, closedAt]
          properties:
            lines: { type: integer, minimum: 0, description: 'Linhas que a maquina enviou, contando os avisos do proprio aplicativo (systemLines)' }
            droppedLines: { type: integer, minimum: 0, description: 'Linhas DA AUTOMACAO que a maquina descartou por limite. O que a automacao escreveu = automationLines + droppedLines (com o envio fechado e sem perda)' }
            closedAt: { type: string, format: date-time }
        retentionLoss:
          type: [object, 'null']
          additionalProperties: false
          required: [localCount, reportedAt]
          description: >-
            A maquina avisou que REMOVEU, pelo prazo de guarda local dela, o que ainda guardava desta tentativa sem a confirmacao de
            recebimento. null = nenhum aviso. localCount e quanto havia NA MAQUINA quando ela removeu; nao e quanto se perdeu.
          properties:
            localCount: { type: integer, minimum: 0, description: 'Linhas que a maquina tinha capturado. Compare com total (o que a Platform tem)' }
            reportedAt: { type: string, format: date-time, description: 'Quando o aviso chegou a Platform' }
        expiration:
          type: [object, 'null']
          additionalProperties: false
          required: [expiredAt, confirmedAt, retentionDays, deliveryEndedAt, deliveryEnd, items]
          description: >-
            057: o conteudo desta tentativa VENCEU pela retencao do servidor (o texto das linhas foi apagado; cada linha continua existindo, com textRemoved = true). null = nao venceu. O prazo conta do fim da
            entrega (deliveryEndedAt): a maquina fechou o envio (CLOSED), avisou que perdeu o que guardava (LOSS_NOTICE) ou o vinculo
            sob o qual a tentativa rodou foi encerrado (LINK_ENDED); ou, na entrega que nao se concluiu, o ultimo progresso dela (NO_PROGRESS, 059). Tentativa em andamento ou com resultado nao confirmado sem reconciliacao nao vence. O historico da tentativa nao e removido.
          properties:
            expiredAt: { type: string, format: date-time, description: 'Quando o vencimento foi registrado' }
            confirmedAt: { type: [string, 'null'], format: date-time, description: 'Quando a remocao do conteudo foi confirmada; null = em andamento' }
            retentionDays: { type: integer, minimum: 1, description: 'O prazo aplicado, em dias' }
            deliveryEndedAt: { type: string, format: date-time }
            deliveryEnd: { type: string, enum: [CLOSED, LOSS_NOTICE, LINK_ENDED, NO_PROGRESS], description: 'NO_PROGRESS (059): entrega INCOMPLETA - venceu o teto sem progresso de entrega; a maquina nao fechou o envio e nenhum recebimento e indicado' }
            items: { type: integer, minimum: 0, description: 'Linhas que tinham texto quando venceu' }
    RemoteAttemptResults:
      type: object
      additionalProperties: false
      required: [attemptId, items, closure, retentionLoss, expiration]
      properties:
        attemptId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, fileName, sizeBytes, sha256, receivedAt, available]
            properties:
              number: { type: integer, minimum: 1, maximum: 50 }
              fileName: { type: string, description: 'Nome relativo a pasta de saida da execucao; nunca um caminho absoluto' }
              sizeBytes: { type: integer, minimum: 0 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              receivedAt: { type: string, format: date-time }
              available: { type: boolean, description: 'Os bytes ainda estao guardados' }
        closure:
          type: [object, 'null']
          additionalProperties: false
          required: [sent, skippedByLimit, closedAt]
          properties:
            sent: { type: integer, minimum: 0 }
            skippedByLimit: { type: integer, minimum: 0, description: 'Arquivos que a maquina deixou de enviar por limite' }
            closedAt: { type: string, format: date-time }
        retentionLoss:
          type: [object, 'null']
          additionalProperties: false
          required: [localCount, reportedAt]
          description: >-
            A maquina avisou que REMOVEU, pelo prazo de guarda local dela, o que ainda guardava desta tentativa sem a confirmacao de
            recebimento. null = nenhum aviso. localCount e quanto havia NA MAQUINA quando ela removeu; nao e quanto se perdeu.
          properties:
            localCount: { type: integer, minimum: 0, description: 'Arquivos que havia na pasta de saida da maquina. Compare com items (o que a Platform tem)' }
            reportedAt: { type: string, format: date-time, description: 'Quando o aviso chegou a Platform' }
        expiration:
          type: [object, 'null']
          additionalProperties: false
          required: [expiredAt, confirmedAt, retentionDays, deliveryEndedAt, deliveryEnd, items]
          description: >-
            057: o conteudo desta tentativa VENCEU pela retencao do servidor (os bytes dos arquivos foram removidos; nome, tamanho e SHA-256 continuam, com available = false). null = nao venceu. O prazo conta do fim da
            entrega (deliveryEndedAt): a maquina fechou o envio (CLOSED), avisou que perdeu o que guardava (LOSS_NOTICE) ou o vinculo
            sob o qual a tentativa rodou foi encerrado (LINK_ENDED); ou, na entrega que nao se concluiu, o ultimo progresso dela (NO_PROGRESS, 059). Tentativa em andamento ou com resultado nao confirmado sem reconciliacao nao vence. O historico da tentativa nao e removido.
          properties:
            expiredAt: { type: string, format: date-time, description: 'Quando o vencimento foi registrado' }
            confirmedAt: { type: [string, 'null'], format: date-time, description: 'Quando a remocao do conteudo foi confirmada; null = em andamento' }
            retentionDays: { type: integer, minimum: 1, description: 'O prazo aplicado, em dias' }
            deliveryEndedAt: { type: string, format: date-time }
            deliveryEnd: { type: string, enum: [CLOSED, LOSS_NOTICE, LINK_ENDED, NO_PROGRESS], description: 'NO_PROGRESS (059): entrega INCOMPLETA - venceu o teto sem progresso de entrega; a maquina nao fechou o envio e nenhum recebimento e indicado' }
            items: { type: integer, minimum: 0, description: 'Arquivos que estavam guardados quando venceu' }
    RemoteExecution:
      type: object
      required: [remoteExecutionId, workspaceId, automationId, automationVersionId, versionNumber, state, requirementsRevision, dependencies, requestedAt, cancelRequestedAt, attempts]
      properties:
        remoteExecutionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        automationVersionId: { type: string, format: uuid }
        versionNumber: { type: integer }
        state: { $ref: '#/components/schemas/RemoteAttemptState' }
        requirementsRevision: { type: integer }
        dependencies: { type: array, items: { type: string }, description: 'O efetivo congelado na solicitacao' }
        requestedAt: { type: string, format: date-time }
        cancelRequestedAt: { type: [string, 'null'], format: date-time }
        workspaceName: { type: string, description: 'Nome do ambiente da solicitacao (para as listas por organizacao)' }
        automationName: { type: string, description: 'Nome da automacao da solicitacao' }
        waitingForSlot: { type: boolean, description: 'PLATFORM-LICENCIAMENTO-001: a tentativa esta na fila e, neste instante, a organizacao (modelo por licenca) esta no limite tecnico de execucoes simultaneas: espera uma vaga. Capacidade, nao licenca.' }
        attempts:
          type: array
          items:
            type: object
            required: [attemptId, attemptNumber, agentId, agentName, workerId, workerName, state, refusalReason, communication, exitCode, createdAt, offerValidUntil, offeredAt, receivedAt, startedAt, endedAt, closureCause, lateReport, reconciliations, machineStillRunningAt, processes, processesAt]
            properties:
              attemptId: { type: string, format: uuid }
              attemptNumber: { type: integer }
              agentId: { type: string, format: uuid }
              agentName: { type: string }
              workerId: { type: string, format: uuid }
              workerName: { type: string }
              state: { $ref: '#/components/schemas/RemoteAttemptState' }
              refusalReason: { type: [string, 'null'], enum: [BUSY, PAUSED, PACKAGE_INVALID, ENVIRONMENT_GONE, ENVIRONMENT_INCOMPATIBLE, DEPENDENCIES_MISSING, DISK_PRESSURE, CLIENT_INCOMPATIBLE, SESSION_UNAVAILABLE, AUTHORIZATION_MISSING, AUTHORIZATION_REVOKED, AUTHORIZATION_EXPIRED, WORKER_NOT_AUTHORIZED, MACHINE_NOT_LINKED, MACHINE_NOT_ENABLED, MACHINE_INCOMPATIBLE, COMMUNICATION_LOST, LICENSE_REQUIRED, LICENSE_EXPIRED, null] }
              communication: { type: string, enum: [OK, LOST, NONE], description: 'LOST: o prazo da maquina venceu. Vencido ha mais que a espera configurada (padrao 120 min), a tentativa recebida e encerrada pelo servidor (closureCause COMMUNICATION_LOST)' }
              exitCode: { type: [integer, 'null'] }
              createdAt: { type: string, format: date-time }
              offerValidUntil: { type: string, format: date-time }
              offeredAt: { type: [string, 'null'], format: date-time }
              receivedAt: { type: [string, 'null'], format: date-time }
              startedAt: { type: [string, 'null'], format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
              closureCause:
                type: [string, 'null']
                enum: [MACHINE_UNLINKED, MACHINE_REVOKED, COMMUNICATION_LOST, null]
                description: >
                  Por que o SERVIDOR encerrou a tentativa (a maquina desvinculou-se, foi revogada, ou deixou de se comunicar
                  alem da espera). Nulo: o desfecho veio da maquina. O servidor so encerra como REFUSED (nunca autorizou o
                  inicio; refusalReason MACHINE_NOT_LINKED ou COMMUNICATION_LOST) ou ENDED_UNKNOWN (autorizada a iniciar ou
                  em execucao): nunca sucesso, falha nem cancelamento.
              lateReport:
                type: [object, 'null']
                description: >
                  O que a maquina informou DEPOIS de um encerramento por COMMUNICATION_LOST. Fica ao lado: o estado da
                  tentativa nao muda (uma nova tentativa pode ja ter sido pedida).
                required: [state, exitCode, reportedAt]
                properties:
                  state: { type: string, enum: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, ENDED_UNKNOWN] }
                  exitCode: { type: [integer, 'null'] }
                  reportedAt: { type: string, format: date-time }
              reconciliations:
                type: array
                description: >
                  058: como uma tentativa em ENDED_UNKNOWN foi reconciliada. Vazio: NAO reconciliada - a repeticao da solicitacao
                  esta bloqueada. MACHINE: a maquina confirmou que nao ha processo desta tentativa em execucao nela. MANUAL:
                  declaracao de um ORG_ADMIN (so ai ha reason, verification e byMembershipId). As duas podem existir: uma nao
                  altera a outra. O estado da tentativa continua ENDED_UNKNOWN.
                items:
                  type: object
                  additionalProperties: false
                  required: [kind, at, reason, verification, byMembershipId]
                  properties:
                    kind: { type: string, enum: [MACHINE, MANUAL] }
                    at: { type: string, format: date-time }
                    reason: { type: [string, 'null'], enum: [MACHINE_OFF_OUT_OF_OPERATION, PROCESS_ENDED_BY_ADMINISTRATOR, OTHER_VERIFIED, null] }
                    verification: { type: [string, 'null'] }
                    byMembershipId: { type: [string, 'null'], format: uuid }
              machineStillRunningAt:
                type: [string, 'null']
                format: date-time
                description: 'A maquina voltou e disse que AINDA executa esta tentativa (a primeira vez em que disse). Nulo depois que ela confirma o fim, e tambem quando ela disse depois que o processo principal terminou (ver processes)'
              processes:
                type: [string, 'null']
                enum: [ACTIVE, UNCERTAIN, null]
                description: '060: o que a maquina disse dos processos desta tentativa DEPOIS do fim do processo principal, enquanto ela nao confirma que acabaram. ACTIVE: ha processos da automacao ainda ativos ("finalizando"). UNCERTAIN: ela nao tem como saber (ocupacao incerta). Nulo: ela confirmou que nao ha mais processo (ver reconciliations, kind MACHINE), ou nao disse nada. Enquanto nao for nulo e nao houver reconciliacao, a maquina fica indisponivel e a repeticao bloqueada; o estado e o codigo de saida da tentativa nao mudam'
              processesAt:
                type: [string, 'null']
                format: date-time
    RemoteAttemptState:
      type: string
      enum: [QUEUED, OFFERED, RECEIVED, PREPARING, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, REFUSED, EXPIRED, ENDED_UNKNOWN]
    RuntimeRequirementsDeclaration:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, enum: [PACKAGE, FILE, TEXT, NONE_CONFIRMED] }
        text: { type: string, maxLength: 262144, description: 'So com FILE ou TEXT' }
        expectedRevision: { type: integer, minimum: 1, description: 'A revisao vista; ausente = nenhuma declaracao ainda' }
    RuntimeRequirementsAnalysis:
      type: object
      required: [lines, dependencies, resolved]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [number, text, kind, problem]
            properties:
              number: { type: integer, minimum: 1 }
              text: { type: string, description: 'A linha sem o comentario, saneada e limitada' }
              kind: { type: string, enum: [EXACT, DUPLICATE, CONFLICT, RANGE, NO_VERSION, MARKER, REMOTE, LOCAL_PATH, INCLUDE, OPTION, HASH, UNKNOWN] }
              problem: { type: boolean }
              dependency: { type: [string, 'null'], description: 'nome[extras]==versao, so em EXACT' }
        dependencies: { type: array, items: { type: string } }
        resolved: { type: boolean }
    RuntimeRequirements:
      type: object
      required: [automationId, declared, published, effective]
      properties:
        automationId: { type: string, format: uuid }
        declared:
          type: [object, 'null']
          required: [revision, source, dependencies, contentSha256, declaredAt]
          properties:
            revision: { type: integer, minimum: 1 }
            source: { type: string, enum: [PACKAGE, FILE, TEXT, NONE_CONFIRMED] }
            dependencies: { type: array, items: { type: string }, description: 'Os acrescimos declarados' }
            contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            declaredAt: { type: string, format: date-time }
        published:
          type: [object, 'null']
          required: [automationVersionId, versionNumber, dependencies]
          properties:
            automationVersionId: { type: string, format: uuid }
            versionNumber: { type: integer }
            dependencies: { type: array, items: { type: string }, description: 'As do manifesto do pacote publicado' }
        effective:
          type: object
          required: [dependencies, conflicts, resolved]
          properties:
            dependencies: { type: array, items: { type: string } }
            conflicts:
              type: array
              items:
                type: object
                required: [name, published, declared]
                properties:
                  name: { type: string }
                  published: { type: string }
                  declared: { type: string }
            resolved: { type: boolean }
    AgentPairingRequest:
      type: object
      additionalProperties: false
      required: [agentName]
      properties:
        workerId: { type: string, format: uuid, description: 'Worker existente (ou workerName, nunca os dois)' }
        workerName: { type: string, minLength: 1, maxLength: 80 }
        agentName: { type: string, minLength: 1, maxLength: 80, description: 'Nome logico da maquina, informado pela pessoa (nada e coletado da maquina)' }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 60, default: 15 }
        remoteExecution: { type: boolean, default: false, description: 'T01a da execucao remota: true = codigo marcado para habilitar a maquina (ver x-execucao-remota)' }
    AgentRotationRequest:
      type: object
