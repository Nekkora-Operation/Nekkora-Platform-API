        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/invitations/accept:
    post:
      tags: [Entrada geral (identidade)]
      operationId: acceptInvitation
      summary: 'Aceita convite pela identidade (step-up de ate 5 min); nenhuma vinculacao por igualdade de e-mail'
      description: >
        Contrato de 2026-10-27, secao 4.3. Sessao de identidade nao restrita COM step-up (/api/v1/auth/step-up) e CSRF
        dela. A organizacao vai no corpo e chega antes do token: o hash so e procurado dentro dela. Uma transacao que chama so
        identity_accept_invitation (023): identidade -> sessao -> organizacao (ATIVA) -> convite -> contas; hora medida depois
        dos locks; reconfere step-up, prazo, e-mail do convite = e-mail da identidade e a AUTORIDADE DO EMISSOR no instante do
        aceite. Sem conta na organizacao: cria conta interna ativa (e-mail verificado da identidade), vinculo, o papel do
        convite (atribuido pelo emissor) e a ligacao (link_channel convite). Conta ligada com vinculo retirado: readmissao.
        Destinataria sem identidade: conclui antes o cadastro (/api/v1/signup); o convite nao cadastra. Convite inexistente,
        vencido, revogado, ja aceito, de outro e-mail, de emissor sem autoridade ou organizacao nao ativa: 404 unico, sem efeito.
        409: already_member (ja membro ativo), account_exists (conta da organizacao com o e-mail, nao ligada a esta identidade:
        use /api/v1/links/*), account_unavailable (conta ligada suspensa ou vinculo inativo nao retirado). Depois, a troca
        (/api/v1/sessions/organization). Chaves nekkora.convites.enabled e nekkora.entrada-geral.enabled: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAcceptRequest' } } } }
      responses:
        '200': { description: 'Aceito', content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAccepted' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { description: 'Convite invalido para esta identidade (resposta unica), ou convites desligados', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
        '409': { description: 'already_member, account_exists ou account_unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: account_exists } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

