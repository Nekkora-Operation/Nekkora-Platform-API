        expiresAt: { type: string, format: date-time }
        workerId: { type: string, format: uuid }
        agentId: { type: [string, 'null'], format: uuid, description: 'So na rotacao' }
        remoteExecution: { type: boolean, enum: [true], description: 'Presente (true) so no codigo de pareamento marcado para execucao remota; ausente nos demais' }
    PythonEnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
