        workspaceId: { type: string, format: uuid }
        created: { type: boolean }
    LocalRunAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [workerId, validUntil]
      properties:
        workerId: { type: string, format: uuid }
        automationVersionId: { type: string, format: uuid, description: 'Obrigatorio sem sourceKind (pacote); proibido com EXTERNAL_MONITORED' }
        validUntil: { type: string, format: date-time, description: 'Com fuso; ate 366 dias' }
        sourceKind: { type: string, enum: [EXTERNAL_MONITORED], description: 'So para o monitoramento de Python externo (030)' }
        automationId: { type: string, format: uuid, description: 'Obrigatorio com EXTERNAL_MONITORED' }
    LocalRunAuthorization:
      type: object
      properties:
        authorizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        automationVersionId: { type: [string, 'null'], format: uuid, description: 'Nulo em EXTERNAL_MONITORED' }
        packageFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'Nulo em EXTERNAL_MONITORED' }
        grantedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        sourceKind: { $ref: '#/components/schemas/SourceKind' }
        packageFingerprintRule: { type: [string, 'null'], enum: ['nekkora-agent/package-fingerprint/1', 'nekkora-agent/external-python-fingerprint/1', null] }
    SourceKind:
      type: string
      enum: [STUDIO_PACKAGE, EXTERNAL_PACKAGE, EXTERNAL_MONITORED]
      description: >
        Origem explicita do codigo (030). STUDIO_PACKAGE: pacote do formato Studio, regra package-fingerprint/1 (inalterada).
        EXTERNAL_PACKAGE: pacote Python externo, regra external-python-fingerprint/1. EXTERNAL_MONITORED: Python do cliente
        disparado pelo agendador dele, sem versao e sem impressao.
    RunRequestCreate:
      type: object
      additionalProperties: false
      required: [authorizationId, agentId, requestKey]
      properties:
        authorizationId: { type: string, format: uuid, description: 'Autorizacao ATIVA de pacote (STUDIO_PACKAGE ou EXTERNAL_PACKAGE)' }
        agentId: { type: string, format: uuid, description: 'Agent ativo associado ao Worker da autorizacao' }
        validForSeconds: { type: integer, minimum: 60, maximum: 86400, default: 900 }
        requestKey: { type: string, format: uuid, description: 'Gerado pelo navegador: a repeticao com a mesma chave devolve o mesmo pedido (200)' }
    RunRequest:
      type: object
      description: >
        Pedido de execucao. state: REQUESTED (registrado, aguardando a maquina), DELIVERED (entregue, aguardando decisao; entregar
        nao prova inicio), ACCEPTED (aceito; inicio ainda nao confirmado), REFUSED, NOT_STARTED (aceito e o processo comprovadamente
        nao criado), RUN_LINKED (execucao registrada; iniciada so com run.startedAt; desfecho em run), EXPIRED (vencido sem decisao),
        REVOKED. Maquina desconectada: continua aguardando ate voltar ou vencer; nunca "em execucao" por inferencia.
      properties:
        runRequestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        automationName: { type: string }
        automationVersionId: { type: string, format: uuid }
        versionNumber: { type: integer }
        authorizationId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        sourceKind: { $ref: '#/components/schemas/SourceKind' }
        packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        packageFingerprintRule: { type: string }
        requestedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        state: { type: string, enum: [REQUESTED, DELIVERED, ACCEPTED, REFUSED, NOT_STARTED, RUN_LINKED, EXPIRED, REVOKED] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        deliveries: { type: integer }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'], enum: [PACKAGE_NOT_PRESENT, PACKAGE_NOT_APPROVED, AUTHORIZATION_UNUSABLE, ENVIRONMENT_INCOMPATIBLE, BUSY, EXPIRED, LAUNCH_NOT_ATTEMPTED, AGENT_UNLINKED, null], description: 'AGENT_UNLINKED (T13): recusado porque a maquina se desvinculou antes de decidir' }
        agentExecutionId: { type: [string, 'null'] }
        notStartedAt: { type: [string, 'null'], format: date-time }
        linkedAt: { type: [string, 'null'], format: date-time }
        expiredAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        machine:
          type: object
          properties:
            connectivity: { type: string, enum: [CONNECTED, DISCONNECTED] }
            lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        run:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                runId: { type: string, format: uuid }
                registeredAt: { type: string, format: date-time }
                state: { $ref: '#/components/schemas/AgentSupervisorState' }
                code: { type: [string, 'null'] }
                exitCode: { type: [integer, 'null'] }
                startedAt: { type: [string, 'null'], format: date-time, description: 'Relogio do Agent (RUNNING); sem ele o inicio nao esta provado' }
                endedAt: { type: [string, 'null'], format: date-time }
                process: { type: string, enum: [NOT_STARTED, STARTING, RUNNING, ENDED] }
                outcome: { type: string, enum: [PENDING, KNOWN, UNKNOWN] }
    RunRequestList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RunRequest' } }
    WorkspaceCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
    WorkspaceRenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    AutomationCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    VersionDraftRequest:
      type: object
      properties:
        runtime: { type: string, pattern: '^python3\.[0-9]{1,2}$', description: 'padrao python3.12' }
        arguments: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 200 } }
    PublishRequest:
      type: object
      required: [expectedArtifactSha256, expectedPackageFingerprint]
      properties:
        expectedArtifactSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expectedPackageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    PackageRejected:
      type: object
      required: [error, reason]
      properties:
        error: { type: string, enum: [package_rejected] }
        reason: { type: string, enum: [vazio, tamanho_excedido, zip_malformado, zip_nao_suportado, zip_cifrado, zip_ambiguo, zip_corrompido, ligacao_simbolica, caminho_inseguro, nome_repetido, arquivos_demais, manifesto_ausente, manifesto_grande, manifesto_malformado, manifesto_fora_do_contrato, modo_de_execucao_invalido, framework_invalido, linha_de_comando_invalida, segredos_nao_suportados, lista_de_arquivos_ausente, hash_declarado_invalido, entrada_ausente, arquivo_listado_ausente, hash_divergente] }
    LifecycleWorkspace:
      type: object
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
    LifecycleAutomation:
      type: object
      properties:
        automationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
    LifecycleArtifact:
      type: object
      properties:
        artifactId: { type: string, format: uuid }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 dos BYTES do ZIP recebido (calculado pelo servidor)' }
        sizeBytes: { type: integer }
        fingerprintRule: { type: string, enum: ['nekkora-agent/package-fingerprint/1', 'nekkora-agent/external-python-fingerprint/1'] }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'impressao do pacote (calculada pelo servidor; a mesma do Agent). Regra por tipo: STUDIO_PYTHON = package-fingerprint/1, EXTERNAL_PYTHON = external-python-fingerprint/1' }
        filesCount: { type: integer }
        manifestVersion: { type: string }
        framework: { type: [string, 'null'], description: 'So STUDIO_PYTHON' }
        executionMode: { type: [string, 'null'], enum: [single, list, tabular, null], description: 'So STUDIO_PYTHON' }
        packageKind: { type: string, enum: [STUDIO_PYTHON, EXTERNAL_PYTHON] }
        pythonRequirement: { type: [string, 'null'], description: 'So EXTERNAL_PYTHON (ex.: >=3.10,<3.14; ==3.12.0 no descritor 1.1). null num EXTERNAL_PYTHON de descritor 1.1: o autor nao declarou restricao de Python (nao e promessa de compatibilidade)' }
        dependencies: { type: [array, 'null'], items: { type: string }, description: 'So EXTERNAL_PYTHON: nome==versao exata' }
        packageName: { type: [string, 'null'] }
        packageVersion: { type: [string, 'null'] }
        declaredGenerator: { type: [string, 'null'] }
        provenance: { type: string, enum: [DECLARED], description: 'procedencia declarada no manifesto; nao verificada criptograficamente' }
        receivedAt: { type: string, format: date-time }
    LifecycleVersion:
      type: object
      properties:
        automationVersionId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        versionNumber: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        runtime: { type: [string, 'null'] }
        entrypoint: { type: [string, 'null'] }
        arguments: { type: array, items: { type: string } }
        artifactReference: { type: [string, 'null'], description: "'nekkora-artifact:<artifactId>' (artefato recebido) ou a referencia declarada de versoes anteriores" }
        artifact: { oneOf: [ { $ref: '#/components/schemas/LifecycleArtifact' }, { type: 'null' } ] }
        agentPackage: { oneOf: [ { type: object, properties: { fingerprintRule: { type: string }, fingerprint: { type: string } } }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        publishedByMembershipId: { type: [string, 'null'], format: uuid }
    LocalRunAuthorizationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LocalRunAuthorization' } }
    AgentSupervisorState: { type: string, enum: [READY, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, BLOCKED, OUTCOME_UNKNOWN] }
    AgentRun:
      type: object
      properties:
        runId: { type: string, format: uuid }
        correlation:
          type: object
          properties:
            agentExecutionId: { type: string, pattern: '^ex-[0-9a-f]{32}$' }
            frameworkExecutionId: { type: [string, 'null'] }
            platformExecutionId: { type: [string, 'null'], format: uuid, description: 'Nulo em execucao local' }
            agentId: { type: string, format: uuid }
            workerId: { type: string, format: uuid }
            workspaceId: { type: string, format: uuid }
            automationId: { type: string, format: uuid }
            automationVersionId: { type: [string, 'null'], format: uuid, description: 'Nulo em EXTERNAL_MONITORED' }
            authorizationId: { type: string, format: uuid }
            runRequestId: { type: [string, 'null'], format: uuid, description: 'Pedido de execucao (030) que originou a execucao' }
        origin: { type: string, enum: [LOCAL_AUTHORIZED, PLATFORM_REQUEST] }
        sourceKind: { $ref: '#/components/schemas/SourceKind' }
        automationName: { type: string }
        agentName: { type: string }
        authorizationStateAtRegistration: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        registeredAt: { type: string, format: date-time }
        supervisor:
          type: object
          properties:
            state: { $ref: '#/components/schemas/AgentSupervisorState' }
            code: { type: [string, 'null'], description: 'AGT-XXX-nnn' }
            exitCode: { type: [integer, 'null'] }
            counts: { type: object, additionalProperties: { type: integer } }
            agentCreatedAt: { type: [string, 'null'], format: date-time, description: 'Relogio do Agent, como informado' }
            agentStartedAt: { type: [string, 'null'], format: date-time }
            agentEndedAt: { type: [string, 'null'], format: date-time }
            adopted: { type: boolean }
            suspensions: { type: integer }
            locks: { type: integer }
            reports: { type: integer }
            conflicts: { type: integer, description: 'Relatorios contraditorios registrados (o estado nao mudou)' }
            lastReportAt: { type: string, format: date-time }
        process: { type: string, enum: [NOT_STARTED, STARTING, RUNNING, ENDED] }
        outcome: { type: string, enum: [PENDING, KNOWN, UNKNOWN] }
        transport:
          type: object
          properties:
            connectivity: { type: string, enum: [CONNECTED, DISCONNECTED] }
            lastHeartbeatAt: { type: [string, 'null'], format: date-time }
            lastEventAt: { type: [string, 'null'], format: date-time }
        history:
          type: object
          properties:
            completeness: { type: string, enum: [COMPLETE, PENDING, INCOMPLETE] }
            reasons: { type: array, items: { type: string, enum: [DELIVERY_PENDING, LOST_AT_SOURCE, LOST_LOCAL, PURGED_LOCAL, INVALID_REFUSED, DELIVERY_CONFLICT] } }
            eventsStored: { type: integer }
            storedThrough: { type: integer }
            settledThrough: { type: integer }
            maxSequence: { type: integer }
            declaredMissing: { type: integer }
            collectionCompletedSequence: { type: [integer, 'null'] }
            invalidRefused: { type: integer }
            stepsAvailable: { type: boolean, description: 'false: processo sem eventos do Framework (etapas indisponiveis; nada e inventado)' }
        transactionsSeen: { type: object, additionalProperties: { type: integer }, description: 'So no detalhe' }
        retention:
          type: object
          description: 'So no detalhe. Retencao no servidor (026): dimensao propria; nunca muda history.completeness, que e a da entrega. Expurgo nao e perda na origem'
          properties:
            state: { type: string, enum: [AVAILABLE, PARTIALLY_PURGED, PURGED] }
            eventsPurged: { type: integer }
    AgentRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
        nextCursor: { type: [string, 'null'] }
    AgentRunEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              source: { type: string, enum: [AGENT, FRAMEWORK, COLLECTOR] }
              eventCode: { type: string }
              severity: { type: string, enum: [INFO, WARNING, ERROR] }
              category: { type: string, enum: [LIFECYCLE, ACTIVITY, BUSINESS, FAILURE, TELEMETRY] }
              phase: { type: [string, 'null'] }
              stepId: { type: [string, 'null'] }
              studioStepId: { type: [string, 'null'], format: uuid }
              action: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
              errorCode: { type: [string, 'null'] }
              attempt: { type: [integer, 'null'] }
              elapsedMs: { type: [integer, 'null'] }
              transactionRef: { type: [string, 'null'] }
              counts: { type: [object, 'null'], additionalProperties: { type: integer } }
              timestampUtc: { type: [string, 'null'], format: date-time, description: 'Instante informado pela origem' }
              observedUtc: { type: string, format: date-time, description: 'Instante em que o Agent leu o evento' }
              receivedAt: { type: string, format: date-time }
              purged: { type: boolean, description: 'Expurgado pela retencao do servidor: ficam a classificacao e os instantes; o conteudo da etapa vem nulo' }
        nextCursor: { type: [string, 'null'] }
