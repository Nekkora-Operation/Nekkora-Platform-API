              agentId: { type: [string, 'null'], format: uuid }
              workspaceIds: { type: array, items: { type: string, format: uuid } }
              agentName: { type: [string, 'null'], description: 'T07: maquina vinculada (null = sem Agent)' }
              agentStatus: { type: [string, 'null'], enum: [PENDING, ACTIVE, SUSPENDED, REVOKED, null] }
              agentVersion: { type: [string, 'null'] }
              installationId: { type: [string, 'null'], format: uuid }
              lastHeartbeatAt: { type: [string, 'null'], format: date-time, description: 'T07: ultimo sinal conhecido da maquina vinculada' }
              connectivity: { type: [string, 'null'], enum: [CONNECTED, DISCONNECTED, null], description: 'T07: null = sem Agent. T11: CONNECTED so com o Agent ACTIVE e contato autenticado nos ultimos 180 s (heartbeat a cada 60 s); ver listAgents' }
              credentialExpiresAt: { type: [string, 'null'], format: date-time }
              createdAt: { type: string, format: date-time }
    WorkerCreateRequest:
      type: object
