        receber execucoes solicitadas pela Platform. Mesmas permissoes e mesmo step-up do pareamento comum; quem cria o codigo
        fica gravado como quem habilitou. O codigo sozinho nao habilita nada: a maquina so fica habilitada quando a pessoa
