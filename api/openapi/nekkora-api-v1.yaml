  /api/v1/o/{org}/automations/{automation}/remote-machines/{agent}/python-selection:
    put:
      tags: [Execucao remota]
      operationId: selectRemoteMachinePython
      summary: 'Escolhe o ambiente Python de uma automacao numa maquina habilitada'
      description: >
        Exige automation.manage no ambiente da automacao. agent: maquina habilitada cujo Worker esta autorizado nesse ambiente
        (outra: 404). environmentId: um ambiente do inventario ATUAL da maquina (fora dele: 409 conflict, reason
        remote_python_not_in_inventory). Trocar substitui a escolha; a de uma maquina nao vale para outra. A Platform guarda so o
        identificador opaco: nunca um caminho. Nao verifica dependencias nem instala nada - a maquina confere o ambiente antes de
        iniciar. Sem a escolha, a solicitacao de execucao remota nessa maquina e recusada (reason remote_python_not_selected).
        Recurso desligado: 409 conflict, reason remote_execution_unavailable.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: agent, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environmentId]
              properties:
                environmentId: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200': { description: 'Escolha gravada', content: { application/json: { schema: { $ref: '#/components/schemas/RemotePythonChoice' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/o/{org}/automations/{automation}/remote-machines/{agent}/dependency-check:
    post:
      tags: [Execucao remota]
      operationId: checkRemoteMachineDependencies
      summary: 'Pede a maquina que confira agora as dependencias da automacao no Python escolhido para ela'
      description: >
        Exige automation.execute no ambiente da automacao. agent: maquina habilitada cujo Worker esta autorizado nesse ambiente
        (outra: 404). Congela o que sera conferido: o ambiente Python escolhido agora para a automacao nessa maquina e a lista
        efetiva vigente das dependencias. A maquina confere SO isso, naquele ambiente, e responde uma vez; a resposta aparece em
        dependencyCheck, na lista de candidates. Sem resposta em 2 minutos, o pedido fica UNANSWERED: nao foi possivel verificar
        (a maquina pode estar ocupada ou sem contato) - nunca incompativel. Limite: um pedido por minuto por maquina e automacao;
        o segundo recebe 429 + rate_limited, reason remote_dependency_check_too_soon, e nada e criado. Sem Python escolhido: 409 +
        remote_python_not_selected; escolhido fora do inventario atual: 409 + remote_python_not_in_inventory; dependencias nao
        declaradas ou em conflito: 409 + remote_requirements_not_declared / remote_requirements_conflict. Recurso desligado: 409 +
        remote_execution_unavailable. E informacao: nao instala nada, nao muda a escolha, e a conferencia que vale para executar
        continua sendo a da maquina, antes de iniciar.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: agent, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      responses:
        '201': { description: 'Pedido criado, aguardando a maquina', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteDependencyCheck' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/o/{org}/workspaces/{workspace}/remote-executions/candidates:
    get:
      tags: [Execucao remota]
      operationId: listRemoteExecutionCandidates
      summary: 'Maquinas habilitadas do ambiente para uma versao, com o que falta em cada uma'
      description: >
        Exige automation.read no ambiente. automationVersion: uma versao PUBLICADA do ambiente (outra: 404). Para cada maquina
        habilitada cujo Worker esta autorizado no ambiente: requestable e missing, a lista do que impede solicitar nela agora -
        PACKAGE_NOT_SUPPORTED (o pacote da versao nao e um pacote Python externo; a execucao remota so aceita esse tipo e o
        formato Studio fica de fora - vale para todas as maquinas e nao ha acao que resolva), PACKAGE_NOT_REGISTERED (a Platform nao tem o
        pacote desta versao registrado, entao nao ha o que entregar a maquina - vale para todas as maquinas; resolve-se publicando
        uma versao com o pacote), REQUIREMENTS_NOT_DECLARED, REQUIREMENTS_CONFLICT (da automacao), AUTHORIZATION_MISSING, AUTHORIZATION_REVOKED,
        AUTHORIZATION_EXPIRED (a autorizacao de execucao desta versao para o Worker da maquina), MACHINE_PAUSED,
        MACHINE_INCOMPATIBLE, MACHINE_BUSY, MACHINE_UNCONFIRMED (ha tentativa desta maquina com resultado nao confirmado cujo processo ELA ainda
        nao confirmou ausente: a ocupacao e incerta. Um novo contato, o fim do vinculo ou a declaracao manual NAO mudam isso; so a confirmacao da propria
        maquina. Se ela disse que ainda executa, o motivo e MACHINE_BUSY), MACHINE_FINISHING (060: o processo principal da ultima tentativa
        desta maquina terminou, mas ha processos da automacao ainda ativos nela - "finalizando"; libera quando a propria maquina confirmar que
        acabaram; se ela deixar de saber, o motivo passa a MACHINE_UNCONFIRMED), MACHINE_OCCUPIED (a propria maquina informou, na presenca,
        que esta ocupada, sem dizer com o que - por exemplo uma execucao iniciada nela pela pessoa; a Platform nao recebe nada dessa execucao,
        so o sim/nao. E o ultimo sinal recebido: pode estar atrasado, e quem decide na hora e a maquina, que recusa a tentativa com BUSY),
        MACHINE_DISK_PRESSURE (a maquina informou pouco espaco livre: recusa trabalho novo com DISK_PRESSURE ate haver espaco), PYTHON_NOT_SELECTED (ninguem escolheu o ambiente Python desta automacao nesta maquina),
        PYTHON_NOT_IN_INVENTORY (o escolhido nao esta mais no inventario dela). authorization: a autorizacao vigente da versao para
        o Worker, ou a mais recente que deixou de valer (null = nunca houve). python: o ambiente escolhido para a automacao nesta
        maquina (null = nenhum). E indicativo: a solicitacao reconfere tudo, de forma atomica.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: workspace, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: automationVersion, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Maquinas e o que falta', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecutionCandidateList' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/workspaces/{workspace}/remote-executions:
    post:
      tags: [Execucao remota]
      operationId: requestRemoteExecution
      summary: 'Solicita a execucao de uma versao publicada numa maquina habilitada (step-up)'
      description: >
        Exige automation.execute no ambiente e step-up recente. Para ACEITAR, exige ainda: o pacote da versao e um pacote
        Python externo (o formato Studio nao e executado remotamente: 409 + remote_package_not_supported, conferido antes de
        todas as outras exigencias e antes de gravar; o mesmo vale ao repetir em outra maquina); o pacote da versao esta registrado
        na Platform (senao 409 + remote_package_not_registered, tambem antes de gravar e tambem ao repetir: o banco fixa na
        tentativa o pacote que a maquina podera baixar e nao cria tentativa sem ele); Worker da maquina autorizado no
        ambiente; maquina habilitada, nao pausada, compativel e livre; autorizacao de execucao VIGENTE desta versao para o Worker
        da maquina; dependencias da automacao declaradas e sem conflito com o pacote. Cada exigencia que falta responde 409
        conflict com o seu reason (remote_authorization_missing, remote_authorization_revoked, remote_authorization_expired,
        remote_machine_not_enabled, remote_machine_paused, remote_machine_incompatible, remote_machine_busy, remote_machine_unconfirmed, remote_machine_finishing,
        remote_requirements_not_declared, remote_requirements_conflict) e nada e gravado. Nenhuma autorizacao e criada por
        aqui, EXCETO com authorizeVersion: true (S2, aceite explicito da versao naquela maquina, no mesmo passo e na mesma
        confirmacao reforcada). PLATFORM-LICENCIAMENTO-001 (064): na organizacao do modelo por licenca, a automacao precisa de
        licenca vigente - senao 409 + license_required (sem licenca vinculada) ou license_expired (licenca fora de periodo),
        conferido antes das demais exigencias; a conferencia se repete em cada tentativa nova, na oferta e imediatamente antes
        de iniciar (a tentativa que ainda nao comecou e recusada com LICENSE_REQUIRED ou LICENSE_EXPIRED). Nesse modelo o
        prazo da autorizacao nao recusa (remote_authorization_expired so existe no modelo anterior); a revogacao continua
        valendo. O que ja comecou termina e entrega registros e resultados. A solicitacao fixa a versao, a impressao do pacote e a revisao das dependencias. requestKey: UUID gerado pelo
        navegador; repetir com a mesma chave e o mesmo conteudo devolve 200 com a mesma solicitacao (resposta perdida); com outro
        conteudo, 409. Recurso desligado: 409 + remote_execution_unavailable. Solicitar nao prova inicio: a maquina puxa, e o
        servidor revalida as mesmas condicoes antes de entregar e antes de iniciar.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: workspace, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecutionRequest' } } } }
      responses:
        '201': { description: 'Solicitacao criada, com a primeira tentativa na fila', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '200': { description: 'A mesma solicitacao (repeticao com a mesma chave)', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Execucao remota]
      operationId: listRemoteExecutions
      summary: 'Solicitacoes mais recentes do ambiente'
      description: >
        Exige automation.read no ambiente. limit de 1 a 100 (padrao 25). Cada item traz as tentativas, com o estado, o motivo de
        uma recusa e a comunicacao (OK, LOST ou NONE). LOST nao muda o estado nem encerra a tentativa.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: workspace, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 'Solicitacoes', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RemoteExecution' } } } } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions:
    get:
      tags: [Execucao remota]
      operationId: listVisibleRemoteExecutions
      summary: 'Solicitacoes de execucao remota dos ambientes visiveis (telas Execucoes e Supervisao)'
      description: >
        As solicitacoes mais recentes dos ambientes em que a pessoa tem automation.read, da mais recente para a mais antiga. E a
        mesma solicitacao das outras leituras (nada e copiado para alimentar a lista): cada item traz as suas tentativas, com
        maquina, Worker, horarios, estado e codigo de saida. Registros e arquivos continuam nas rotas da tentativa (logs.read).
        Filtros opcionais: workspaceId (sem acesso a ele: lista vazia), automationId e o periodo da SOLICITACAO (from
        inclusivo, to exclusivo, com fuso; invertido: 400). Sem cursor: limit de 1 a 100 (padrao 25).
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: workspaceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: automationId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 'Solicitacoes', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RemoteExecution' } } } } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/o/{org}/remote-executions/{execution}:
    get:
      tags: [Execucao remota]
      operationId: getRemoteExecution
      summary: 'Uma solicitacao e as tentativas dela'
      description: 'Exige automation.read no ambiente da solicitacao (fora do alcance: 404).'
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      responses:
        '200': { description: 'Solicitacao', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions/{execution}/attempts/{attempt}/logs:
    get:
      tags: [Execucao remota]
      operationId: listRemoteAttemptLogs
      summary: 'As linhas da saida do processo de uma tentativa e o fechamento do envio'
      description: >
        Exige logs.read no ambiente da solicitacao (fora do alcance: 404). Sao as linhas que o processo da automacao escreveu na
        saida padrao (STDOUT) e na saida de erro (STDERR), e avisos do aplicativo da maquina (EXECUTOR), na ordem em que a maquina
        as capturou - que nao e uma ordem global entre os dois canais. STDERR e um canal, nao um nivel: level e sempre UNKNOWN
        nesta versao e nada e classificado pelo texto. Paginacao pela sequencia: after (exclusivo, padrao 0) e limit (1 a 500,
        padrao 500); nextAfter null = esta pagina chegou ao fim do que ha agora. total: quantas linhas a Platform tem. closure
        null: a maquina ainda nao fechou o envio (a execucao pode estar em andamento, ou ha linha a caminho, ou ela nao voltou).
        closure.droppedLines: quantas linhas a maquina descartou por limite (8 KiB por linha - a linha cortada vem com truncated;
        50.000 linhas e 20 MiB por tentativa). Linha que falta, cortada ou descartada NAO muda o estado da tentativa.
        textRemoved true: o texto foi apagado pela retencao; o registro de que a linha existiu fica. So existem linhas de
        tentativa remota: a saida de uma execucao iniciada no proprio computador nunca chega a Platform.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: 'Registros da tentativa', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptLogs' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions/{execution}/attempts/{attempt}/results:
    get:
      tags: [Execucao remota]
      operationId: listRemoteAttemptResults
      summary: 'Os arquivos de resultado de uma tentativa e o fechamento do envio'
      description: >
        Exige logs.read no ambiente da solicitacao (fora do alcance: 404). Resultado e o que a automacao gravou na pasta de saida
        e a maquina enviou depois do termino: no maximo 50 arquivos, 20 MiB cada, 50 MiB no total por tentativa. closure null: a
        maquina ainda nao fechou o envio (pode haver arquivo a caminho, ou ela nao voltou). closure.skippedByLimit: quantos
        arquivos ela deixou de enviar por limite. Arquivo que falta ou excede o limite NAO muda o estado da tentativa.
        available false: os bytes foram removidos pela retencao; o metadado fica.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      responses:
        '200': { description: 'Resultados da tentativa', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAttemptResults' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions/{execution}/attempts/{attempt}/results/{number}/content:
    get:
      tags: [Execucao remota]
      operationId: downloadRemoteAttemptResult
      summary: 'Baixa um arquivo de resultado'
      description: >
        Exige logs.read no ambiente da solicitacao. Os bytes sao relidos e conferidos pelo SHA-256; a resposta e sempre um anexo
        (application/octet-stream, nosniff), nunca interpretada pelo navegador. O download fica na trilha da automacao. Bytes
        removidos pela retencao, ausentes ou que nao conferem: 409 conflict, reason remote_result_unavailable.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: 'Bytes do arquivo'
          headers:
            Nekkora-Result-Sha256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'SHA-256 dos bytes' }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions/{execution}/cancel:
    post:
      tags: [Execucao remota]
      operationId: cancelRemoteExecution
      summary: 'Pede o cancelamento da tentativa atual (step-up)'
      description: >
        Exige automation.execute no ambiente e step-up. A tentativa que a maquina ainda NAO recebeu (QUEUED, OFFERED) e
        cancelada na hora. A que ja foi recebida so para quando a maquina obedecer e informar: o pedido fica gravado
        (cancelRequestedAt) e o estado so muda com a palavra da maquina. Tentativa ja terminada: 409 +
        remote_attempt_already_finished. Repetir o pedido e idempotente.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      responses:
        '200': { description: 'Solicitacao com o pedido de cancelamento', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/remote-executions/{execution}/attempts/{attempt}/reconciliation:
    post:
      tags: [Execucao remota]
      operationId: reconcileRemoteAttempt
      summary: 'Reconciliacao declarada por um ORG_ADMIN (step-up)'
      description: >
        Para quando NAO e possivel obter a confirmacao da maquina. Exige o papel ORG_ADMIN na propria organizacao (conferido no
        servidor e no banco; outro papel: 403) e step-up. So para tentativa em ENDED_UNKNOWN ainda sem declaracao manual (outra:
        409 + remote_attempt_not_unconfirmed ou remote_attempt_already_reconciled). reason: de uma lista fechada. verification: o
        que a pessoa verificou, de 20 a 2000 caracteres. acknowledgePartialEffects tem de ser true: a pessoa afirma saber que a
        execucao anterior pode ter causado efeitos parciais (sem isso, 400). Fica registrado quem, quando, o motivo, a
        verificacao, a tentativa e a maquina. NAO executa nada e NAO muda o resultado da tentativa, que continua ENDED_UNKNOWN:
        libera uma nova tentativa da solicitacao, sujeita as mesmas autorizacoes. NAO libera a maquina antiga, que continua
        indisponivel ate ELA confirmar; o que ela informar depois fica ao lado, sem alterar esta declaracao.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: attempt, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, verification, acknowledgePartialEffects]
              properties:
                reason: { type: string, enum: [MACHINE_OFF_OUT_OF_OPERATION, PROCESS_ENDED_BY_ADMINISTRATOR, OTHER_VERIFIED] }
                verification: { type: string, minLength: 20, maxLength: 2000 }
                acknowledgePartialEffects: { type: boolean }
      responses:
        '201': { description: 'Solicitacao, com a reconciliacao na tentativa', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/o/{org}/remote-executions/{execution}/attempts:
    post:
      tags: [Execucao remota]
      operationId: retryRemoteExecution
      summary: 'Executa novamente em outra maquina (step-up)'
      description: >
        Exige automation.execute no ambiente e step-up. Cria uma tentativa nova da MESMA solicitacao (mesma versao, mesmo pacote,
        mesmo retrato de dependencias) na maquina indicada. So depois que a tentativa anterior TERMINOU: enquanto ela nao
        terminar, 409 + remote_attempt_not_finished - nao ha troca automatica de maquina nem duas maquinas com a mesma
        solicitacao. As exigencias sao as da solicitacao, conferidas para a maquina de DESTINO; em especial, a autorizacao
        vigente da versao tem de ser do Worker de destino: a da maquina anterior NAO e transferida (sem ela, 409 +
        remote_authorization_missing). Cancelamento ja pedido: 409 + remote_execution_cancel_requested. Quando a tentativa anterior
        terminou como ENDED_UNKNOWN (qualquer que seja a causa: comunicacao perdida, revogacao, reinicio do aplicativo), a repeticao
        fica BLOQUEADA ate a tentativa ser reconciliada - pela maquina, ou por declaracao de um ORG_ADMIN (ver .../reconciliation):
        409 + remote_previous_result_unconfirmed e nada e gravado. Reconhecer o risco, revogar a maquina ou esperar nao liberam.
        A maquina de destino com ocupacao incerta responde 409 + remote_machine_unconfirmed; a que ainda executa, remote_machine_busy.
        060: o mesmo bloqueio vale quando a tentativa anterior terminou (concluida, falhou, cancelada, tempo esgotado) mas a maquina
        disse que ha processos da automacao ainda ativos, ou que nao sabe: 409 + remote_previous_processes_pending, ate a maquina
        confirmar que acabaram ou um ORG_ADMIN declarar. A maquina que esta finalizando responde 409 + remote_machine_finishing.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: execution, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [agentId], properties: { agentId: { type: string, format: uuid }, authorizeVersion: { type: boolean, description: 'PLATFORM-LICENCIAMENTO-001 (S2): true e o ACEITE EXPLICITO desta versao nesta maquina, no mesmo passo. Cria a autorizacao da versao para o Worker da maquina se nao houver uma que sirva; mesmo ato, mesmas recusas e mesma trilha da rota de autorizacao. Nunca vale para versoes futuras. Ausente ou false: nada e autorizado.' }, authorizationValidUntil: { type: string, format: date-time, description: 'So com authorizeVersion. Obrigatorio na organizacao do modelo anterior; no modelo por licenca e opcional e limitado ao fim da cobertura da licenca.' } } } } } }
      responses:
        '201': { description: 'Solicitacao com a tentativa nova', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteExecution' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/automations/{automation}/runtime-requirements:
    get:
      tags: [Dependencias de execucao]
      operationId: getRuntimeRequirements
      summary: 'Dependencias declaradas, as do pacote publicado e o efetivo'
      description: >
        Exige automation.read no ambiente da automacao. declared: a revisao vigente da declaracao (null = ninguem declarou).
        published: as dependencias do manifesto da versao publicada mais recente (null = sem versao publicada). effective: o
        manifesto mais os acrescimos declarados; a mesma biblioteca declarada com versao ou extras diferentes dos do manifesto
        aparece em conflicts e deixa resolved em false - o manifesto prevalece e nunca e enfraquecido.
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      responses:
        '200': { description: 'Situacao das dependencias', content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeRequirements' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Dependencias de execucao]
      operationId: declareRuntimeRequirements
      summary: 'Declara as dependencias de execucao (cria a revisao seguinte)'
      description: >
        Exige automation.manage no ambiente da automacao. source PACKAGE (so as do pacote) ou NONE_CONFIRMED (sem dependencias
        externas, confirmado): sem text. source FILE (conteudo de um requirements.txt) ou TEXT (digitado): text obrigatorio, lido
        estaticamente com as regras do aplicativo; so nome==versao (com extras) entra. Qualquer linha que nao se representa
        (faixa, sem versao, marcador, endereco, caminho, inclusao, opcao, hash, conflito) recusa a declaracao inteira: 409 conflict
        + reason runtime_requirements_unresolved, nada gravado (use a rota analysis para ver o problema de cada linha). Nenhuma
        versao e inventada e nada e instalado. expectedRevision: a revisao vista pela pessoa (ausente = nenhuma); se mudou, 409 +
        runtime_requirements_changed. O pacote publicado nao muda; declarar nao verifica maquina nem autoriza execucao.
        Auditoria (automation_admin_events 10).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeRequirementsDeclaration' } } } }
      responses:
        '201': { description: 'Revisao criada', content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeRequirements' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/automations/{automation}/runtime-requirements/analysis:
    post:
      tags: [Dependencias de execucao]
      operationId: analyzeRuntimeRequirements
      summary: 'Le um texto de dependencias e diz, por linha, o que e (nada e gravado)'
      description: >
        Exige automation.manage no ambiente da automacao. Leitura estatica de um texto no formato do requirements.txt (ate 262144
        caracteres): cada linha com conteudo recebe uma situacao; problem true impede declarar. resolved: nenhuma linha com
        problema. Nada e gravado, instalado ou buscado na rede; inclusoes e enderecos nao sao seguidos.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: automation, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [text], properties: { text: { type: string, maxLength: 262144 } } } } } }
      responses:
        '200': { description: 'Situacao de cada linha', content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeRequirementsAnalysis' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/automation-versions/{version}/publish:
    post:
      tags: [Ciclo de vida das automacoes]
      operationId: publishAutomationVersion
      summary: 'Publica a versao DRAFT (step-up; irreversivel)'
      description: >
        Exige automation.publish no workspace e step-up recente na mesma sessao. A pessoa confirma o que conferiu (expectedArtifactSha256 e expectedPackageFingerprint): diferente do rascunho atual, 409. Os bytes guardados sao relidos e conferidos (hash e impressao) antes da transacao; ausentes ou corrompidos, 409. Na mesma transacao: DRAFT -> PUBLISHED com autoria e instante do servidor, e o gatilho da 028 reconfere o vinculo com o artefato e a autoridade de quem publica. Repeticao com a mesma expectativa (resposta perdida): 200 com a versao ja publicada; outra expectativa: 409. Concorrentes: uma publica, as demais veem a mesma publicacao. Publicar NAO autoriza nem dispara execucao (a autorizacao de execucao local e outro ato). Auditado (ato 6).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: version, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishRequest' } } } }
      responses:
        '200': { description: 'Versao publicada', content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleVersion' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_session
      description: Sessao emitida pelo fluxo de login com MFA (contrato 8.7; HttpOnly, Secure, SameSite=Lax, prazo absoluto). Rotas GET - sem X-CSRF-Token. {org} malformado -> 401.
    preAuthCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_pre
      description: Contexto CSRF de PRE-AUTENTICACAO (GET /api/v1/csrf; estado no Redis; SameSite=Strict). Usado com X-CSRF-Token e Origin igual a origem publica.
    challengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_mfa
      description: Desafio de MFA aberto pelo login (SameSite=Strict). Usado com o X-CSRF-Token do desafio e Origin igual a origem publica.
    identityChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_id_mfa
      description: Desafio de identidade aberto pela entrada geral (SameSite=Strict; 5 min). Usado com o X-CSRF-Token do desafio e Origin igual a origem publica.
    identitySessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_id
      description: Sessao de identidade (entrada geral; SameSite=Lax; prazo absoluto de 12 h). Nas rotas sem organizacao, autentica /api/v1/me/organizations, /api/v1/sessions/organization, /api/v1/auth/step-up, /api/v1/organizations e /api/v1/links/* (e o logout de identidade). Excecao unica (P4) - em /api/v1/o/{org}/auth/mfa/step-up, quando a sessao de organizacao e vinculada, e exigida EM ADICAO ao cookie e ao CSRF da sessao de organizacao e tem de ser a sessao de identidade de origem dela.
    linkChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_link
      description: Desafio de vinculacao emitido pela etapa 1 (/api/v1/links/start); SameSite=Strict; 5 min; uso unico, amarrado a identidade e a conta. Expira na resposta da etapa 2.
    desktopRequestCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_desk
      description: Pedido de autorizacao do aplicativo desktop guardado no servidor (5 min; HttpOnly, Secure, SameSite=Strict). So identifica o pedido; nao autentica ninguem.
    desktopBearer:
      type: http
      scheme: bearer
      description: 'Token opaco da sessao do aplicativo desktop (15 min, sem renovacao), com o escopo que a pessoa aprovou: "identity" (so /api/v1/desktop/session e /api/v1/desktop/session/revoke) "identity navigation" (tambem /api/v1/desktop/me e /api/v1/desktop/organizations...) ou "identity navigation packages" (tambem o download do pacote de versao publicada). Sessao emitida com um escopo nao ganha outro. So vale em /api/v1/desktop/; nao autentica nenhuma outra rota, nem o canal das maquinas.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF do contexto da rota (pre-autenticacao, desafio ou sessao). Toda escrita exige tambem Origin igual a origem publica.
  parameters:
    Org: { name: org, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 401 (nenhuma sessao e resolvida)' }
    DesktopOrg: { name: org, in: path, required: true, schema: { type: string, format: uuid }, description: 'Uma das organizacoes de GET /api/v1/desktop/organizations. Malformado -> 400; organizacao em que a pessoa nao tem acesso AGORA (conferido a cada requisicao) -> 404' }
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    AutomationId: { name: automationId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    ExecutionId: { name: executionId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' }
      description: >
        Opaco e assinado: base64url(payload) "." base64url(HMAC-SHA256). Vinculado a rota, organizacao, vinculo da sessao,
        recurso pai, filtros (impressao canonica; limit fora) e ordenacao. Posicao = chave de ordenacao de tamanho limitado
        (prefixo de 48 pontos de codigo + id, ou campos de tamanho fixo); id da chave como impressao de 11 caracteres.
        O servidor nunca emite cursor maior que 872 caracteres (pior caso calculado, documento secao 1.5.1); aceita ate
        1024. Nao e autoridade: autorizacao reaplicada a cada pagina. Malformado, adulterado, de outra
        rota/organizacao/vinculo/pai, com filtros ou ordenacao diferentes, ou de chave desconhecida (inclusive apos
        rotacao da chave) -> 400. Sem expiracao por tempo. Chave: decisao DC-15 (subchave derivada; a rotacao invalida os cursores).
      x-decisoes: [DC-15]
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 }, description: 'fora de 1-100 ou nao inteiro -> 400; pode mudar entre paginas' }
  responses:
    NoContent: { description: Sucesso sem corpo }
    ListLimitExceeded: { description: 'Lista acima do limite do portal, sem truncar (log evento=portal.list_limit_exceeded)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: internal_error } } } }
    Accepted: { description: Pedido aceito (sem enumeracao de contas) }
    SignupDisabled: { description: 'Rota de identidade desligada pela sua chave (cadastro: nekkora.cadastro.enabled; login, MFA, organizacoes da identidade e troca: nekkora.entrada-geral.enabled; criacao de organizacao: nekkora.criacao-organizacao.enabled; vinculacao: nekkora.vinculacao.enabled; convites: nekkora.convites.enabled - estas tres so abrem com a entrada geral ligada; todas desligadas por padrao): a rota nao existe', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
    RestrictedIdentitySession: { description: 'Sessao de identidade restrita a recuperacao (DC-17.13): so cadastrar e confirmar o fator novo, e logout', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    CsrfForbidden: { description: 'Origin diferente da origem publica ou X-CSRF-Token do contexto ausente/invalido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    ServiceUnavailable:
      description: 'Dependencia indisponivel (ex.: Redis do limitador ou do estado CSRF de pre-autenticacao)'
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: service_unavailable } } }
    InvalidRequest: { description: 'Parametro invalido: UUID malformado, limit, status, data, periodo ou cursor', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid_request } } } }
    Unauthenticated: { description: 'Sem sessao valida na organizacao da rota', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unauthenticated } } } }
    Forbidden: { description: 'Conta externa, sem a permissao exigida, ou Origin/CSRF invalido (forbidden). Nas acoes sensiveis da sessao de organizacao, com tudo o mais conferido e sem confirmacao de identidade valida na janela: forbidden com reason step_up_required (T01; confirme e repita o ato)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    NotFound: { description: 'Inexistente, de outra organizacao ou sem acesso ao workspace (resposta identica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
    CatalogInconsistent: { description: 'Codigo de papel, permissao ou rotulo de status desconhecido, ou permissao organizacional em papel de workspace (nunca omitido silenciosamente)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: internal_error } } } }
    WorkspaceNameTaken: { description: 'Ja existe um workspace com esse nome nesta organizacao (031; maiusculas/minusculas e espacos nas extremidades nao distinguem). Codigo conflict (o cliente que nao conhece o motivo ve a recusa comum) com reason workspace_name_taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict, reason: workspace_name_taken } } } }
    LocalRunAuthorizationConflict: { description: 'O ato nao cabe no estado atual. Com reason local_run_authorization_exists (T12, 033): o escopo ja tem uma autorizacao vigente, nada foi gravado. Sem reason: as recusas da 025/030 (versao nao publicada ou sem impressao, Worker sem autorizacao no workspace, automacao ou workspace inativo). O cliente que nao conhece o motivo ve a recusa comum', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict, reason: local_run_authorization_exists } } } }
    DesktopScopeForbidden: { description: 'Rotas de navegacao do aplicativo: a sessao do desktop nao tem o escopo exigido ("identity navigation"; no download do pacote, "identity navigation packages"); entre de novo pedindo o escopo. Na renomeacao tambem: automacao visivel sem automation.manage no workspace. No download tambem: automacao visivel sem automation.execute nem automation.manage', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    Conflict: { description: 'O estado atual impede o ato (convite pendente, destinataria ja cadastrada, concessao duplicada ou fora do estado, papel ja ativo, vinculo inativo)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict } } } }
    RateLimited:
      description: Limite R7
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: rate_limited } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string, enum: [invalid_request, unauthenticated, forbidden, not_found, conflict, already_member, account_exists, account_unavailable, rate_limited, internal_error, service_unavailable, unsupported_contract] }, reason: { type: string, enum: [workspace_name_taken, step_up_required, worker_limit_reached, license_already_assigned, automation_already_licensed, license_not_valid, license_automation_archived, license_ended, license_period_overlaps, license_period_already_ended, license_model_unchanged, license_preview_changed, license_required, license_expired, run_not_covered, capacity_pending_limit_reached, license_not_assigned, license_transfer_same_automation, license_transfer_work_in_progress, organization_responsible_not_found, organization_responsible_is_client, previous_agent_session_has_outcome, previous_agent_session_already_reconciled, license_transfer_requester_not_admin, remote_execution_unavailable, runtime_requirements_unresolved, runtime_requirements_changed, remote_authorization_missing, remote_authorization_revoked, remote_authorization_expired, remote_machine_not_enabled, remote_machine_paused, remote_machine_incompatible, remote_machine_busy, remote_machine_unconfirmed, remote_machine_finishing, remote_previous_processes_pending, remote_previous_result_unconfirmed, remote_attempt_not_unconfirmed, remote_attempt_already_reconciled, remote_requirements_not_declared, remote_requirements_conflict, remote_package_not_supported, remote_package_not_registered, remote_python_not_selected, remote_python_not_in_inventory, remote_dependency_check_too_soon, remote_dependency_check_closed, remote_result_unavailable, remote_attempt_not_finished, remote_attempt_already_finished, remote_execution_cancel_requested, draft_exists, draft_changed, local_run_authorization_exists, organization_name_taken, organization_creation_client_profile, organization_creation_requires_request, empty_organization_limit_reached, organization_request_not_available, organization_request_not_pending, organization_request_own, organization_request_approver_without_identity, organization_request_responsible_not_eligible, organization_not_responsible, organization_work_in_progress, organization_blocked_by_nekkora, organization_state_conflict], description: 'PLATFORM-V2-001: motivo opcional de um codigo conhecido (conflict: workspace_name_taken, worker_limit_reached, draft_exists, draft_changed, local_run_authorization_exists, organization_name_taken; forbidden: step_up_required). Cliente que nao o conhece trata o codigo como sempre' } }
    WorkspacePermissionCode:
      description: 'Permissoes de workspace (13): podem aparecer em allWorkspaces e em atribuicoes de workspace.'
      type: string
      enum: [workspace.configure, role.assign_operator_viewer, automation.read, automation.execute, logs.read,
             automation.manage, automation.publish,
             workspace_parameter.read, workspace_parameter.manage, workspace_secret.read, workspace_secret.manage,
             automation_schedule.read, automation_schedule.manage]
    OrganizationOnlyPermissionCode:
      description: 'Permissoes organizacionais (10): so aparecem em organization.permissions.'
      type: string
      enum: [org.manage, workspace.lifecycle, role.assign_admin_roles, external_access.manage,
             worker.manage, agent.manage, agent_credential.manage, worker_agent.assign, worker_workspace.authorize,
             identity.mfa.reset]
    PermissionCode:
      description: 'Catalogo completo de public.permissions (migrations 003, 004, 005, 008, 009, 014): 23 codigos.'
      anyOf:
        - $ref: '#/components/schemas/WorkspacePermissionCode'
        - $ref: '#/components/schemas/OrganizationOnlyPermissionCode'
    RoleCode: { type: string, enum: [ORG_ADMIN, WORKSPACE_ADMIN, OPERATOR, VIEWER] }
    OrganizationRoleCode: { type: string, enum: [ORG_ADMIN] }
    WorkspaceRoleCode: { type: string, enum: [WORKSPACE_ADMIN, OPERATOR, VIEWER] }
    MembershipStatus: { type: string, enum: [pending, active, suspended, revoked] }
    AccountStatus: { type: string, enum: [pending, active, suspended, closed] }
    GrantStatus: { type: string, enum: [pending, active, suspended, revoked] }
    ResourceStatus: { type: string, enum: [active, suspended, archived] }
    ExecutionStatus: { type: string, enum: [pending, starting, running, succeeded, failed, cancelled] }
    ExecutionStatusReason: { type: [string, 'null'], enum: [process_completed, start_failed, process_failed, cancelled_before_dispatch, cancel_confirmed, queue_deadline_exceeded, null] }
    MyPermissions:
      type: object
      required: [organizationId, membershipId, organization, allWorkspaces, hasWorkspaceAssignments]
      properties:
        organizationId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        organization:
          type: object
          required: [roles, permissions]
          properties:
            roles: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/OrganizationRoleCode' } }
            permissions: { type: array, uniqueItems: true, maxItems: 23, items: { $ref: '#/components/schemas/PermissionCode' } }
        allWorkspaces:
          type: object
          required: [permissions]
          x-decisoes: DC-01
          properties:
            permissions: { type: array, uniqueItems: true, maxItems: 13, items: { $ref: '#/components/schemas/WorkspacePermissionCode' } }
        hasWorkspaceAssignments: { type: boolean, description: 'existe ao menos uma atribuicao de workspace ativa (consultar /me/permissions/workspaces)' }
    WorkspacePermissions:
      type: object
      required: [workspaceId, roles, permissions]
      properties:
        workspaceId: { type: string, format: uuid }
        roles: { type: array, uniqueItems: true, minItems: 1, items: { $ref: '#/components/schemas/WorkspaceRoleCode' } }
        permissions: { type: array, uniqueItems: true, maxItems: 13, items: { $ref: '#/components/schemas/WorkspacePermissionCode' } }
    WorkspacePermissionsPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspacePermissions' } }, nextCursor: { type: [string, 'null'] } } }
    Member:
      type: object
      required: [membershipId, userId, displayName, email, emailVerified, accountStatus, membershipStatus, mfaConfigured, organizationRoles, createdAt]
      properties:
        membershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        mfaConfigured: { type: boolean, description: 'fator com confirmed_at preenchido e disabled_at nulo', x-decisoes: DC-04 }
        organizationRoles: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/OrganizationRoleCode' } }
        createdAt: { type: string, format: date-time }
    MemberPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } }, nextCursor: { type: [string, 'null'] } } }
    ClientRef: { type: object, required: [clientId, name], properties: { clientId: { type: string, format: uuid }, name: { type: string } } }
    WorkspaceRef: { type: object, required: [workspaceId, name], properties: { workspaceId: { type: string, format: uuid }, name: { type: string } } }
    ClientGrant:
      type: object
      required: [grantId, status, client, workspace, externalAccount, approvedAt, startsAt, expiresAt, nextReviewAt, lastAccessAt, revokedAt, createdAt]
      properties:
        grantId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/GrantStatus' }
        client: { $ref: '#/components/schemas/ClientRef' }
        workspace: { $ref: '#/components/schemas/WorkspaceRef' }
        externalAccount:
          type: object
          required: [clientMembershipId, userId, displayName, email, membershipStatus]
          properties:
            clientMembershipId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            displayName: { type: string }
            email: { type: string }
            membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        approvedAt: { type: [string, 'null'], format: date-time }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        nextReviewAt: { type: [string, 'null'], format: date-time }
        lastAccessAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    GrantPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClientGrant' } }, nextCursor: { type: [string, 'null'] } } }
    Client:
      type: object
      required: [clientId, name, status, createdAt, updatedAt]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Client' } }, nextCursor: { type: [string, 'null'] } } }
    Workspace:
      type: object
      required: [workspaceId, name, description, status, client, createdAt, updatedAt]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        client: { oneOf: [ { $ref: '#/components/schemas/ClientRef' }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspacePage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }, nextCursor: { type: [string, 'null'] } } }
    Automation:
      type: object
      required: [automationId, workspaceId, name, description, status, latestPublishedVersion, createdAt, updatedAt]
      properties:
        automationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
