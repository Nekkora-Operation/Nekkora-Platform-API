  /api/v1/o/{org}/organization-requests/{requestId}/approve:
    post:
      tags: [Licencas da organizacao]
      operationId: approveOrganizationRequest
      x-estado: implementado (PLATFORM-LICENCIAMENTO-001 067; OrganizationProfilesIT)
      summary: 'Aprova o pedido escolhendo o responsavel pela nova organizacao (org.manage, confirmacao reforcada)'
      description: >
        responsible e obrigatorio e explicito: APPROVER (quem aprova; a escolha padrao da tela) ou REQUESTER (quem pediu). A
        escolha CONCEDE a administracao da nova organizacao ao escolhido e decide de quem e contado o limite de organizacoes
        vazias. O limite do escolhido e reconferido aqui, sob a trava dele (409 empty_organization_limit_reached; o
        pedido continua pendente). A organizacao nasce na MESMA transacao. So o responsavel
        recebe acesso: o outro nao entra na nova organizacao. createdOrganizationId so vem quando quem aprovou ficou
        responsavel. Quem aprova com conta sem identidade geral nao pode ser o responsavel (409
        organization_request_approver_without_identity; pode escolher REQUESTER). Pedido ja decidido: 409
        organization_request_not_pending. Proprio pedido: 409 organization_request_own. Responsavel que deixou de poder
        receber: 409 organization_request_responsible_not_eligible. Nome repetido para o responsavel: 409
        organization_name_taken. O banco reconfere que quem decide administra esta organizacao agora.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [responsible], properties: { responsible: { type: string, enum: [APPROVER, REQUESTER] } } }
      responses:
        '200': { description: 'Pedido aprovado', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationRequestDecision' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
