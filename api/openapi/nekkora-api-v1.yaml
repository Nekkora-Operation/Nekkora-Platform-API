        So os campos do envelope OBS 1.0.0 (sem texto livre); ordem de observacao do Agent (sequence), nunca o relogio. Numeros declarados ausentes nao viram evento. Cursor assinado.
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: run, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: 'Pagina de eventos', content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunEventPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_session
      description: Sessao emitida pelo fluxo de login com MFA (contrato 8.7; HttpOnly, Secure, SameSite=Lax, prazo absoluto). Rotas GET - sem X-CSRF-Token. {org} malformado -> 401.
    preAuthCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_pre
      description: Contexto CSRF de PRE-AUTENTICACAO (GET /api/v1/csrf; estado no Redis; SameSite=Strict). Usado com X-CSRF-Token e Origin igual a origem publica.
    challengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_mfa
      description: Desafio de MFA aberto pelo login (SameSite=Strict). Usado com o X-CSRF-Token do desafio e Origin igual a origem publica.
    identityChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_id_mfa
      description: Desafio de identidade aberto pela entrada geral (SameSite=Strict; 5 min). Usado com o X-CSRF-Token do desafio e Origin igual a origem publica.
    identitySessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_id
      description: Sessao de identidade (entrada geral; SameSite=Lax; prazo absoluto de 12 h). Nas rotas sem organizacao, autentica /api/v1/me/organizations, /api/v1/sessions/organization, /api/v1/auth/step-up, /api/v1/organizations e /api/v1/links/* (e o logout de identidade). Excecao unica (P4) - em /api/v1/o/{org}/auth/mfa/step-up, quando a sessao de organizacao e vinculada, e exigida EM ADICAO ao cookie e ao CSRF da sessao de organizacao e tem de ser a sessao de identidade de origem dela.
    linkChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-nekkora_link
      description: Desafio de vinculacao emitido pela etapa 1 (/api/v1/links/start); SameSite=Strict; 5 min; uso unico, amarrado a identidade e a conta. Expira na resposta da etapa 2.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF do contexto da rota (pre-autenticacao, desafio ou sessao). Toda escrita exige tambem Origin igual a origem publica.
  parameters:
    Org: { name: org, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 401 (nenhuma sessao e resolvida)' }
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    AutomationId: { name: automationId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    ExecutionId: { name: executionId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' }
      description: >
        Opaco e assinado: base64url(payload) "." base64url(HMAC-SHA256). Vinculado a rota, organizacao, vinculo da sessao,
        recurso pai, filtros (impressao canonica; limit fora) e ordenacao. Posicao = chave de ordenacao de tamanho limitado
        (prefixo de 48 pontos de codigo + id, ou campos de tamanho fixo); id da chave como impressao de 11 caracteres.
        O servidor nunca emite cursor maior que 872 caracteres (pior caso calculado, documento secao 1.5.1); aceita ate
        1024. Nao e autoridade: autorizacao reaplicada a cada pagina. Malformado, adulterado, de outra
        rota/organizacao/vinculo/pai, com filtros ou ordenacao diferentes, ou de chave desconhecida (inclusive apos
        rotacao da chave) -> 400. Sem expiracao por tempo. Chave: decisao DC-15 (subchave derivada; a rotacao invalida os cursores).
      x-decisoes: [DC-15]
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 }, description: 'fora de 1-100 ou nao inteiro -> 400; pode mudar entre paginas' }
  responses:
    NoContent: { description: Sucesso sem corpo }
    ListLimitExceeded: { description: 'Lista acima do limite do portal, sem truncar (log evento=portal.list_limit_exceeded)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: internal_error } } } }
    Accepted: { description: Pedido aceito (sem enumeracao de contas) }
    SignupDisabled: { description: 'Rota de identidade desligada pela sua chave (cadastro: nekkora.cadastro.enabled; login, MFA, organizacoes da identidade e troca: nekkora.entrada-geral.enabled; criacao de organizacao: nekkora.criacao-organizacao.enabled; vinculacao: nekkora.vinculacao.enabled; convites: nekkora.convites.enabled - estas tres so abrem com a entrada geral ligada; todas desligadas por padrao): a rota nao existe', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
    RestrictedIdentitySession: { description: 'Sessao de identidade restrita a recuperacao (DC-17.13): so cadastrar e confirmar o fator novo, e logout', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    CsrfForbidden: { description: 'Origin diferente da origem publica ou X-CSRF-Token do contexto ausente/invalido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    ServiceUnavailable:
      description: 'Dependencia indisponivel (ex.: Redis do limitador ou do estado CSRF de pre-autenticacao)'
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: service_unavailable } } }
    InvalidRequest: { description: 'Parametro invalido: UUID malformado, limit, status, data, periodo ou cursor', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid_request } } } }
    Unauthenticated: { description: 'Sem sessao valida na organizacao da rota', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unauthenticated } } } }
    Forbidden: { description: 'Conta externa, sem a permissao exigida, ou Origin/CSRF invalido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
    NotFound: { description: 'Inexistente, de outra organizacao ou sem acesso ao workspace (resposta identica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: not_found } } } }
    CatalogInconsistent: { description: 'Codigo de papel, permissao ou rotulo de status desconhecido, ou permissao organizacional em papel de workspace (nunca omitido silenciosamente)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: internal_error } } } }
    Conflict: { description: 'O estado atual impede o ato (convite pendente, destinataria ja cadastrada, concessao duplicada ou fora do estado, papel ja ativo, vinculo inativo)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: conflict } } } }
    RateLimited:
      description: Limite R7
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: rate_limited } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string, enum: [invalid_request, unauthenticated, forbidden, not_found, conflict, already_member, account_exists, account_unavailable, rate_limited, internal_error, service_unavailable, unsupported_contract] } }
    WorkspacePermissionCode:
      description: 'Permissoes de workspace (13): podem aparecer em allWorkspaces e em atribuicoes de workspace.'
      type: string
      enum: [workspace.configure, role.assign_operator_viewer, automation.read, automation.execute, logs.read,
             automation.manage, automation.publish,
             workspace_parameter.read, workspace_parameter.manage, workspace_secret.read, workspace_secret.manage,
             automation_schedule.read, automation_schedule.manage]
    OrganizationOnlyPermissionCode:
      description: 'Permissoes organizacionais (10): so aparecem em organization.permissions.'
      type: string
      enum: [org.manage, workspace.lifecycle, role.assign_admin_roles, external_access.manage,
             worker.manage, agent.manage, agent_credential.manage, worker_agent.assign, worker_workspace.authorize,
             identity.mfa.reset]
    PermissionCode:
      description: 'Catalogo completo de public.permissions (migrations 003, 004, 005, 008, 009, 014): 23 codigos.'
      anyOf:
        - $ref: '#/components/schemas/WorkspacePermissionCode'
        - $ref: '#/components/schemas/OrganizationOnlyPermissionCode'
    RoleCode: { type: string, enum: [ORG_ADMIN, WORKSPACE_ADMIN, OPERATOR, VIEWER] }
    OrganizationRoleCode: { type: string, enum: [ORG_ADMIN] }
    WorkspaceRoleCode: { type: string, enum: [WORKSPACE_ADMIN, OPERATOR, VIEWER] }
    MembershipStatus: { type: string, enum: [pending, active, suspended, revoked] }
    AccountStatus: { type: string, enum: [pending, active, suspended, closed] }
    GrantStatus: { type: string, enum: [pending, active, suspended, revoked] }
    ResourceStatus: { type: string, enum: [active, suspended, archived] }
    ExecutionStatus: { type: string, enum: [pending, starting, running, succeeded, failed, cancelled] }
    ExecutionStatusReason: { type: [string, 'null'], enum: [process_completed, start_failed, process_failed, cancelled_before_dispatch, cancel_confirmed, queue_deadline_exceeded, null] }
    MyPermissions:
      type: object
      required: [organizationId, membershipId, organization, allWorkspaces, hasWorkspaceAssignments]
      properties:
        organizationId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        organization:
          type: object
          required: [roles, permissions]
          properties:
            roles: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/OrganizationRoleCode' } }
            permissions: { type: array, uniqueItems: true, maxItems: 23, items: { $ref: '#/components/schemas/PermissionCode' } }
        allWorkspaces:
          type: object
          required: [permissions]
          x-decisoes: DC-01
          properties:
            permissions: { type: array, uniqueItems: true, maxItems: 13, items: { $ref: '#/components/schemas/WorkspacePermissionCode' } }
        hasWorkspaceAssignments: { type: boolean, description: 'existe ao menos uma atribuicao de workspace ativa (consultar /me/permissions/workspaces)' }
    WorkspacePermissions:
      type: object
      required: [workspaceId, roles, permissions]
      properties:
        workspaceId: { type: string, format: uuid }
        roles: { type: array, uniqueItems: true, minItems: 1, items: { $ref: '#/components/schemas/WorkspaceRoleCode' } }
        permissions: { type: array, uniqueItems: true, maxItems: 13, items: { $ref: '#/components/schemas/WorkspacePermissionCode' } }
    WorkspacePermissionsPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspacePermissions' } }, nextCursor: { type: [string, 'null'] } } }
    Member:
      type: object
      required: [membershipId, userId, displayName, email, emailVerified, accountStatus, membershipStatus, mfaConfigured, organizationRoles, createdAt]
      properties:
        membershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        mfaConfigured: { type: boolean, description: 'fator com confirmed_at preenchido e disabled_at nulo', x-decisoes: DC-04 }
        organizationRoles: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/OrganizationRoleCode' } }
        createdAt: { type: string, format: date-time }
    MemberPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } }, nextCursor: { type: [string, 'null'] } } }
    ClientRef: { type: object, required: [clientId, name], properties: { clientId: { type: string, format: uuid }, name: { type: string } } }
    WorkspaceRef: { type: object, required: [workspaceId, name], properties: { workspaceId: { type: string, format: uuid }, name: { type: string } } }
    ClientGrant:
      type: object
      required: [grantId, status, client, workspace, externalAccount, approvedAt, startsAt, expiresAt, nextReviewAt, lastAccessAt, revokedAt, createdAt]
      properties:
        grantId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/GrantStatus' }
        client: { $ref: '#/components/schemas/ClientRef' }
        workspace: { $ref: '#/components/schemas/WorkspaceRef' }
        externalAccount:
          type: object
          required: [clientMembershipId, userId, displayName, email, membershipStatus]
          properties:
            clientMembershipId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            displayName: { type: string }
            email: { type: string }
            membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        approvedAt: { type: [string, 'null'], format: date-time }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        nextReviewAt: { type: [string, 'null'], format: date-time }
        lastAccessAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    GrantPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClientGrant' } }, nextCursor: { type: [string, 'null'] } } }
    Client:
      type: object
      required: [clientId, name, status, createdAt, updatedAt]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Client' } }, nextCursor: { type: [string, 'null'] } } }
    Workspace:
      type: object
      required: [workspaceId, name, description, status, client, createdAt, updatedAt]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        client: { oneOf: [ { $ref: '#/components/schemas/ClientRef' }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspacePage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }, nextCursor: { type: [string, 'null'] } } }
    Automation:
      type: object
      required: [automationId, workspaceId, name, description, status, latestPublishedVersion, createdAt, updatedAt]
      properties:
        automationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        latestPublishedVersion:
          oneOf:
            - type: object
              required: [automationVersionId, versionNumber, publishedAt]
              properties: { automationVersionId: { type: string, format: uuid }, versionNumber: { type: integer }, publishedAt: { type: string, format: date-time } }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutomationPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Automation' } }, nextCursor: { type: [string, 'null'] } } }
    AutomationVersion:
      type: object
      required: [automationVersionId, versionNumber, status, publishedAt, createdAt]
      properties:
        automationVersionId: { type: string, format: uuid }
        versionNumber: { type: integer }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AutomationVersionPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/AutomationVersion' } }, nextCursor: { type: [string, 'null'] } } }
    Execution:
      type: object
      required: [executionId, workspaceId, automation, automationVersion, origin, status, statusReason, createdAt, startedAt, finishedAt, durationMs, cancelRequestedAt]
      properties:
        executionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        automation: { type: object, required: [automationId, name], properties: { automationId: { type: string, format: uuid }, name: { type: string } } }
        automationVersion: { type: object, required: [automationVersionId, versionNumber], properties: { automationVersionId: { type: string, format: uuid }, versionNumber: { type: integer } } }
        origin: { type: string, enum: [manual, scheduled] }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        statusReason: { $ref: '#/components/schemas/ExecutionStatusReason' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs:
          type: [integer, 'null']
          minimum: 0
          description: 'finishedAt - startedAt em milissegundos inteiros (truncado); nulo se startedAt ou finishedAt for nulo; nunca calculado contra o relogio atual'
        cancelRequestedAt: { type: [string, 'null'], format: date-time }
    ExecutionDetail:
      allOf:
        - $ref: '#/components/schemas/Execution'
        - type: object
          required: [retryOfExecutionId, requestedBy]
          description: 'errorSummary retirado ate a sanitizacao ser comprovada (decisao DC-10: adiado).'
          properties:
            retryOfExecutionId: { type: [string, 'null'], format: uuid }
            requestedBy:
              oneOf:
                - { type: object, required: [membershipId, displayName], properties: { membershipId: { type: string, format: uuid }, displayName: { type: string } } }
                - { type: 'null' }
              description: 'solicitante; nulo em execucao agendada'
              x-decisoes: DC-09
    ExecutionPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Execution' } }, nextCursor: { type: [string, 'null'] } } }
    ExecutionEvent:
      type: object
      required: [sequence, type, occurredAt, receivedAt]
      properties:
        sequence: { type: integer }
        type: { type: string, enum: [process_started, process_succeeded, process_failed, process_start_failed, process_cancelled] }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    ExecutionEventPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExecutionEvent' } }, nextCursor: { type: [string, 'null'] } } }
    CsrfToken: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string, format: password } } }
    LoginResponse: { type: object, required: [status, csrfToken], properties: { status: { type: string, enum: [mfa_required, mfa_enrollment_required] }, csrfToken: { type: string, description: 'CSRF do desafio' } } }
    OtpauthUri: { type: object, required: [otpauthUri], properties: { otpauthUri: { type: string } } }
    TotpCodeRequest:
      type: object
      description: 'Cadastro de MFA e step-up: so o codigo TOTP. recoveryCode NAO e alternativa aqui (o servidor o ignora); code ausente -> 400 no step-up.'
      required: [code]
      additionalProperties: false
      properties: { code: { type: string, minLength: 1 } }
    MfaVerifyRequest:
      type: object
      description: 'Verificacao do desafio: EXATAMENTE um entre code (TOTP) e recoveryCode; nenhum ou os dois -> 400 (AuthController.verify).'
      additionalProperties: false
      properties: { code: { type: string, minLength: 1 }, recoveryCode: { type: string, minLength: 1 } }
      oneOf:
        - { required: [code], not: { required: [recoveryCode] } }
        - { required: [recoveryCode], not: { required: [code] } }
    IdentityEnrollmentConfirmation: { type: object, required: [recoveryCodes, csrfToken, restricted], properties: { recoveryCodes: { type: array, items: { type: string } }, csrfToken: { type: string }, restricted: { type: boolean, enum: [false] } } }
    IdentityFactorReplacement: { type: object, required: [recoveryCodes, restricted], properties: { recoveryCodes: { type: array, items: { type: string }, description: 'Conjunto novo; o anterior foi invalidado. Mostrado uma unica vez' }, restricted: { type: boolean, enum: [false] } } }
    IdentitySessionIssued: { type: object, required: [csrfToken, restricted], properties: { csrfToken: { type: string }, restricted: { type: boolean, description: 'true: sessao nascida de codigo de recuperacao (DC-17.13), restrita ate concluir a troca do fator' } } }
    RecoveryCodes: { type: object, required: [recoveryCodes], properties: { recoveryCodes: { type: array, items: { type: string }, description: 'Conjunto novo; o anterior foi invalidado. Mostrado uma unica vez' } } }
    IdentitySessionState: { type: object, required: [restricted, csrfToken], properties: { restricted: { type: boolean }, csrfToken: { type: string } } }
    EnrollmentConfirmation: { type: object, required: [recoveryCodes, csrfToken], properties: { recoveryCodes: { type: array, items: { type: string } }, csrfToken: { type: string } } }
    PasswordChange: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string, format: password }, newPassword: { type: string, format: password, description: '12 a 128 pontos de codigo' } } }
    RecoveryRequest: { type: object, required: [email], properties: { email: { type: string } } }
    RecoveryConfirmation: { type: object, required: [token, newPassword], properties: { token: { type: string }, newPassword: { type: string, format: password } } }
    TokenBody: { type: object, required: [token], properties: { token: { type: string } } }
    SignupRequest:
      type: object
      description: 'Pedido de cadastro: SO o e-mail, sem espacos nas pontas nem internos, com um @, ate 254 caracteres (comparado em minusculas). password ou displayName presentes: 400 (pertencem a confirmacao).'
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
    SignupConfirmation:
      type: object
      description: 'Conclusao do cadastro pela titular do e-mail: token recebido, senha pela politica atual (12-128 pontos de codigo, sem regras de composicao) e nome (ate 120 pontos de codigo, nao em branco, sem caracteres de controle).'
      required: [token, password, displayName]
      properties:
        token: { type: string }
        password: { type: string, format: password }
        displayName: { type: string, minLength: 1 }
    IdentityOrganizationList:
      type: object
      required: [organizations, canCreateOrganization]
      properties:
        organizations:
          type: array
          items:
            type: object
            required: [organizationId, name, roles, activationState]
            properties:
              organizationId: { type: string, format: uuid }
              name: { type: string }
              roles: { type: array, items: { type: string }, description: 'codigos dos papeis ativos do vinculo interno, em ordem' }
              activationState: { $ref: '#/components/schemas/OrganizationActivationState' }
        canCreateOrganization: { type: boolean, description: 'so indicacao para a interface (P2): chave da criacao ligada e identity_org_creation_allowed verdadeira; a criacao reconfere tudo' }
    OrganizationCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: '1 a 120 pontos de codigo, sem espaco nas pontas, sem caractere de controle' }
        legalName: { type: string, minLength: 1, description: 'opcional; mesma regra de name' }
    OrganizationCreated: { type: object, required: [organizationId], properties: { organizationId: { type: string, format: uuid } } }
    LinkStartRequest:
      type: object
      description: 'Etapa 1 da vinculacao: EXATAMENTE um entre code (TOTP da conta antiga) e recoveryCode (codigo de recuperacao da conta antiga); nenhum ou os dois -> 400.'
      required: [organizationId, password]
      properties:
        organizationId: { type: string, format: uuid, description: 'UUID canonico; malformado -> 400' }
        password: { type: string, format: password, description: 'senha da conta antiga (nao a da identidade)' }
        code: { type: string, minLength: 1 }
        recoveryCode: { type: string, minLength: 1 }
    LinkConfirmRequest: { type: object, required: [organizationId], properties: { organizationId: { type: string, format: uuid, description: 'UUID canonico; malformado ou ausente -> 400' } } }
    OrganizationSessionRequest: { type: object, required: [organizationId], properties: { organizationId: { type: string, format: uuid, description: 'UUID canonico; malformado -> 400' } } }
    OrganizationSessionResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [sessao_criada, sem_acesso] }
        csrfToken: { type: string, description: 'so em sessao_criada: CSRF da sessao de organizacao' }
    SignupResendRequest: { type: object, required: [email], properties: { email: { type: string } } }
    InvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254, description: 'normalizado em minusculas; forma invalida -> 400' }
        role: { $ref: '#/components/schemas/RoleCode' }
        workspaceId: { type: string, format: uuid, description: 'obrigatorio com papel de workspace; proibido com ORG_ADMIN ou sem papel' }
    InvitationCreated:
      type: object
      required: [invitationId, email, role, workspaceId, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string }
        role: { type: [string, 'null'], enum: [ORG_ADMIN, WORKSPACE_ADMIN, OPERATOR, VIEWER, null] }
        workspaceId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [invitationId, email, role, workspaceId, state, createdAt, expiresAt, acceptedAt, revokedAt, revokeReason, issuedBy, replacesInvitationId]
            properties:
              invitationId: { type: string, format: uuid }
              email: { type: string }
              role: { type: [string, 'null'] }
              workspaceId: { type: [string, 'null'], format: uuid }
              state: { type: string, enum: [PENDENTE, EXPIRADO, ACEITO, REVOGADO] }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
              acceptedAt: { type: [string, 'null'], format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
              revokeReason: { type: [string, 'null'], enum: [REVOGADO, REENVIADO, EXPIRADO, EMISSOR_SEM_AUTORIDADE, null], description: 'EMISSOR_SEM_AUTORIDADE (024): fechado pelo banco quando o emissor perdeu a autoridade; nunca volta a valer' }
              issuedBy: { type: string, format: uuid, description: 'conta (user_id) do emissor' }
              replacesInvitationId: { type: [string, 'null'], format: uuid }
    InvitationAcceptRequest:
      type: object
      required: [organizationId, token]
      properties:
        organizationId: { type: string, format: uuid, description: 'UUID canonico; malformado ou ausente -> 400' }
        token: { type: string, description: 'token do link do convite (fragmento #token=); nunca vai a log' }
    InvitationAccepted: { type: object, required: [organizationId], properties: { organizationId: { type: string, format: uuid } } }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/RoleCode' }
        workspaceId: { type: string, format: uuid, description: 'na atribuicao: obrigatorio com papel de workspace; na alteracao: proibido (o escopo e o da atribuicao atual)' }
    RoleAssignment:
      type: object
      required: [assignmentId, role, workspaceId]
      properties:
        assignmentId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RoleCode' }
        workspaceId: { type: [string, 'null'], format: uuid }
    MemberRoles:
      type: object
      required: [userId, membershipId, membershipState, organizationRoles, workspaceRoles]
      properties:
        userId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        membershipState: { type: string, enum: [PENDENTE, ATIVO, SUSPENSO, RETIRADO] }
        organizationRoles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        workspaceRoles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
    GrantCreateRequest:
      type: object
      required: [clientMembershipId, workspaceId, nextReviewAt]
      properties:
        clientMembershipId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time, description: 'padrao: agora' }
        expiresAt: { type: string, format: date-time, description: 'depois de startsAt' }
        nextReviewAt: { type: string, format: date-time, description: 'obrigatorio e futuro (024): proxima revisao pedida' }
    GrantApprovalRequest:
      type: object
      required: [nextReviewAt]
      properties:
        nextReviewAt: { type: string, format: date-time, description: 'pedido: futuro; aprovacao: igual ao pedido' }
        expiresAt: { type: string, format: date-time, description: 'pedido: depois do inicio, ausente = sem prazo; aprovacao: igual ao pedido' }
        justification: { type: string, maxLength: 2000, description: 'obrigatoria no pedido de renovacao; opcional na aprovacao inicial; ignorada em /renew/approve' }
    GrantReviewRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [KEEP, SUSPEND, REVOKE] }
        notes: { type: string, maxLength: 2000 }
        nextReviewAt: { type: string, format: date-time, description: 'KEEP: opcional; igual ou mais cedo (futuro); mais tarde -> 409' }
    GrantState:
      type: object
      required: [grantId, clientMembershipId, workspaceId, status, startsAt, expiresAt, nextReviewAt, renewal]
      properties:
        grantId: { type: string, format: uuid }
        clientMembershipId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        status: { type: string, enum: [PENDENTE, ATIVA, SUSPENSA, REVOGADA] }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        nextReviewAt: { type: [string, 'null'], format: date-time, description: 'na PENDENTE: a pedida' }
        renewal:
          description: 'pedido de renovacao pendente (024); null sem pedido'
          type: [object, 'null']
          required: [requestedByMembershipId, requestedAt, nextReviewAt, expiresAt, justification]
          properties:
            requestedByMembershipId: { type: string, format: uuid }
            requestedAt: { type: string, format: date-time }
            nextReviewAt: { type: string, format: date-time }
            expiresAt: { type: [string, 'null'], format: date-time, description: 'null = sem prazo' }
            justification: { type: string }
    AccessEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [eventId, type, actorUserId, byInvitee, targetUserId, role, previousRole, workspaceId, invitationId, assignmentId, grantId, decision, correlationId, createdAt]
            properties:
              eventId: { type: string, format: uuid }
              type: { type: string, enum: [CONVITE_EMITIDO, CONVITE_REVOGADO, CONVITE_REENVIADO, CONVITE_ACEITO, PAPEL_ATRIBUIDO, PAPEL_REVOGADO, PAPEL_ALTERADO, VINCULO_RETIRADO, CONCESSAO_CRIADA, CONCESSAO_APROVADA, CONCESSAO_RENOVADA, CONCESSAO_REVISADA, CONCESSAO_REVOGADA, CONCESSAO_RENOVACAO_SOLICITADA] }
              actorUserId: { type: [string, 'null'], format: uuid, description: 'nulo no aceite (o autor e a identidade convidada)' }
              byInvitee: { type: boolean }
              targetUserId: { type: [string, 'null'], format: uuid }
              role: { type: [string, 'null'] }
              previousRole: { type: [string, 'null'] }
              workspaceId: { type: [string, 'null'], format: uuid }
              invitationId: { type: [string, 'null'], format: uuid }
              assignmentId: { type: [string, 'null'], format: uuid }
              grantId: { type: [string, 'null'], format: uuid }
              decision: { type: [string, 'null'], enum: [KEEP, SUSPEND, REVOKE, null] }
              correlationId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    Me:
      type: object
      required: [accountType, displayName, email, organizationId, organizationActivationState]
      properties:
        accountType: { type: string, enum: [internal, external] }
        displayName: { type: string }
        email: { type: string }
        organizationId: { type: string, format: uuid }
        organizationActivationState: { $ref: '#/components/schemas/OrganizationActivationState' }
    OrganizationActivationState:
      type: string
      enum: [AGUARDANDO_ATIVACAO, ATIVADA]
      description: >
        Ciclo de ativacao da organizacao (migration 022), INDEPENDENTE da situacao administrativa (ativa, suspensa,
        encerrada). AGUARDANDO_ATIVACAO: capacidade de execucao zero (nenhum Worker registrado, nenhuma execucao simultanea
        ou pendente) ate a ativacao pela operacao da Nekkora; toda organizacao criada nasce assim. ATIVADA: a operacao aplicou
        limites explicitos. So indicacao para a interface: os valores dos limites nao sao expostos e a admissao de execucao
        continua decidida no banco.
    MfaResetRequest: { type: object, required: [reason], properties: { reason: { type: string, enum: [DISPOSITIVO_PERDIDO, DISPOSITIVO_TROCADO, SUSPEITA_COMPROMETIMENTO, OUTRO] } } }
    OperationalLinkCode: { type: object, required: [code, expiresAt], properties: { code: { type: string }, expiresAt: { type: string, format: date-time } } }
    PortalWorkspaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { type: object, required: [workspaceId, name], properties: { workspaceId: { type: string, format: uuid }, name: { type: string } } } }
    PortalExecution:
      type: object
      required: [executionId, automation, createdAt, startedAt, finishedAt, durationMs, status, statusReason]
      properties:
        executionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid, description: 'omitido quando a conta externa tem um unico workspace autorizado' }
        automation: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        statusReason: { $ref: '#/components/schemas/ExecutionStatusReason' }
    PortalExecutionPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/PortalExecution' } }, nextCursor: { type: [string, 'null'] } } }
    PortalEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 1000, items: { type: object, required: [type, receivedAt], properties: { type: { type: string, enum: [process_started, process_succeeded, process_failed, process_start_failed, process_cancelled] }, receivedAt: { type: string, format: date-time } } } }
    AgentPairingRequest:
      type: object
      additionalProperties: false
      required: [agentName]
      properties:
        workerId: { type: string, format: uuid, description: 'Worker existente (ou workerName, nunca os dois)' }
        workerName: { type: string, minLength: 1, maxLength: 80 }
        agentName: { type: string, minLength: 1, maxLength: 80, description: 'Nome logico da maquina, informado pela pessoa (nada e coletado da maquina)' }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 60, default: 15 }
    AgentRotationRequest:
      type: object
      additionalProperties: false
      properties:
        expiresInMinutes: { type: integer, minimum: 5, maximum: 60, default: 15 }
    AgentRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [COMPROMISED, ADMINISTRATIVE] }
    AgentCode:
      type: object
      required: [enrollmentId, code, expiresAt, workerId]
      properties:
        enrollmentId: { type: string, format: uuid }
        code: { type: string, pattern: '^nkp1\.[0-9a-f-]{36}\.[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$', description: 'So nesta resposta' }
        expiresAt: { type: string, format: date-time }
        workerId: { type: string, format: uuid }
        agentId: { type: [string, 'null'], format: uuid, description: 'So na rotacao' }
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              agentId: { type: string, format: uuid }
              name: { type: string }
              installationId: { type: string, format: uuid }
              agentVersion: { type: string }
              status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] }
              workerId: { type: [string, 'null'], format: uuid }
              registeredAt: { type: string, format: date-time }
              lastHeartbeatAt: { type: [string, 'null'], format: date-time }
              connectivity: { type: string, enum: [CONNECTED, DISCONNECTED] }
              contractVersion: { type: [string, 'null'] }
              capabilities: { type: array, items: { type: string, enum: [RUN_LOCAL, OBS_1_0, SUPERVISOR_REPORT_1_0] } }
              credentialExpiresAt: { type: [string, 'null'], format: date-time }
    WorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              workerId: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [ACTIVE, SUSPENDED, RETIRED] }
              agentId: { type: [string, 'null'], format: uuid }
              workspaceIds: { type: array, items: { type: string, format: uuid } }
    WorkerWorkspace:
      type: object
      properties:
        assignmentId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        created: { type: boolean }
    LocalRunAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [workerId, automationVersionId, validUntil]
      properties:
        workerId: { type: string, format: uuid }
        automationVersionId: { type: string, format: uuid }
        validUntil: { type: string, format: date-time, description: 'Com fuso; ate 366 dias' }
    LocalRunAuthorization:
      type: object
      properties:
        authorizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        automationId: { type: string, format: uuid }
        automationVersionId: { type: string, format: uuid }
        packageFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        grantedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    LocalRunAuthorizationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LocalRunAuthorization' } }
    AgentSupervisorState: { type: string, enum: [READY, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, BLOCKED, OUTCOME_UNKNOWN] }
    AgentRun:
      type: object
      properties:
        runId: { type: string, format: uuid }
        correlation:
          type: object
          properties:
            agentExecutionId: { type: string, pattern: '^ex-[0-9a-f]{32}$' }
            frameworkExecutionId: { type: [string, 'null'] }
            platformExecutionId: { type: [string, 'null'], format: uuid, description: 'Nulo em execucao local' }
            agentId: { type: string, format: uuid }
            workerId: { type: string, format: uuid }
            workspaceId: { type: string, format: uuid }
            automationId: { type: string, format: uuid }
            automationVersionId: { type: string, format: uuid }
            authorizationId: { type: string, format: uuid }
        origin: { type: string, enum: [LOCAL_AUTHORIZED] }
        authorizationStateAtRegistration: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        registeredAt: { type: string, format: date-time }
        supervisor:
          type: object
          properties:
            state: { $ref: '#/components/schemas/AgentSupervisorState' }
            code: { type: [string, 'null'], description: 'AGT-XXX-nnn' }
            exitCode: { type: [integer, 'null'] }
            counts: { type: object, additionalProperties: { type: integer } }
            agentCreatedAt: { type: [string, 'null'], format: date-time, description: 'Relogio do Agent, como informado' }
            agentStartedAt: { type: [string, 'null'], format: date-time }
            agentEndedAt: { type: [string, 'null'], format: date-time }
            adopted: { type: boolean }
            suspensions: { type: integer }
            locks: { type: integer }
            reports: { type: integer }
            conflicts: { type: integer, description: 'Relatorios contraditorios registrados (o estado nao mudou)' }
            lastReportAt: { type: string, format: date-time }
        process: { type: string, enum: [NOT_STARTED, STARTING, RUNNING, ENDED] }
        outcome: { type: string, enum: [PENDING, KNOWN, UNKNOWN] }
        transport:
          type: object
          properties:
            connectivity: { type: string, enum: [CONNECTED, DISCONNECTED] }
            lastHeartbeatAt: { type: [string, 'null'], format: date-time }
            lastEventAt: { type: [string, 'null'], format: date-time }
        history:
          type: object
          properties:
            completeness: { type: string, enum: [COMPLETE, PENDING, INCOMPLETE] }
            reasons: { type: array, items: { type: string, enum: [DELIVERY_PENDING, LOST_AT_SOURCE, LOST_LOCAL, PURGED_LOCAL, INVALID_REFUSED, DELIVERY_CONFLICT] } }
            eventsStored: { type: integer }
            storedThrough: { type: integer }
            settledThrough: { type: integer }
            maxSequence: { type: integer }
            declaredMissing: { type: integer }
            collectionCompletedSequence: { type: [integer, 'null'] }
            invalidRefused: { type: integer }
            stepsAvailable: { type: boolean, description: 'false: processo sem eventos do Framework (etapas indisponiveis; nada e inventado)' }
        transactionsSeen: { type: object, additionalProperties: { type: integer }, description: 'So no detalhe' }
    AgentRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
        nextCursor: { type: [string, 'null'] }
    AgentRunEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              source: { type: string, enum: [AGENT, FRAMEWORK, COLLECTOR] }
              eventCode: { type: string }
              severity: { type: string, enum: [INFO, WARNING, ERROR] }
              category: { type: string, enum: [LIFECYCLE, ACTIVITY, BUSINESS, FAILURE, TELEMETRY] }
              phase: { type: [string, 'null'] }
              stepId: { type: [string, 'null'] }
              studioStepId: { type: [string, 'null'], format: uuid }
              action: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
              errorCode: { type: [string, 'null'] }
              attempt: { type: [integer, 'null'] }
              elapsedMs: { type: [integer, 'null'] }
              transactionRef: { type: [string, 'null'] }
              counts: { type: [object, 'null'], additionalProperties: { type: integer } }
              timestampUtc: { type: [string, 'null'], format: date-time, description: 'Instante informado pela origem' }
              observedUtc: { type: string, format: date-time, description: 'Instante em que o Agent leu o evento' }
              receivedAt: { type: string, format: date-time }
        nextCursor: { type: [string, 'null'] }
