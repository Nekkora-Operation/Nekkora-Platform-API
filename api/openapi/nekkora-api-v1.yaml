  /api/v1/o/{org}/execution-summary:
    get:
      tags: [Inicio da organizacao]
      operationId: getExecutionSummary
      x-estado: implementado (PLATFORM-INICIO-001; ProductReadController/ExecutionSummaryReads; ExecutionSummaryIT)
      summary: 'Contagem das execucoes pedidas no periodo, nos ambientes visiveis (automation.read)'
      description: >
        Agregacao feita no banco sobre TODAS as execucoes do periodo [from, to) - nunca a soma de uma pagina de lista. Uma
        execucao e um pedido, nunca uma tentativa. Quatro origens, sem sobreposicao: execucoes da Platform (manuais ou
        agendadas; a repeticao e outro pedido e conta de novo); execucoes relatadas pelo Agent; pedidos ao Agent anterior que
        nao viraram execucao (o que virou e contado pela execucao); e solicitacoes de execucao remota do Agent Client, pelo
        estado da ULTIMA tentativa (repetir em outra maquina nao aumenta o total). A data e o instante em que a Platform
        registrou o pedido. Cada execucao cai em exatamente uma situacao e a soma das seis e o total: succeeded; failed (o
        processo da automacao falhou ou estourou o tempo); inProgress; cancelled; notStarted (recusada, expirada, bloqueada ou
        que falhou antes de o processo existir - nao e erro da automacao); unconfirmed (terminou sem resultado confirmado -
        nunca sucesso nem erro). Execucoes locais privadas do Agent Client nao chegam a Platform e nao entram. Quem nao le
        nenhum ambiente recebe zeros. from e to sao obrigatorios, com fuso; to depois de from; periodo de ate 366 dias.
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time }, description: 'inclusivo, com fuso' }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time }, description: 'exclusivo, com fuso' }
      responses:
        '200': { description: 'Resumo do periodo', content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionSummary' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/CatalogInconsistent' }

