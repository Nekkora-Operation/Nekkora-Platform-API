openapi: 3.1.0
info:
  title: Nekkora Platform API v1
  version: 1.0.0
  description: >
    Contrato HTTP DEFINITIVO da API v1 (DC-14, decisao da responsavel em 2026-10-03: este arquivo e a fonte; o anexo da
    proposta GAP-02/03/06 deixa de ser a fonte). Cobre todas as rotas publicadas: identidade, sessao e MFA (contrato 8.7),
    administracao minima, recuperacao emergencial de MFA (016), permissoes (GAP-02), administracao de leitura (GAP-03),
    leitura interna do produto (GAP-06) e o portal externo (013). Conferido contra o codigo (mapeamentos dos controladores)
    e contra os testes HTTP (D-INV-06). x-decisoes: decisoes da responsavel (DC-xx do contrato GAP-02/03/06) que fundamentam a
    operacao; nenhuma esta pendente. Corpo de erro sempre {"error":"<codigo>"} (contrato 8.7 §5.2). Rotas internas de
    leitura: ordem 401 -> 400 -> 403 -> 404; paginacao keyset sobre o estado atual com cursor assinado (secoes 1.4-1.5 do
    contrato GAP-02/03/06). Escritas com sessao exigem Origin igual a origem publica e X-CSRF-Token do contexto (CsrfFilter).
servers:
  - url: https://{host}
    description: Gateway publico (caminho publicado = caminho interno)
    variables:
      host: { default: homologacao.nekkora.test }
security:
  - sessionCookie: []
tags:
  - name: Identidade e sessao
  - name: Cadastro web (identidade)
  - name: Entrada geral (identidade)
  - name: Administracao
  - name: Recuperacao emergencial de MFA
  - name: GAP-02 permissoes
  - name: GAP-03 administracao
  - name: GAP-06 leitura interna
  - name: Portal externo

paths:
  /api/v1/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getPreAuthCsrf
      summary: 'Emite o token CSRF de pre-autenticacao (cookie __Host-nekkora_pre, estado no Redis)'
      security: []
      responses:
        '200': { description: 'Token de pre-autenticacao (e cookie __Host-nekkora_pre)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/csrf:
    get:
      tags: [Identidade e sessao]
      operationId: getSessionCsrf
      summary: 'Token CSRF da sessao atual'
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'Token CSRF da sessao', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/o/{org}/auth/login:
    post:
      tags: [Identidade e sessao]
      operationId: login
      summary: 'Senha (passo 1): abre o desafio de MFA; resposta unica para credencial invalida (sem enumeracao)'
      description: >
        Conta VINCULADA a uma identidade (cadastro ou vinculacao, contrato P3; DC-17.9) nao entra por aqui: o mesmo 401
        generico de credencial invalida, sem desafio e sem revelar o vinculo, tambem quando o vinculo acontece enquanto o
        login espera o lock da conta (a trigger da 017 recusa o desafio). A pessoa entra pela entrada geral e pela troca.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 'Desafio de MFA aberto (cookie __Host-nekkora_mfa)', content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/start:
    post:
      tags: [Identidade e sessao]
      operationId: startMfaEnrollment
      summary: 'Inicia o cadastro do TOTP no desafio de cadastro'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '200': { description: 'URI otpauth', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/enroll/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmMfaEnrollment
      summary: 'Confirma o TOTP; emite a sessao e os codigos de recuperacao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConfirmation' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/verify:
    post:
      tags: [Identidade e sessao]
      operationId: verifyMfa
      summary: 'Verifica o TOTP ou um codigo de recuperacao (exatamente um); emite a sessao'
      security: [ { challengeCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200': { description: 'Sessao emitida (cookie __Host-nekkora_session)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/mfa/step-up:
    post:
      tags: [Identidade e sessao]
      operationId: mfaStepUp
      summary: 'Step-up com TOTP na sessao (exigido pelo reset administrativo de MFA)'
      description: >
        Codigo TOTP errado -> 403 forbidden (step_up); so codigo TOTP (recoveryCode nao aceito). Sessao do login por
        organizacao: TOTP do fator local, R1/R4, caminho inalterado. Sessao VINCULADA (nascida da troca, contrato P4): TOTP do
        fator da IDENTIDADE de origem. O CSRF desta sessao de organizacao continua exigido (o CSRF da sessao de identidade
        nao o substitui) e o cookie __Host-nekkora_id e exigido EM ADICAO, resolvendo exatamente a sessao de identidade que
        originou esta sessao (unica rota em que os dois cookies valem juntos). Cookie ausente, de outra identidade ou de outra
        sessao da mesma identidade: 403 sem conferir o codigo. Numa so transacao, na ordem global da 017 (identidade ->
        sessao de identidade -> organizacao -> conta -> sessao de organizacao), com a revalidacao da sessao de organizacao
        sob o lock, anti-replay no fator da identidade (um codigo aceito aqui nao serve para outro step-up, global ou de outra
        organizacao, nem para o login), step-up SO nesta sessao de organizacao (nem na de identidade, nem em outra sessao),
        eventos mfa_events 6 e identity_events 14 (ORG_STEP_UP) no mesmo commit, e as duas sessoes e a janela do passo
        reconferidas antes do commit. Codigo errado ou replay: 403, contado em R8m (identidade global). Sessao que caiu
        durante as esperas: 401, sem efeito.
      security: [ { sessionCookie: [], csrfHeader: [] }, { sessionCookie: [], csrfHeader: [], identitySessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/logout:
    post:
      tags: [Identidade e sessao]
      operationId: logout
      summary: 'Encerra a sessao atual (idempotente; sem sessao = sem efeito; fora do limitador R7)'
      security: [ {}, { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/sessions/revoke-all:
    post:
      tags: [Identidade e sessao]
      operationId: revokeAllSessions
      summary: 'Revoga todas as sessoes da propria conta (fora do limitador R7)'
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/o/{org}/auth/password:
    post:
      tags: [Identidade e sessao]
      operationId: changePassword
      summary: 'Troca a propria senha (senha atual errada -> 401)'
      description: >
        Sessao VINCULADA (conta que entra pela identidade, contrato P3): 403 generico, sem conferir a senha; a senha local
        nao autentica nem muda depois do vinculo (DC-17.12). A senha da pessoa e a da identidade.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, ou sessao de conta vinculada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/request:
    post:
      tags: [Identidade e sessao]
      operationId: requestPasswordReset
      summary: 'Pede a recuperacao de senha: 202 SEMPRE (sem enumeracao)'
      description: >
        Conta vinculada a uma identidade (contrato P3, DC-17.12): nenhum token e nenhum e-mail, e a mesma resposta 202 com o
        mesmo piso de tempo, inclusive quando o vinculo acontece entre a leitura e o lock da conta. A recuperacao da pessoa
        e a da identidade.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/password-reset/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmPasswordReset
      summary: 'Confirma a recuperacao com o token de uso unico e a nova senha'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/auth/email-verification/confirm:
    post:
      tags: [Identidade e sessao]
      operationId: confirmEmailVerification
      summary: 'Confirma o e-mail com o token de uso unico (sem 401)'
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup:
    post:
      tags: [Cadastro web (identidade)]
      operationId: signup
      summary: 'Pede o cadastro da identidade: 202 SEMPRE, sem corpo (sem enumeracao de e-mail)'
      description: >
        Missao 1, desenho 6.1. Fora de /o/{org}. DESLIGADO por padrao (nekkora.cadastro.enabled=false): 404 em qualquer
        metodo, antes de CSRF e limites. Recebe SO o e-mail: senha e nome sao escolhidos na confirmacao (o pedido que os
        traz e recusado com 400). E-mail livre: identidade PENDING, SEM credencial, e e-mail de confirmacao. Identidade
        PENDING: reemissao da confirmacao (R9b). Identidade ACTIVE: so o aviso de conta existente, sem token (R9b). Nada e
        criado alem disso; a resposta e a mesma em todos os casos, com o piso de tempo da recuperacao, e o e-mail sai fora
        do caminho da resposta. R9 (10 por IP por hora) e R9b (3 por identidade e 10 por IP por hora) excedidos tambem
        respondem 202, sem efeito. Nao cria sessao, conta de organizacao nem organizacao.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup/confirm:
    post:
      tags: [Cadastro web (identidade)]
      operationId: confirmSignup
      summary: 'Conclui o cadastro com o token de uso unico: a titular define a senha e o nome (PENDING -> ACTIVE)'
      description: >
        Missao 1, desenho 6.1 e 6.2 (revisao de 2026-10-13). Numa unica transacao autorizada pelo token: identidade e token
        travados, validade conferida DEPOIS dos locks, token consumido, credencial (Argon2id) gravada, identidade ativada com
        o nome escolhido. Token de 24 h, uso unico, so o SHA-256 no banco. Nao cria sessao nem organizacao. Token
        malformado, desconhecido, vencido (inclusive durante a espera), revogado, ja consumido, de identidade fora de
        PENDING, senha fora da politica ou nome invalido: 400 invalid_request, sem efeito. Desligado: 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupConfirmation' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/signup/confirmation/resend:
    post:
      tags: [Cadastro web (identidade)]
      operationId: resendSignupConfirmation
      summary: 'Reenvia a confirmacao do cadastro: 202 SEMPRE, sem corpo'
      description: >
        Missao 1, desenho 6.1. So identidade PENDING recebe nova confirmacao (o token anterior e revogado; no maximo um
        valido). E-mail desconhecido, ACTIVE, malformado ou R9b excedido: 202, sem efeito. Desligado: 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupResendRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/login:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLogin
      summary: 'Entrada geral, passo 1 (senha): abre o desafio de identidade; resposta unica para credencial invalida'
      description: >
        Missao 1, desenho 6.3. Fora de /o/{org}. Identidade inexistente, senha errada, identidade nao confirmada ou nao
        ACTIVE: 401 identico, com verificacao contra hash ficticio. Sucesso: desafio de 5 min no cookie
        __Host-nekkora_id_mfa (SameSite=Strict) e o CSRF do desafio no corpo; mfa_enrollment_required se a identidade nunca
        confirmou fator. Estado, verificacao do e-mail e credencial vigente sao reconferidos sob o lock da identidade antes
        de emitir o desafio. R8 (identidade global + IP) e R12. Chave propria, separada da do cadastro
        (nekkora.entrada-geral.enabled, desligada por padrao): desligada, 404.
      security: [ { preAuthCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: 'Desafio de identidade aberto (cookie __Host-nekkora_id_mfa)', content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/enroll/start:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityStartMfaEnrollment
      summary: 'Primeiro fator da identidade: cria o TOTP pendente (identity_mfa_enroll_pending) e devolve a URI otpauth'
      description: >
        So no desafio de cadastro (identidade que nunca confirmou fator). Segredo cifrado com AAD da identidade (sem
        organizacao). Desafio ausente, vencido, de outro proposito ou recusado pela funcao: 401. Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] } ]
      responses:
        '200': { description: 'URI otpauth', content: { application/json: { schema: { $ref: '#/components/schemas/OtpauthUri' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/enroll/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityConfirmMfaEnrollment
      summary: 'Confirma o primeiro fator; emite a sessao de identidade e os codigos de recuperacao'
      description: >
        Na MESMA transacao, com a identidade travada: o fator pendente e lido, o TOTP e conferido com o relogio lido depois
        de qualquer espera, e identity_mfa_confirm_first conclui com o id exato desse fator (consumo do desafio, credencial
        vigente, confirmacao, codigos e sessao). Codigo errado: tentativa registrada (5 invalidam o desafio) e 401. Sessao de
        12 h no cookie __Host-nekkora_id (SameSite=Lax). Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '200': { description: 'Sessao de identidade emitida (cookie __Host-nekkora_id)', content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConfirmation' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/mfa/verify:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityVerifyMfa
      summary: 'Verifica o TOTP ou um codigo de recuperacao (exatamente um); emite a sessao de identidade'
      description: >
        Na MESMA transacao, com a identidade travada (a troca de fator fica fora do intervalo): o fator confirmado e lido, o
        TOTP e conferido com o relogio lido depois de qualquer espera (passo vencido durante a espera: 401), e
        identity_login_complete conclui (consumo do desafio, credencial vigente, anti-replay, sessao); o passo gravado tem de
        estar no MESMO fator conferido, senao a transacao e desfeita (401). Codigo de recuperacao: sessao RESTRITA
        (DC-17.13; so cadastrar fator novo e logout ate T1), demais sessoes revogadas, demais desafios invalidados, aviso ao
        titular. Codigo errado ou passo ja usado: tentativa registrada e 401. Entrada geral desligada: 404.
      security: [ { identityChallengeCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyRequest' } } } }
      responses:
        '200': { description: 'Sessao de identidade emitida (cookie __Host-nekkora_id)', content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/auth/logout:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLogout
      summary: 'Encerra a sessao de identidade atual (idempotente; sem sessao = sem efeito; fora dos limitadores)'
      description: >
        As sessoes de organizacao derivadas caem na requisicao seguinte (DC-17.4), sem escrita entre organizacoes. SEM CHAVE:
        disponivel mesmo com o cadastro e a entrada geral desligados (encerrar sessao nunca depende de configuracao). Fora
        dos limitadores R7/R12 e sem depender do Redis; CSRF da sessao conferido no banco.
      security: [ {}, { identitySessionCookie: [], csrfHeader: [] } ]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /api/v1/auth/step-up:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityStepUp
      summary: 'Step-up da sessao de identidade com o TOTP do fator da identidade (vale 5 min, so nesta sessao)'
      description: >
        P1 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. So o codigo
        TOTP: recoveryCode NAO e alternativa (code ausente: 400). Numa so transacao, na ordem global da 017: identidade e
        sessao travadas e reconferidas (ativa, no prazo, nao restrita; identidade ACTIVE), fator lido sob o lock, TOTP,
        anti-replay no fator (o passo so avanca), marcador de step-up SO nesta sessao, evento 13 (STEP_UP) e a janela do
        passo reconferida antes do commit. Codigo errado, ja usado ou vencido durante as esperas: 403 generico; codigo
        errado e replay contam em R8m (identidade global, o mesmo contador da verificacao do login). Sessao que caiu: 401.
        Sessao restrita a recuperacao (DC-17.13): 403, sem conferir o codigo. R12. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCodeRequest' } } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido; codigo errado, ja usado ou vencido; ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/me/organizations:
    get:
      tags: [Entrada geral (identidade)]
      operationId: identityOrganizations
      summary: 'Organizacoes em que a identidade pode entrar (vinculo ACTIVE, conta elegivel, organizacao ativa)'
      description: >
        Missao 1, desenho 6.4. Sessao de identidade (cookie __Host-nekkora_id), sem organizacao. A lista vem inteira de
        identity_organizations (017), com a mesma elegibilidade da emissao. Lista vazia e resposta legitima (identidade
        recem-confirmada). canCreateOrganization (P2) e SO indicacao para a interface: chave da criacao de organizacao
        ligada, sessao nao restrita e identity_org_creation_allowed (R5 da 017) verdadeira (identidade ACTIVE e verificada,
        menos de 10 organizacoes criadas pelo cadastro). O step-up nao entra no calculo (e pedido na hora); a criacao
        reconfere tudo na funcao de escrita. Sessao restrita a recuperacao (DC-17.13): 403. R12. Mesma chave da entrada
        geral (nekkora.entrada-geral.enabled): desligada, 404.
      security: [ { identitySessionCookie: [] } ]
      responses:
        '200': { description: 'Organizacoes da identidade', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityOrganizationList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RestrictedIdentitySession' }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/organizations:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityCreateOrganization
      summary: 'Cria uma organizacao com a identidade como ORG_ADMIN (exige step-up da identidade de ate 5 min)'
      description: >
        P2 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. Corpo: name
        e legalName opcional, cada um com 1 a 120 pontos de codigo, sem espaco nas pontas e sem caractere de controle (fora
        disso: 400). Uma transacao que chama so identity_create_organization: a funcao reconfere, sob o lock da identidade,
        sessao nao restrita, step-up de ate 5 min, identidade ACTIVE e verificada e o teto de 10, e cria organizacao, conta,
        vinculo, ORG_ADMIN e o evento 6 (ORG_CREATED) no mesmo commit. Recusa da funcao: 403 generico; sessao que caiu:
        401. R11 (3 reservas por identidade a cada 24 h; devolvidas quando a criacao comprovadamente nao aconteceu, mantidas em resultado desconhecido; Redis fora: 503) e R12. Chave propria
        (nekkora.criacao-organizacao.enabled) e a da entrada geral: qualquer uma desligada, 404. Em seguida, a troca
        (/api/v1/sessions/organization) da a sessao de organizacao.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCreateRequest' } } } }
      responses:
        '201': { description: 'Organizacao criada', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCreated' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido; sem step-up recente, teto atingido, identidade inelegivel ou sessao restrita (recusa generica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/links/start:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLinkStart
      summary: 'Vinculacao, etapa 1: prova da conta antiga (senha + TOTP ou codigo de recuperacao da conta); 204 + cookie do desafio'
      description: >
        P3 (contrato de 2026-10-13). Sessao de identidade nao restrita (cookie __Host-nekkora_id) e CSRF dela. A conta e
        procurada pelo e-mail da propria identidade na organizacao pedida: a pessoa nunca informa outro e-mail, outra conta
        ou outra pessoa, e nenhum administrador vincula em nome de alguem. Corpo: organizationId, password e EXATAMENTE um
        de code (TOTP da conta) e recoveryCode (codigo de recuperacao da conta); nenhum ou os dois, password ausente ou
        organizationId malformado: 400. Argon2 fora da transacao (hash ficticio quando nao ha conta, mesmo custo); depois,
        numa transacao, na ordem global da 017: identidade e sessao travadas e reconferidas, organizacao FOR SHARE, conta FOR
        UPDATE (credencial IGUAL a conferida pelo Argon2, conta interna elegivel e nao vinculada, mesmo e-mail), fator local
        com anti-replay (passo so avanca) ou codigo local consumido (evento mfa_events 2 e aviso, como no login), revogacao do
        desafio anterior da identidade e o desafio novo, amarrado ao par exato identidade/conta, valido por 5 min; a sessao e
        a janela do passo sao reconferidas antes do commit. Sucesso: 204 e o cookie __Host-nekkora_link (SameSite=Strict,
        Max-Age=300); a etapa 1 NAO vincula. QUALQUER falha da prova: o mesmo 401, sem distinguir conta inexistente, senha
        errada, codigo errado, conta inelegivel, organizacao inativa ou conta ja vinculada. R13 (5 falhas em 15 min por
        identidade e por conta alvo; falha fechada) e R12. Sessao restrita a recuperacao: 403. Chave propria
        (nekkora.vinculacao.enabled) e a da entrada geral: qualquer uma desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkStartRequest' } } } }
      responses:
        '204': { description: 'Desafio de vinculacao emitido (cookie __Host-nekkora_link); nada vinculado ainda' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: 'Sem sessao de identidade valida, ou prova da conta antiga recusada (resposta unica para qualquer causa)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unauthenticated } } } }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/links/confirm:
    post:
      tags: [Entrada geral (identidade)]
      operationId: identityLinkConfirm
      summary: 'Vinculacao, etapa 2: prova da identidade (step-up de ate 5 min) e consumo do desafio; fecha a entrada local da conta'
      description: >
        P3. Sessao de identidade nao restrita COM step-up de ate 5 min (/api/v1/auth/step-up), o cookie __Host-nekkora_link
        da etapa 1 e o CSRF da sessao de identidade. Uma transacao que chama so identity_link_account (017): sob os seus
        locks, a funcao reconfere step-up, conta, e-mail e ausencia de vinculo e consome o desafio so se ele for da identidade
        da sessao, estiver no prazo e a credencial da conta ainda for a da etapa 1; no mesmo commit, revoga as sessoes da
        organizacao da conta, invalida desafios, tokens e codigos locais, desabilita o fator local, grava o vinculo
        (link_channel vinculacao) e o evento 9 (IDENTITY_LINKED). Depois do commit, aviso ao endereco. Sucesso: 204; recusa
        da funcao (sem step-up, desafio ausente, vencido, de outra identidade, substituido ou ja usado, credencial trocada,
        conta inelegivel ou ja vinculada): 403 generico, sem efeito. Nos dois casos o cookie do desafio expira. Em seguida, a
        pessoa entra na organizacao pela troca (/api/v1/sessions/organization). R12. Chaves: as mesmas da etapa 1.
      security: [ { identitySessionCookie: [], linkChallengeCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LinkConfirmRequest' } } } }
      responses:
        '204': { description: 'Conta vinculada; a entrada local da conta foi fechada no mesmo ato' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF invalido, sessao restrita, ou recusa da vinculacao (generica)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/sessions/organization:
    post:
      tags: [Entrada geral (identidade)]
      operationId: exchangeOrganizationSession
      summary: 'Troca a sessao de identidade por sessao de organizacao; resposta unica para qualquer recusa'
      description: >
        Missao 1, desenho 6.5 e DC-17.6. identity_org_session_target indica a candidata; a emissao, em transacao de
        organizacao READ COMMITTED, trava a organizacao antes de tudo, e a trigger da 017 reconfere vinculo, sessao de
        identidade (ativa, nao restrita), identidade e elegibilidade da conta, da organizacao e do vinculo interno. Sucesso:
        sessao de organizacao no cookie __Host-nekkora_session (SameSite=Lax), com o marcador de MFA herdado e prazo que nao
        passa o da sessao de identidade; as rotas /api/v1/o/{org}/... funcionam sem alteracao, e a sessao cai na requisicao
        seguinte se a sessao de identidade for encerrada (DC-17.4). Organizacao inexistente, suspensa ou encerrada, sem
        vinculo, vinculo inativo, conta inelegivel ou mudanca entre a resolucao e a emissao: 200 sem_acesso, sem distinguir
        a causa. As duas respostas 200 tem o mesmo piso de tempo. R10 (por sessao de identidade) e R12. organizationId
        malformado ou ausente: 400. Sessao restrita a recuperacao: 403. Mesma chave da entrada geral: desligada, 404.
      security: [ { identitySessionCookie: [], csrfHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSessionRequest' } } } }
      responses:
        '200': { description: 'sessao_criada (cookie __Host-nekkora_session e CSRF da sessao de organizacao) ou sem_acesso', content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSessionResult' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Origin/CSRF da sessao de identidade invalido, ou sessao restrita a recuperacao (DC-17.13)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } } }
        '404': { $ref: '#/components/responses/SignupDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

