        automacao (409 + license_required ou license_expired) e o validUntil gravado e o MENOR entre o pedido e o fim da
        cobertura da licenca sem lacuna entre periodos (uma renovacao que comeca depois de um intervalo nao estende a
        autorizacao). A resposta traz o validUntil efetivo.
