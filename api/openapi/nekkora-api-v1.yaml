        Exige automation.manage; corpo application/zip ate 50 MiB com Content-Length. O servidor nao executa nada: le o ZIP pelo diretorio central (sem cifragem, ZIP64, ligacao simbolica, caminho absoluto ou com .., nome repetido), confere o manifesto nekkora-studio/codegen-manifest 1.4+ e cada arquivo listado pelo hash declarado, recusa pacote que pede segredo, calcula o sha256 dos bytes e a impressao package-fingerprint/1 e grava os bytes no armazenamento da API (chave = sha256). A versao passa a referenciar 'nekkora-artifact:<artifactId>' (nunca caminho ou URL do cliente). Os mesmos bytes de novo: idempotente. Recusa do pacote: 422 com motivo de vocabulario fechado. Versao publicada: 409. Armazenamento nao configurado: 503. Auditado (ato 5).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: version, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/zip: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: 'Artefato aceito', content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleVersion' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Pacote recusado', content: { application/json: { schema: { $ref: '#/components/schemas/PackageRejected' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
