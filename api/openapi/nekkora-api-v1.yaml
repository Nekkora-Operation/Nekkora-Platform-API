  /api/v1/o/{org}/automations/{automationId}/draft/artifact:
    put:
      tags: [Ciclo de vida das automacoes]
      operationId: putAutomationDraftPackage
      summary: 'Envia o pacote do rascunho da automacao; o rascunho nasce quando o ZIP e aceito (T09)'
      description: >
        PLATFORM-AGENT-V2-002, T09. Exige automation.manage; automacao e workspace ACTIVE. O ZIP e inspecionado antes de
        qualquer escrita: recusado -> 422 package_rejected, nada criado e o pacote anterior preservado. Sem rascunho e sem
        expectativa: cria a versao DRAFT (numero MAX+1) e o artefato na mesma transacao -> 201. Com rascunho e a expectativa
        igual a ele (expectedDraftVersionId e, se ele ja tem pacote, expectedSha256 do pacote atual): substitui o pacote da
        MESMA versao -> 200. Expectativa diferente do rascunho atual (outra aba ou pessoa, ou o rascunho esperado foi
        publicado): 409 conflict + reason draft_changed, nada sobrescrito; exceto se o rascunho ja tem exatamente estes bytes
        (repeticao apos resposta perdida) -> 200 com o mesmo rascunho. No maximo um rascunho por automacao, garantido no
        banco (032). Nao publica nem executa nada. runtime e argument (repetivel, ate 20) valem so para o rascunho criado.
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Org' }
        - { name: automationId, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' }
        - { name: expectedDraftVersionId, in: query, required: false, schema: { type: string, format: uuid }, description: 'ausente = espera que nao exista rascunho' }
        - { name: expectedSha256, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'sha256 do pacote atual do rascunho esperado; ausente = rascunho sem pacote' }
        - { name: runtime, in: query, required: false, schema: { type: string, pattern: '^python3\.[0-9]{1,2}$' } }
        - { name: argument, in: query, required: false, schema: { type: array, maxItems: 20, items: { type: string, maxLength: 512 } }, style: form, explode: true }
      requestBody: { required: true, content: { application/zip: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: 'Pacote do rascunho existente substituido (ou repeticao com os mesmos bytes)', content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleVersion' } } } }
        '201': { description: 'Rascunho criado com o pacote aceito', content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleVersion' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Pacote recusado: nada criado, pacote anterior preservado', content: { application/json: { schema: { $ref: '#/components/schemas/PackageRejected' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

