  /api/v1/o/{org}/client-grants/{grant}/approve:
    post:
      tags: [Acessos]
      operationId: approveClientGrant
      summary: 'Aprova: PENDENTE -> ATIVA, aprovacao INITIAL (step-up)'
      description: >
        Aprovacao vinculada aos valores pedidos (D-GRANT-1a, 024): nextReviewAt e expiresAt sao os valores que o aprovador conferiu e precisam ser IGUAIS aos pedidos na criacao (diferentes: 409 valores_divergentes; proxima revisao pedida ja vencida: 409 proxima_revisao_vencida). Fora de PENDENTE: 409. Segunda pessoa (D-GRANT-1, 024): aprovador igual ao solicitante: 403; concessao sem solicitante gravado (anterior a 024): 409 (revogue e crie de novo). A 023 e a 024 conferem no banco a permissao do aprovador, a separacao e os valores. Auditoria (access_events 10).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: grant, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantApprovalRequest' } } } }
      responses:
        '200': { description: 'Concessao ativa', content: { application/json: { schema: { $ref: '#/components/schemas/GrantState' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/client-grants/{grant}/renew:
    post:
      tags: [Acessos]
      operationId: requestClientGrantRenewal
      summary: 'Pede renovacao (ATIVA ou SUSPENSA): grava o pedido, sem mudar o acesso'
      description: >
        D-GRANT-1a (024): toda extensao de uma concessao aprovada (proxima revisao ou prazo mais tarde, prazo removido,
        SUSPENSA -> ATIVA) e um pedido seguido da aprovacao de OUTRA pessoa (/renew/approve) com exatamente os valores
        pedidos. justification obrigatoria; nextReviewAt futuro; expiresAt nulo = sem prazo. Um pedido novo substitui o
        anterior; qualquer mudanca de validade (KEEP com data mais cedo, suspensao, revogacao, outra aprovacao) descarta o
        pedido pendente. Sem step-up (o pedido nao amplia nada). Outros estados: 409. Auditoria (access_events 14).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: grant, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantApprovalRequest' } } } }
      responses:
        '202': { description: 'Pedido gravado (renewal preenchido); acesso inalterado', content: { application/json: { schema: { $ref: '#/components/schemas/GrantState' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/client-grants/{grant}/renew/approve:
    post:
      tags: [Acessos]
      operationId: approveClientGrantRenewal
      summary: 'Aprova o pedido de renovacao: -> ATIVA, aprovacao RENEWAL (step-up, outra pessoa)'
      description: >
        nextReviewAt e expiresAt sao os valores que o aprovador conferiu e precisam ser IGUAIS aos do pedido (diferentes:
        409 valores_divergentes). O solicitante nao aprova (403). Sem pedido pendente (nunca houve ou caiu com uma mudanca
        de validade): 409 sem_renovacao_pendente; proxima revisao pedida ja vencida: 409 proxima_revisao_vencida. Os
        valores anteriores, os novos e o solicitante ficam na aprovacao (003/024). O banco confere de novo. Auditoria
        (access_events 11).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: grant, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantApprovalRequest' } } } }
      responses:
        '200': { description: 'Concessao ativa com os valores pedidos', content: { application/json: { schema: { $ref: '#/components/schemas/GrantState' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/o/{org}/client-grants/{grant}/review:
    post:
      tags: [Acessos]
      operationId: reviewClientGrant
      summary: 'Revisao periodica: KEEP (step-up, sem estender), SUSPEND ou REVOKE'
      description: >
        KEEP e SUSPEND so em ATIVA; REVOKE em ATIVA ou SUSPENSA; outros: 409. KEEP (D-GRANT-1a, 024): sem nextReviewAt ou com a mesma data, so registra a revisao; com data mais cedo (futura), reduz; data mais tarde estenderia o acesso: 409 keep_estenderia_prazo (use o pedido de renovacao). Reducao, suspensao e revogacao descartam o pedido de renovacao pendente. A revisao fica na tabela propria da 003. Auditoria (access_events 12, com a decisao).
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Org' }, { name: grant, in: path, required: true, schema: { type: string, format: uuid }, description: 'malformado -> 400' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantReviewRequest' } } } }
