# Testes da API v1 (unitarios e integracao com PostgreSQL 16 e Redis descartaveis, por Testcontainers) a cada PR e a cada
# push na main. Sem credenciais: cada teste gera as proprias senhas e chaves. Sem -Dmaven.test.failure.ignore: falha de
# compilacao, teste com falha ou com erro reprova o check. O check NAO detecta sozinho teste pulado ou que deixou de rodar
# (@Disabled, suposicao nao atendida, classe fora do padrao do surefire): as contagens de "Skipped" e de testes ficam no
# log e nos relatorios publicados abaixo, para leitura. Bash do runner (Ubuntu) e 5.x, compativel com o FixtureRunnerIT.
# Fora daqui (manuais, descritos nos READMEs e nos PRs): suites de banco em db/tests e o E2E entre processos (api/e2e).
name: api-testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ambiente
        run: |
          java -version
          bash --version | head -1
          docker version --format 'docker {{.Server.Version}}'
      - name: Testes (core, ops, platform, portal, agent-gateway)
        working-directory: api
        run: ./mvnw -B -ntp test
      - name: Relatorios do surefire (so valores descartaveis dos testes; 14 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/*/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn
