# Homologacao INTERNA da API v1 (Platform + Portal + PostgreSQL 16 + Redis + gateway TLS). Ambiente da equipe Nekkora,
# com dados sinteticos; nao e o ambiente oferecido a clientes. Operado por ops/homologacao/homologacao.sh, que gera os
# segredos FORA do Git (HOMOLOG_SEGREDOS) e preenche as variaveis abaixo. Nenhum valor secreto neste arquivo.
#
# Redes: "interna" (internal: true, sem saida e sem porta publicada) para banco, Redis, servicos e jobs; "borda" so
# para o gateway, o unico servico publicado (HOMOLOG_BIND:HOMOLOG_PORTA -> 443). IPs fixos: o pg_hba autoriza cada
# identidade so a partir do proprio container. Prefixos /24 parametrizados (HOMOLOG_REDE_INTERNA/BORDA; padrao
# 10.252.10/10.252.11, o dos ambientes ja criados); o runner recusa sobreposicao com qualquer rede Docker existente.
name: ${HOMOLOG_PROJETO:?defina HOMOLOG_PROJETO}

x-rotulos: &rotulos
  nekkora.homologacao: ${HOMOLOG_ID:?defina HOMOLOG_ID}

networks:
  interna:
    internal: true
    labels: *rotulos
    ipam:
      config:
        - subnet: ${HOMOLOG_REDE_INTERNA:-10.252.10}.0/24
  borda:
    labels: *rotulos
    ipam:
      config:
        - subnet: ${HOMOLOG_REDE_BORDA:-10.252.11}.0/24

volumes:
  pgdata:
    labels: *rotulos

secrets:
  postgres_admin:
    file: ${HOMOLOG_SEGREDOS:?}/postgres_admin
  flyway_conf:
    file: ${HOMOLOG_SEGREDOS:?}/flyway.conf

services:
  postgres:
    image: ${HOMOLOG_IMG_POSTGRES:-postgres:16-alpine}
    labels: *rotulos
    secrets: [postgres_admin]
    environment:
      POSTGRES_USER: admin_cluster
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    # a chave TLS precisa pertencer ao usuario postgres com modo 600: copiada antes do entrypoint oficial
    entrypoint:
      - sh
      - -ec
      - >-
        install -d -o postgres -g postgres -m 700 /tls &&
        install -o postgres -g postgres -m 600 /tls-src/postgres.key /tls/postgres.key &&
        install -o postgres -g postgres -m 644 /tls-src/postgres.crt /tls/postgres.crt &&
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - hba_file=/etc/nekkora/pg_hba.conf
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/postgres.crt
      - -c
      - ssl_key_file=/tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - cluster_name=nekkora-homologacao
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/nekkora/pg_hba.conf:ro
      - ${HOMOLOG_SEGREDOS:?}/tls:/tls-src:ro
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.10
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -q"]
      interval: 3s
      timeout: 3s
      retries: 60

  redis:
    image: ${HOMOLOG_IMG_REDIS:-redis:7-alpine}
    labels: *rotulos
    # so TLS (porta sem TLS desligada), usuario default desligado, ACL por servico (arquivo gerado fora do Git)
    entrypoint:
      - sh
      - -ec
      - >-
        install -d -o redis -g redis -m 700 /tls /acl &&
        install -o redis -g redis -m 600 /tls-src/redis.key /tls/redis.key &&
        install -o redis -g redis -m 644 /tls-src/redis.crt /tls/redis.crt &&
        install -o redis -g redis -m 644 /tls-src/ca.crt /tls/ca.crt &&
        install -o redis -g redis -m 600 /acl-src/users.acl /acl/users.acl &&
        exec docker-entrypoint.sh redis-server --port 0 --tls-port 6379 --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key
        --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --tls-protocols "TLSv1.2 TLSv1.3" --aclfile /acl/users.acl
        --save "" --appendonly no --protected-mode yes
    volumes:
      - ${HOMOLOG_SEGREDOS:?}/tls:/tls-src:ro
      - ${HOMOLOG_SEGREDOS:?}/redis:/acl-src:ro
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.11
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      # sem credencial no healthcheck: o servidor responde NOAUTH ao PING anonimo (default desligado)
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -h 127.0.0.1 -p 6379 ping 2>&1 | grep -q NOAUTH"]
      interval: 3s
      timeout: 3s
      retries: 40

  platform:
    image: nekkora-homologacao-platform:${HOMOLOG_COMMIT:?}
    build:
      context: ../../api
      dockerfile: e2e/Dockerfile
      args:
        JAR: nekkora-platform/target/nekkora-platform-0.1.0-SNAPSHOT.jar
      labels: *rotulos
    labels: *rotulos
    env_file: ${HOMOLOG_SEGREDOS:?}/platform.env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${HOMOLOG_SEGREDOS:?}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.20
    cpus: 2.0
    mem_limit: 1g

  # processo, datasource e papel PROPRIOS (nekkora_portal): nenhum segredo da Platform chega aqui
  portal:
    image: nekkora-homologacao-portal:${HOMOLOG_COMMIT:?}
    build:
      context: ../../api
      dockerfile: e2e/Dockerfile
      args:
        JAR: nekkora-portal/target/nekkora-portal-0.1.0-SNAPSHOT.jar
      labels: *rotulos
    labels: *rotulos
    env_file: ${HOMOLOG_SEGREDOS:?}/portal.env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${HOMOLOG_SEGREDOS:?}/tls/ca.crt:/tls/ca.crt:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.21
    cpus: 1.0
    mem_limit: 768m

  gateway:
    image: ${HOMOLOG_IMG_NGINX:-nginx:1.29-alpine}
    labels: *rotulos
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOMOLOG_SEGREDOS:?}/tls/gateway.crt:/tls/gateway.crt:ro
      - ${HOMOLOG_SEGREDOS:?}/tls/gateway.key:/tls/gateway.key:ro
    ports:
      - "${HOMOLOG_BIND:-127.0.0.1}:${HOMOLOG_PORTA:?}:443"
    depends_on: [platform, portal]
    networks:
      borda: {}
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.5
    cpus: 0.5
    mem_limit: 128m

  # --- jobs efemeros (docker compose run --rm), fora do "up" ---
  flyway:
    profiles: [implantacao]
    image: ${HOMOLOG_IMG_FLYWAY:-flyway/flyway:11-alpine}
    labels: *rotulos
    secrets:
      - source: flyway_conf
        target: flyway.conf
    volumes:
      - ${HOMOLOG_MIGRACOES:?}:/flyway/sql:ro
      - ${HOMOLOG_SEGREDOS:?}/tls/ca.crt:/tls/ca.crt:ro
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.30

  ferramentas:
    profiles: [ferramentas]
    image: ${HOMOLOG_IMG_POSTGRES:-postgres:16-alpine}
    labels: *rotulos
    entrypoint: []
    volumes:
      - ${HOMOLOG_SEGREDOS:?}/tls/ca.crt:/tls/ca.crt:ro
      - ${HOMOLOG_SQL:?}:/sql:ro
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.31

  backup:
    profiles: [backup]
    image: ${HOMOLOG_IMG_POSTGRES:-postgres:16-alpine}
    labels: *rotulos
    entrypoint: []
    volumes:
      - ${HOMOLOG_SEGREDOS:?}/tls/ca.crt:/tls/ca.crt:ro
    networks:
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.32
