# SOBREPOSICAO: transporte REAL de e-mail (Microsoft Graph, so de aplicacao, certificado, RBAC para Aplicacoes restrito a
# no-reply@nekkora.com) num ambiente ensaio-* de homologacao (missao do e-mail real em homologacao). Ligada SO pela acao
# "homologacao.sh email-real <id> ligar", que confere antes a fila, as credenciais temporarias e a lista de destinatarios,
# e desligada por "email-real <id> desligar" (volta ao transporte de homologacao). No lugar de compose.caixa.yml: os dois
# transportes sao exclusivos. Nao usar antes da autorizacao especifica das acoes externas (Microsoft 365, DNS, AWS e envio
# real): docs/relatorios/2026-10-24-email-real-homologacao.md.
#
# Segredos (diretorio de segredos do ambiente, fora do Git; nenhum valor neste arquivo):
#   m365/aws.env   credenciais TEMPORARIAS da AWS (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN), da funcao
#                  de leitura do segredo; a Platform le o segredo uma vez, na partida, e recusa credencial sem token de sessao
#   m365/fila.env  chave PROPRIA da fila (NEKKORA_FILA_CHAVE_ID, NEKKORA_FILA_CHAVES), gerada pelo runner
# O cliente (App ID) e o certificado PKCS#12 ficam SO no segredo nekkora/homologacao/platform/m365 do AWS Secrets Manager
# (formato nekkora-m365/1): nenhum arquivo de chave privada no host.
#
# Rede: a Platform CONTINUA so na rede "interna" (internal: true, sem saida). O unico caminho para fora e o proxy-m365,
# que esta na interna e numa rede de saida propria, e so abre tuneis CONNECT 443 para login.microsoftonline.com,
# graph.microsoft.com e secretsmanager.sa-east-1.amazonaws.com (proxy/squid.conf). Parar o proxy-m365 corta toda a saida.

networks:
  saida_m365:
    labels:
      nekkora.homologacao: ${HOMOLOG_ID:?defina HOMOLOG_ID}

services:
  proxy-m365:
    image: ${HOMOLOG_IMG_PROXY:-ubuntu/squid:5.2-22.04_beta@sha256:723891b5bc74fe86d271589927c36c6b205fafca48b2bbe4932e3110c7d6bcc7}
    labels:
      nekkora.homologacao: ${HOMOLOG_ID:?}
    read_only: true
    # tmpfs do usuario proxy (uid/gid 13 na imagem): sem isso o squid nao abre o log e nao sobe (raiz somente leitura)
    tmpfs:
      - /var/log/squid:uid=13,gid=13,mode=0750
      - /var/spool/squid:uid=13,gid=13,mode=0750
      - /var/run:uid=13,gid=13
      - /run:uid=13,gid=13
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      saida_m365: {}
      interna:
        ipv4_address: ${HOMOLOG_REDE_INTERNA:-10.252.10}.34
    cpus: 0.5
    mem_limit: 128m

  platform:
    env_file:
      - ${HOMOLOG_SEGREDOS:?}/m365/aws.env
      - ${HOMOLOG_SEGREDOS:?}/m365/fila.env
    environment:
      NEKKORA_AMBIENTE: ${HOMOLOG_ID:?}
      NEKKORA_MAIL_TRANSPORTE: m365
      NEKKORA_MAIL_REMETENTE: no-reply@nekkora.com
      # Tenant ID do Entra dono de nekkora.com (descoberta OpenID publica, 2026-10-23); NAO o GUID da organizacao do
      # Exchange (facfe491-..., Get-OrganizationConfig.Guid). O segredo tem de trazer o mesmo tenant_id
      NEKKORA_M365_TENANT: ae4ed48d-e7d8-4f24-83f2-443e997c5a65
      NEKKORA_M365_SEGREDO_AWS: nekkora/homologacao/platform/m365
      NEKKORA_M365_AWS_REGIAO: sa-east-1
      NEKKORA_M365_PROXY: proxy-m365:3128
      # lista fechada de destinatarios (enderecos controlados; m365/destinatarios.txt, fora do Git), obrigatoria em ensaio-*
      NEKKORA_MAIL_DESTINATARIOS_PERMITIDOS: ${HOMOLOG_M365_DESTINATARIOS:?lista de destinatarios controlados}
      NEKKORA_AVISOS_EMERGENCIA: "true"
    depends_on: [proxy-m365]
