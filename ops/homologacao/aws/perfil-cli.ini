# Perfis do AWS CLI v2 (>= 2.32, "aws login") para a homologacao do e-mail real. MODELO: "m365-aws.sh renderizar" troca
# ${CONTA_AWS} e ${MFA_SERIAL} e grava a copia em <segredos>/m365/aws/perfil-cli.ini, para acrescentar a ~/.aws/config.
# Nenhuma chave de acesso: nekkora-login e a sessao do console (com MFA) aberta por "aws login --profile nekkora-login";
# nekkora-hml-m365 assume a funcao so de leitura pedindo o codigo do MFA a cada sessao de 1 h.

[profile nekkora-login]
region = sa-east-1

[profile nekkora-hml-m365]
role_arn = arn:aws:iam::${CONTA_AWS}:role/nekkora-homologacao-platform-m365-leitura
source_profile = nekkora-login
mfa_serial = ${MFA_SERIAL}
duration_seconds = 3600
role_session_name = nekkora-hml-m365
region = sa-east-1
