# Proxy de SAIDA do transporte real de e-mail (missao PLATFORM-API-V1-003, item 6; desenho DC-M2.x, opcao (a) da sec. 5.E
# do relatorio do e-mail). PREPARADO para revisao: so entra em uso com a autorizacao do transporte real (compose.m365.yml).
# Unica funcao: tuneis CONNECT na porta 443 para os TRES nomes: Entra, Graph e o Secrets Manager da regiao do segredo
# (sa-east-1; o segredo do transporte e lido uma vez, na partida). Tudo o mais e recusado. Sem cache, sem
# inspecao TLS (os tokens e o conteudo seguem cifrados ponta a ponta), log so de destino e resultado (sem caminho: e TLS), em /var/log/squid do container (o usuario proxy nao escreve em /dev/stdout).
http_port 3128
acl m365 dstdomain login.microsoftonline.com graph.microsoft.com secretsmanager.sa-east-1.amazonaws.com
acl porta_tls port 443
acl CONNECT method CONNECT
http_access deny !CONNECT
http_access deny CONNECT !porta_tls
http_access allow CONNECT m365
http_access deny all
cache deny all
via off
forwarded_for delete
logformat nekkora %ts.%03tu %>a %rm %ru %>Hs %<st
access_log stdio:/var/log/squid/access.log nekkora
cache_log /var/log/squid/cache.log
pid_filename none
